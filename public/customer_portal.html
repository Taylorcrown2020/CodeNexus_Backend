/* ============================================================================
   SIGNING — the preview mirrors the server's generator exactly
   ============================================================================ */
function signatureSVG(name){
  const clean = String(name || '').trim().slice(0,48);
  if(!clean) return '';
  let seed = 0;
  for(let i = 0; i < clean.length; i++) seed = (seed * 31 + clean.charCodeAt(i)) % 100000;
  const rand = () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
  const W = 420, H = 110, base = 74, pts = [], segs = 26;
  for(let i = 0; i <= segs; i++){
    const t = i / segs, x = 24 + t * (W - 60);
    const y = base + 12 + Math.sin(t * Math.PI * 3 + rand() * 0.4) * 5 + Math.sin(t * Math.PI * 7) * 1.6;
    pts.push(x.toFixed(1) + ',' + y.toFixed(1));
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" aria-label="Signature preview">' +
    '<text x="28" y="' + base + '" font-family="Segoe Script, Brush Script MT, Lucida Handwriting, cursive" font-size="40" fill="#0d0f12">' + esc(clean) + '</text>' +
    '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#0d0f12" stroke-width="1.6" stroke-linecap="round" opacity=".75"/></svg>';
}

async function openSign(agreementId){
  /* THE ENTIRE AGREEMENT IS RENDERED HERE.
     Previously this sheet showed sales_agreements.terms — one paragraph an
     admin typed — inside a 180px scroll box, and called that the agreement.
     Everything actually binding (payment, autopay, liability, IP, termination,
     governing law) was never on screen at all.
     Now the server renders the whole document from diamondback-documents.js,
     the same module that produces the PDF and the signature snapshot, so what
     is signed, what is downloaded and what is stored as proof are necessarily
     the same text. */
  sheet('<h2 class="sheet-h">Agreement</h2>' +
        '<p class="sheet-sub">Loading the full document&hellip;</p>' +
        '<div class="doc-loading">One moment.</div>');

  let doc;
  try{
    doc = await api('/api/portal/sales-agreements/' + agreementId + '/document');
  }catch(e){
    return sheet('<h2 class="sheet-h">Agreement</h2>' +
      '<div class="alert alert-err">' + esc(e.message) + '</div>' +
      '<div class="sheet-actions"><button class="btn btn-ghost" onclick="closeSheet()">Close</button></div>');
  }

  const m = doc.meta || {};
  const autopay = !!doc.autopay;

  if(m.signed){
    return sheet('<h2 class="sheet-h">' + esc(m.title || 'Agreement') + '</h2>' +
      '<p class="sheet-sub">' + esc(m.number || '') + ' &middot; Signed</p>' +
      '<div class="alert alert-ok">This agreement is signed. Your copy is in Receipts &amp; Docs.</div>' +
      '<div class="doc-scroll">' + doc.html + '</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" onclick="closeSheet()">Close</button>' +
        '<button class="btn btn-primary" onclick="downloadAgreement(' + agreementId + ',this)">Download</button>' +
      '</div>');
  }

  sheet('<h2 class="sheet-h">' + esc(m.title || 'Agreement') + '</h2>' +
    '<p class="sheet-sub">' + esc(m.number || '') +
      (autopay ? ' &middot; ' + esc(m.autopayScheduleSentence || 'Automatic payment') : '') + '</p>' +

    '<div class="doc-scroll" id="sgDoc">' + doc.html + '<div class="doc-end" id="sgEnd"></div></div>' +

    /* The gate. Signing stays locked until the document has been read to the
       end — fair to the customer, and it is the evidence that the whole thing
       was displayed. */
    '<div class="doc-gate" id="sgGate">' +
      '<p>Read to the end of the agreement to sign it.</p>' +
      '<button class="btn btn-ghost btn-sm" id="sgJump">Jump to end</button>' +
    '</div>' +

    '<div id="sgControls" class="hidden">' +
      (autopay
        ? '<div class="autopay-consent">' +
            '<div class="lbl">Automatic payment authorization</div>' +
            '<label class="consent"><input type="checkbox" id="sgAutopay">' +
              '<span>' + esc(doc.autopayConsentText || '') + '</span></label>' +
          '</div>'
        : '') +
      '<div class="field" style="margin-top:18px"><label for="sgName">Type your full legal name to sign</label>' +
        '<input class="input" id="sgName" placeholder="Your full name" autocomplete="name"></div>' +
      '<div class="sign-pad" id="sgPad"><span style="color:var(--faint);font-size:13px">Your signature appears as you type</span></div>' +
      '<label class="consent"><input type="checkbox" id="sgAgree">' +
        '<span>I have read this agreement in full and agree to its terms, and I consent to signing ' +
        'electronically. I understand this is legally binding.</span></label>' +
      '<div id="sgErr" class="alert alert-err hidden"></div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" onclick="closeSheet()">Cancel</button>' +
        '<button class="btn btn-primary" id="sgGo">Sign agreement</button></div>' +
    '</div>');

  const box = document.querySelector('.sheet-box');
  const gate = document.getElementById('sgGate');
  const controls = document.getElementById('sgControls');
  const endMark = document.getElementById('sgEnd');

  document.getElementById('sgJump').onclick = () => {
    endMark.scrollIntoView({behavior:'smooth', block:'end'});
  };

  let reachedEnd = false;
  function checkRead(){
    if(reachedEnd) return;
    /* 28px of slack: sub-pixel rounding means scrollTop rarely reaches the
       exact bottom, and a gate that cannot be satisfied is worse than no gate.
       A document shorter than the sheet counts as already read. */
    const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 28;
    const fits  = box.scrollHeight <= box.clientHeight + 4;
    if(!atEnd && !fits) return;
    reachedEnd = true;
    gate.classList.add('hidden');
    controls.classList.remove('hidden');
    wireControls();
  }
  box.addEventListener('scroll', checkRead, {passive:true});
  window.addEventListener('resize', checkRead);
  setTimeout(checkRead, 60);

  function wireControls(){
    const nameEl = document.getElementById('sgName');
    const pad = document.getElementById('sgPad');
    const cbAgree = document.getElementById('sgAgree');
    const cbAuto = document.getElementById('sgAutopay');
    const btn = document.getElementById('sgGo');
    const err = document.getElementById('sgErr');

    nameEl.addEventListener('input', () => {
      pad.innerHTML = signatureSVG(nameEl.value) ||
        '<span style="color:var(--faint);font-size:13px">Your signature appears as you type</span>';
    });
    nameEl.focus();

    btn.onclick = async () => {
      const name = nameEl.value.trim();
      if(name.length < 2){
        err.textContent = 'Type your full name to sign.'; err.classList.remove('hidden'); return;
      }
      if(!cbAgree.checked){
        err.textContent = 'Please tick the box to agree to the terms.'; err.classList.remove('hidden'); return;
      }
      /* Separate from the terms box on purpose. One tick standing for both the
         agreement and the recurring-payment authorization is treated by card
         networks as no authorization at all. */
      if(autopay && cbAuto && !cbAuto.checked){
        err.textContent = 'Please authorize automatic payment to continue.';
        err.classList.remove('hidden'); return;
      }
      err.classList.add('hidden');
      btn.disabled = true; btn.textContent = 'Signing…';
      try{
        const d = await post('/api/portal/sales-agreements/' + agreementId + '/sign', {
          typedName: name,
          agree: true,
          autopayConsent: autopay ? true : undefined,
          viewedInFull: true,
          /* Proves the signature applies to the text that was on screen, not a
             version edited while the sheet sat open. */
          documentHash: doc.documentHash
        });
        closeSheet();
        /* Reload state BEFORE re-rendering, so the agreement already reads
           "Signed & complete" and has moved into Docs — no refresh needed. */
        await loadDash().catch(() => {});
        refreshUnread();
        toast(d.invoice
          ? 'Signed. Invoice ' + d.invoice.number + ' is in your portal, due ' + fmtDate(d.invoice.dueDate) + '.'
          : (d.message || 'Signed.'));
        go(d.kind === 'maintenance' ? 'billing' : 'docs');
      }catch(e){
        /* Already signed is a success from the customer's side. Showing it as a
           red error is how someone ends up signing twice. */
        if(/already signed/i.test(e.message || '')){
          closeSheet();
          await loadDash().catch(() => {});
          toast('This agreement is already signed — your copy is in Docs.');
          return go('docs');
        }
        err.textContent = e.message; err.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Sign agreement';
      }
    };
  }
}

/* ============================================================================
   PAYMENTS — everything inline, no redirect to Stripe
   ============================================================================ */
async function stripeJs(){
  if(STRIPE) return STRIPE;
  if(!window.Stripe) throw new Error('Payment library failed to load. Check your connection and try again.');
  if(!STRIPE_PK){
    const c = await fetch(API + '/api/config/stripe').then(r => r.json()).catch(() => ({}));
    STRIPE_PK = c.publishableKey || c.publishable_key || c.key || '';
    // Surface the server's own explanation. "Not configured" on its own sent
    // people hunting for a Stripe problem that didn't exist — the secret key is
    // usually fine and it's the publishable one that's missing.
    if(!STRIPE_PK && c.message) throw new Error(c.message);
  }
  if(!STRIPE_PK) throw new Error('Card payments are not available yet — the server is missing its Stripe publishable key. Please contact us.');
  STRIPE = window.Stripe(STRIPE_PK);
  return STRIPE;
}

const ELEMENT_LOOK = {
  theme: 'flat',
  variables: {
    colorPrimary: '#0d0f12', colorBackground: '#f7f8f9', colorText: '#0d0f12',
    colorDanger: '#dc2626', fontFamily: 'Plus Jakarta Sans, sans-serif',
    borderRadius: '14px', spacingUnit: '4px'
  }
};

/* opts lets a caller reuse this for a settlement payment: its own title and a
   callback to run once the charge clears (e.g. finish cancelling). */
function payBlockedMessage(id){
  const inv = ((DASH && DASH.invoices) || []).find(x => Number(x.id) === Number(id));
  if(inv && inv.payable === false && inv.hold_reason === 'awaiting_signature'){
    return 'This needs to be signed before it can be paid. Sign it under Docs and the payment unlocks straight away.';
  }
  return null;
}

async function openPay(invoiceId, opts){
  opts = opts || {};
  let inv = ((DASH && DASH.invoices) || []).find(i => i.id === invoiceId);
  // A settlement invoice is raised mid-flow, so it isn't in the cached
  // dashboard yet — reload before giving up on showing the amount.
  if(!inv){
    try{ await loadDash(); inv = (DASH.invoices || []).find(i => i.id === invoiceId); }catch(_){}
  }
  const total = inv ? money(inv.total_amount) : '';

  // Refuse to open a payment sheet for something that isn't payable yet. A
  // settlement invoice (opts.force) is raised deliberately mid-cancellation and
  // is always payable, so it bypasses this.
  if(!opts.force){
    const blocked = payBlockedMessage(invoiceId);
    if(blocked){
      sheet('<h2 class="sheet-h">Signature needed first</h2>' +
        '<p class="sheet-sub">' + esc(blocked) + '</p>' +
        '<div class="sheet-actions">' +
          '<button class="btn btn-ghost" onclick="closeSheet()">Close</button>' +
          '<button class="btn btn-primary" onclick="closeSheet();go(\'docs\')">Go to Docs</button></div>');
      return;
    }
  }
  sheet('<h2 class="sheet-h">' + esc(opts.title || ('Pay ' + (inv ? inv.invoice_number : 'invoice'))) + '</h2>' +
    '<p class="sheet-sub">' + esc(opts.subtitle ||
      'Card and billing details are entered here. Your details go straight to Stripe — we never see or store them.') + '</p>' +
    (inv ? '<div class="pay-summary">' +
      '<div class="r"><span>Subtotal</span><span>' + money(inv.subtotal != null ? inv.subtotal : inv.total_amount) + '</span></div>' +
      (Number(inv.tax_amount) > 0 ? '<div class="r"><span>Tax</span><span>' + money(inv.tax_amount) + '</span></div>' : '') +
      '<div class="r total"><span>Total due</span><span>' + total + '</span></div></div>' : '') +
    '<div id="cardMount"><p style="color:var(--muted);font-size:13.5px;text-align:center;padding:16px 0">Loading secure form…</p></div>' +
    '<div id="payErr" class="alert alert-err hidden" style="margin-top:14px"></div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" onclick="closeSheet()">Cancel</button>' +
      '<button class="btn btn-primary" id="payGo" disabled>Pay ' + total + '</button></div>');

  try{
    const stripe = await stripeJs();
    const d = await post('/api/portal/invoices/' + invoiceId + '/payment-intent', {});
    if(!d.clientSecret) throw new Error(d.message || 'Could not start the payment.');

    /* PaymentElement collects card AND full billing address in this sheet.
       redirect:'if_required' means the customer only leaves if their bank forces
       a 3-D Secure step — which no integration can skip. */
    const elements = stripe.elements({clientSecret: d.clientSecret, appearance: ELEMENT_LOOK});
    const pe = elements.create('payment', {layout:'tabs', fields:{billingDetails:'auto'}});
    pe.mount('#cardMount');
    pe.on('ready', () => { const b = document.getElementById('payGo'); if(b) b.disabled = false; });

    document.getElementById('payGo').onclick = async () => {
      const btn = document.getElementById('payGo');
      const err = document.getElementById('payErr');
      err.classList.add('hidden');
      btn.disabled = true; btn.textContent = 'Processing…';
      const res = await stripe.confirmPayment({elements, redirect:'if_required'});
      if(res.error){
        err.textContent = res.error.message; err.classList.remove('hidden');
        btn.disabled = false; btn.textContent = 'Pay ' + total;
        return;
      }
      try{
        await post('/api/portal/invoices/' + invoiceId + '/confirm-paid',
          {paymentIntentId: res.paymentIntent && res.paymentIntent.id});
      }catch(_){}
      closeSheet();
      await loadDash().catch(() => {});
      if(typeof opts.onPaid === 'function'){
        // e.g. the cancellation that this payment unblocks.
        await opts.onPaid();
        return;
      }
      toast('Payment received — your receipt is in Receipts & Docs.');
      go('billing');
    };
  }catch(e){
    const err = document.getElementById('payErr');
    if(err){ err.textContent = e.message; err.classList.remove('hidden'); }
    const mount = document.getElementById('cardMount');
    if(mount) mount.innerHTML = '';
  }
}

/* ---- plan payment method + cancellation ---- */
function changePm(kind, id){
  const plan = PLANS.find(p => p.kind === kind && String(p.id) === String(id)) || {};
  const others = PLANS.filter(p => !(p.kind === kind && String(p.id) === String(id)) && p.payment_method);

  const saved = PMS.length ? PMS.map(m => {
    const cur = plan.payment_method && (
      (plan.payment_method.id && plan.payment_method.id === m.id) ||
      (plan.payment_method.stripe_pm_id && plan.payment_method.stripe_pm_id === m.stripe_pm_id));
    const name = m.type === 'card' ? esc(m.brand || 'Card') + ' ····' + esc(m.last4 || '')
                                   : esc(m.bank_name || 'Bank') + ' ····' + esc(m.last4 || '');
    return '<label class="pm-row"><input type="radio" name="pmc" value="saved:' + m.id + '" ' + (cur ? 'checked' : '') + '>' +
      '<span style="flex:1">' + name + (cur ? ' <span style="color:var(--muted);font-size:12.5px">(current)</span>' : '') + '</span></label>';
  }).join('') : '<p style="color:var(--muted);font-size:13.5px;margin-bottom:10px">No saved payment methods yet.</p>';

  const same = others.length
    ? '<div class="sec-label" style="margin:18px 0 6px">Or reuse another plan&rsquo;s method</div>' +
      others.map(o => '<label class="pm-row"><input type="radio" name="pmc" value="same:' + o.kind + ':' + o.id + '">' +
        '<span style="flex:1">Same as <b>' + esc(o.label) + '</b> <span style="color:var(--muted);font-size:12.5px">&mdash; ' +
        esc(o.payment_method.brand || o.payment_method.bank_name || 'card') + ' ····' + esc(o.payment_method.last4 || '') +
        '</span></span></label>').join('')
    : '';

  sheet('<h2 class="sheet-h">Payment method</h2>' +
    '<p class="sheet-sub">for ' + esc(plan.label || 'this plan') + '</p>' +
    saved + same +
    '<div id="pmcErr" class="alert alert-err hidden" style="margin-top:14px"></div>' +
    '<button class="btn btn-ghost btn-block" style="margin-top:16px" onclick="closeSheet();addMethod(\'card\')">+ Add a new card</button>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" onclick="closeSheet()">Cancel</button>' +
      '<button class="btn btn-primary" id="pmcGo">Save</button></div>');

  document.getElementById('pmcGo').onclick = async () => {
    const sel = document.querySelector('input[name="pmc"]:checked');
    const err = document.getElementById('pmcErr');
    if(!sel){ err.textContent = 'Choose a payment method, or add a new one.'; err.classList.remove('hidden'); return; }
    const btn = document.getElementById('pmcGo');
    btn.disabled = true; btn.textContent = 'Saving…';
    const parts = sel.value.split(':');
    const body = parts[0] === 'saved'
      ? {paymentMethodId: Number(parts[1])}
      : {sameAsPlanKind: parts[1], sameAsPlanId: Number(parts[2])};
    try{
      const d = await post('/api/portal/plans/' + kind + '/' + id + '/payment-method', body);
      closeSheet(); toast(d.message || 'Payment method updated.'); vBilling();
    }catch(e){
      err.textContent = e.message; err.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Save';
    }
  };
}

async function cancelPlan(kind, id){
  const plan = PLANS.find(p => p.kind === kind && String(p.id) === String(id)) || {};
  const isCrm = kind === 'crm';

  // Ask what's owed BEFORE showing the confirm, so the amount is never a
  // surprise at the moment they press the button.
  sheet('<h2 class="sheet-h">Cancel ' + esc(plan.label || 'this plan') + '?</h2>' +
        '<p class="sheet-sub">Checking your account…</p>');
  let quote = null;
  try{ quote = await api('/api/portal/plans/' + kind + '/' + id + '/cancellation-quote'); }
  catch(e){ quote = null; }

  const owed = quote && quote.mustSettle ? Number(quote.total) : 0;
  const endsOn = quote && quote.effectiveAt ? fmtDate(quote.effectiveAt) : null;
  const breakdown = owed && quote.lines && quote.lines.length
    ? '<div class="pay-summary">' +
        quote.lines.map(l => '<div class="r"><span>' + esc(l.label) + '</span><span>' + money(l.amount) + '</span></div>').join('') +
        '<div class="r total"><span>Payable now</span><span>' + money(owed) + '</span></div></div>'
    : '';

  /* An ANNUAL plan does not end in 30 days — it ends at the renewal date they
     have already paid up to, which can be most of a year away. Saying
     "30-day notice period" there is both wrong and alarming, so the copy
     follows the actual end date rather than the notice rule. */
  const annual = plan.interval_unit === 'year';
  const daysLeft = endsOn ? Math.round((new Date(quote.effectiveAt) - Date.now()) / 86400000) : null;

  sheet('<h2 class="sheet-h">Cancel ' + esc(plan.label || 'this plan') + '?</h2>' +
    '<p class="sheet-sub">' + (endsOn
        ? 'Ends ' + endsOn + (daysLeft != null && daysLeft > 0
            ? ' &middot; ' + daysLeft + ' day' + (daysLeft === 1 ? '' : 's') + ' from now' : '')
        : NOTICE_DAYS + '-day notice period') + '.</p>' +
    (owed
      ? '<div class="alert alert-warn">' + (annual
          ? 'Your renewal falls inside the ' + NOTICE_DAYS + '-day notice period, so it is still payable — ' +
            money(owed) + ' needs settling before this can be cancelled. That payment covers you for the ' +
            'full year to ' + (endsOn || 'your next renewal') + ', and nothing is charged after that.'
          : 'Your ' + NOTICE_DAYS + '-day notice period is still payable, so ' + money(owed) +
            ' needs settling before this can be cancelled.') +
        ' You can pay it here and we\'ll cancel straight after.</div>' + breakdown
      : '<div class="alert alert-info">' + (isCrm
          ? 'You keep full CRM access until the notice period ends. <b>Your customer portal isn\'t affected</b> — invoices, receipts and messages stay right here.'
          : annual
            ? 'You have already paid for this year, so you keep the service right through to ' +
              (endsOn || 'your renewal date') + '. Nothing further will be charged.'
            : 'Your service continues until the notice period ends.') +
        ' Reinstating later needs a short document signed.</div>') +
    '<div class="field"><label for="cxReason">Anything we could have done better? (optional)</label>' +
      '<input class="input" id="cxReason" placeholder="Helps us improve — not required"></div>' +
    '<div id="cxErr" class="alert alert-err hidden"></div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" onclick="closeSheet()">Keep it</button>' +
      '<button class="btn ' + (owed ? 'btn-primary' : 'btn-danger') + '" id="cxGo">' +
        (owed ? 'Pay ' + money(owed) + ' and cancel' : 'Confirm cancellation') + '</button></div>');
  _cancelSheetBody(kind, id, isCrm);
}

/* The confirm handler, shared by both the "nothing owed" and "pay first"
   paths — the only difference is whether a payment sheet opens in between. */
function _cancelSheetBody(kind, id, isCrm){
  document.getElementById('cxGo').onclick = async () => {
    const btn = document.getElementById('cxGo');
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Working…';
    const reason = (document.getElementById('cxReason') || {}).value || null;
    const path = isCrm ? '/api/portal/plans/crm/' + id + '/cancel'
                       : '/api/portal/maintenance-plans/' + id + '/cancel';

    // First attempt. A 402 comes back with a settlement invoice attached: pay
    // it inline, then repeat the cancel quoting that invoice.
    let r = await fetch(API + path, {
      method:'POST', headers: headers(), body: JSON.stringify({reason})
    });
    let d = {}; try{ d = await r.json(); }catch(_){}

    if(r.status === 402 && d.settlement){
      closeSheet();
      openPay(d.settlement.invoiceId, {
        title: 'Settle to cancel',
        subtitle: 'Paying this settles your notice period, then the plan is cancelled.',
        onPaid: async () => {
          try{
            const done = await post(path, {reason, settlementInvoiceId: d.settlement.invoiceId});
            toast(done.message || 'Paid and cancelled.');
          }catch(e2){ toast(e2.message, true); }
          vBilling();
        }
      });
      return;
    }

    if(!r.ok || !d.success){
      const err = document.getElementById('cxErr');
      if(err){ err.textContent = d.message || 'Could not cancel.'; err.classList.remove('hidden'); }
      btn.disabled = false; btn.textContent = label;
      return;
    }
    closeSheet(); toast(d.message || 'Cancellation confirmed.'); vBilling();
  };
}

async function reinstate(kind, id){
  const path = kind === 'crm' ? '/api/portal/plans/crm/' + id + '/reinstate'
                              : '/api/portal/maintenance-plans/' + id + '/reinstate';
  try{
    const d = await post(path);
    // Reinstating is a fresh commitment, so it produces a document to sign
    // rather than restarting the plan on a button press.
    if(d.requiresSignature && d.agreementId){
      toast(d.message || 'Sign the reinstatement document to restart your plan.');
      await loadDash().catch(()=>{});
      openSign(d.agreementId);
      return;
    }
    toast(d.message || 'Reinstated.');
  }catch(e){ toast(e.message, true); }
  vBilling();
}
