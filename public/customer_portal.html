<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f3f5">
<title>Customer Portal — Diamondback Coding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<style>
/* ============================================================================
   Diamondback Coding — Customer Portal
   Light, card-based, mobile-first. Soft grey canvas, white surfaces, generous
   radii, near-black primary actions, green reserved for money and progress.
   ============================================================================ */
:root{
  --canvas:#f2f3f5;
  --surface:#ffffff;
  --surface-2:#f7f8f9;
  --ink:#0d0f12;
  --ink-2:#3f4650;
  /* Contrast-checked against --surface (#ffffff):
       --muted 5.99:1, --faint 4.90:1. The previous values (#7c848f 3.79:1,
       #aab0b8 2.18:1) were both under the 4.5:1 floor for body text, which
       is why secondary lines and the balance cents read as washed out. */
  --muted:#5c646f;
  --faint:#6b727c;
  --line:#e6e8ec;
  --line-2:#eef0f3;
  --green:#16a34a;
  /* Text-only variant. #16a34a on --green-soft is 2.96:1; this is 4.50:1.
     --green itself is kept for borders, chips and accent-color, which are
     not text and are not held to the same floor. */
  --green-ink:#15803d;
  --green-soft:#e8f6ed;
  --amber:#b45309;
  --amber-soft:#fdf3e3;
  --red:#dc2626;
  --red-soft:#fdeceb;
  --blue:#2563eb;
  --blue-ink:#1d4ed8;
  --blue-soft:#eaf0fe;
  --r-sm:10px; --r:14px; --r-lg:20px; --r-xl:26px;
  --shadow:0 1px 2px rgba(16,20,26,.04), 0 8px 24px rgba(16,20,26,.06);
  --shadow-lg:0 2px 6px rgba(16,20,26,.06), 0 20px 48px rgba(16,20,26,.12);
  --tab-h:76px;
  --topbar-bg:rgba(242,243,245,.86);
  --btn-fg:#ffffff;
  --btn-hover:#232830;
  --tabs-bg:rgba(255,255,255,.93);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

/* ------------------------------------------------------------- APP SHELL */
/* The PAGE does not scroll. The content area inside it does.
   Two things follow from that, both of which were the complaint:
     * no document-level scrollbars, horizontal or vertical;
     * no rubber-band or scroll-restore offset on first load, which is what
       made the app look like it opened slightly off-centre.
   overflow-x is pinned to hidden at every level so nothing can ever produce
   a sideways scroll, whatever a future card or table does. */
html{
  -webkit-text-size-adjust:100%;
  height:100%; overflow:hidden;
  overscroll-behavior:none;
}
body{
  font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--canvas); color:var(--ink);
  font-size:15px; line-height:1.5; letter-spacing:-.005em;
  -webkit-font-smoothing:antialiased;
  height:100%; width:100%;
  overflow:hidden;
  overscroll-behavior:none;
  position:fixed; inset:0;   /* pins it against iOS Safari's scroll-to-hide */
}
/* Nothing anywhere may push the layout sideways. */
html,body,.app,.main,.login{max-width:100vw;overflow-x:hidden}
.mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}

/* ---------------------------------------------------------------- LOGIN */
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(1100px 520px at 12% -10%, #ffffff 0%, rgba(255,255,255,0) 62%),
    radial-gradient(760px 440px at 108% 8%, #e9f5ee 0%, rgba(233,245,238,0) 60%),
    var(--canvas);
}
.login-card{width:100%;max-width:404px}
.login-brand{display:flex;align-items:center;gap:11px;margin-bottom:30px}
.login-mark{width:42px;height:42px;border-radius:13px;background:var(--ink);display:grid;place-items:center;flex-shrink:0}
.login-mark svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2}
.login-brand b{font-size:16px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.2}
.login-brand span{font-size:11px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.login-h{font-size:29px;font-weight:800;letter-spacing:-.035em;line-height:1.12;margin-bottom:7px}
.login-sub{color:var(--muted);font-size:14.5px;margin-bottom:26px}
.panel{background:var(--surface);border-radius:var(--r-xl);padding:26px;box-shadow:var(--shadow)}
.field{margin-bottom:15px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:7px}
.input{width:100%;padding:14px 15px;background:var(--surface-2);border:1.5px solid transparent;
  border-radius:var(--r);font-size:15.5px;transition:border-color .15s,background .15s}
.input::placeholder{color:var(--faint)}
.input:focus{outline:none;background:var(--surface);border-color:var(--ink)}
textarea.input{resize:vertical;min-height:88px;line-height:1.55}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;
  border-radius:var(--r);font-size:15px;font-weight:700;transition:transform .12s,background .15s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* --btn-fg is the text ON the primary button, and it must be the OPPOSITE of
   --ink, not a hardcoded white. A dark theme inverts --ink to near-white, so
   `color:#fff` on `background:var(--ink)` painted white on white and the Pay
   button vanished. Every theme sets both. */
.btn-primary{background:var(--ink);color:var(--btn-fg)}
.btn-primary:hover:not(:disabled){background:var(--btn-hover)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-ghost:hover:not(:disabled){background:#eceef1}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-block{width:100%}
.btn-sm{padding:9px 14px;font-size:13.5px;border-radius:var(--r-sm)}
.alert{padding:13px 15px;border-radius:var(--r);font-size:13.5px;line-height:1.5;margin-bottom:15px}
.alert-err{background:var(--red-soft);color:#991b1b}
.alert-ok{background:var(--green-soft);color:#166534}
.alert-info{background:var(--blue-soft);color:#1e40af}
.alert-warn{background:var(--amber-soft);color:#92400e}
.login-alt{text-align:center;margin-top:20px;font-size:13.5px;color:var(--muted)}
.login-alt a{color:var(--ink);font-weight:700;text-decoration:none}
.login-alt a:hover{text-decoration:underline}

/* ---------------------------------------------------------------- SHELL */
.app{display:none;height:100%;flex-direction:column;overflow:hidden}
.app.on{display:flex}
/* .app.on is defined with the shell rules above. */
.topbar{flex:0 0 auto;z-index:40;background:var(--topbar-bg);backdrop-filter:blur(14px);
  padding:calc(18px + env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;gap:13px;
  width:100%;max-width:760px;margin:0 auto}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:15px;flex-shrink:0}
.greet{flex:1;min-width:0}
.greet small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.greet b{display:block;font-size:16.5px;font-weight:800;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
  position:relative;flex-shrink:0;box-shadow:var(--shadow)}
.icon-btn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.9}
.dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;
  border-radius:999px;background:var(--red);color:#fff;font-size:10.5px;font-weight:800;
  line-height:1;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--canvas);box-sizing:border-box;
  font-variant-numeric:tabular-nums;letter-spacing:0;pointer-events:none;
  box-shadow:0 1px 3px rgba(0,0,0,.22)}
/* THE ONLY SCROLLING ELEMENT IN THE APP.
   -webkit-overflow-scrolling gives iOS momentum; overscroll-behavior:contain
   stops a scroll that reaches the end from dragging the page behind it. */
.main{
  flex:1 1 auto; min-height:0;
  overflow-y:auto; overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:4px 20px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom));
  max-width:760px; margin:0 auto; width:100%;
  scrollbar-width:none;             /* Firefox */
}
.main::-webkit-scrollbar{display:none}   /* WebKit — the visible bar he asked to lose */
.view-h{font-size:25px;font-weight:800;letter-spacing:-.03em;margin:10px 0 3px}
.view-sub{color:var(--muted);font-size:14px;margin-bottom:20px}

/* ------------------------------------------------------------ COMPONENTS */
.card{background:var(--surface);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.card-h h3{font-size:16px;font-weight:800;letter-spacing:-.02em}
.link{font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;cursor:pointer}
.link:hover{color:var(--ink)}

.balance{background:var(--surface);border-radius:var(--r-xl);padding:24px;box-shadow:var(--shadow);margin-bottom:14px}
.balance small{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.balance .amt{font-size:38px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:9px 0 4px}
.balance .amt .cents{font-size:23px;color:var(--faint)}
.balance .note{font-size:13px;color:var(--muted)}

.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.quick button{background:var(--surface);border-radius:var(--r-lg);padding:18px;text-align:left;
  box-shadow:var(--shadow);transition:transform .12s}
.quick button:active{transform:scale(.98)}
.quick svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;margin-bottom:12px;display:block}
.quick b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.015em}
.quick span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}

.row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.row:last-child{border-bottom:none}
.chip{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;background:var(--surface-2)}
.chip svg{width:18px;height:18px;stroke:var(--ink-2);fill:none;stroke-width:1.9}
.chip.green{background:var(--green-soft)} .chip.green svg{stroke:var(--green)}
.chip.red{background:var(--red-soft)} .chip.red svg{stroke:var(--red)}
.chip.amber{background:var(--amber-soft)} .chip.amber svg{stroke:var(--amber)}
.chip.blue{background:var(--blue-soft)} .chip.blue svg{stroke:var(--blue)}
.row-body{flex:1;min-width:0}
.row-body b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-body span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.row-end{text-align:right;flex-shrink:0}
.row-end b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.row-end span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.pos{color:var(--green-ink)} .neg{color:var(--red)}

.tag{display:inline-block;padding:4px 9px;border-radius:7px;font-size:10.5px;font-weight:800;
  letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.tag.green{background:var(--green-soft);color:var(--green-ink)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.blue{background:var(--blue-soft);color:var(--blue-ink)}
.tag.grey{background:var(--surface-2);color:var(--muted)}

.bar{height:8px;border-radius:5px;background:var(--line-2);overflow:hidden;margin:11px 0 7px}
.bar i{display:block;height:100%;border-radius:5px;background:var(--green);transition:width .5s ease}
.bar-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

.empty{text-align:center;padding:34px 18px;color:var(--muted);font-size:14px;line-height:1.6}
.empty svg{width:38px;height:38px;stroke:var(--faint);fill:none;stroke-width:1.5;margin-bottom:12px}
.skeleton{height:70px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface-2) 25%,#eef0f3 50%,var(--surface-2) 75%);
  background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* --------------------------------------------------------------- TIMELINE */
.tl{position:relative;padding-left:26px}
.tl::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:0}
.tl-item::before{content:'';position:absolute;left:-25px;top:4px;width:16px;height:16px;border-radius:50%;
  background:var(--surface);border:2.5px solid var(--line)}
.tl-item.done::before{background:var(--green);border-color:var(--green)}
.tl-item.now::before{background:var(--surface);border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.tl-item b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.015em}
.tl-item p{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.55}
.tl-item time{display:block;font-size:11.5px;color:var(--faint);margin-top:5px;font-weight:600}
.sec-label{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}

/* --------------------------------------------------------------- MESSAGES */
.thread{display:flex;flex-direction:column;gap:3px;max-height:52vh;overflow-y:auto;padding:4px 2px 8px}
.bubble{max-width:82%;padding:11px 15px;border-radius:19px;font-size:14.5px;line-height:1.5;
  word-wrap:break-word;white-space:pre-wrap}
.bubble.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.bubble.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.bstamp{font-size:10.5px;color:var(--faint);margin:1px 6px 9px;font-weight:600}
.bstamp.me{align-self:flex-end} .bstamp.them{align-self:flex-start}
.composer{display:flex;gap:10px;align-items:flex-end;padding-top:14px;border-top:1px solid var(--line-2);margin-top:6px}
.composer textarea{flex:1;resize:none;min-height:46px;max-height:130px;padding:13px 15px;background:var(--surface-2);
  border:1.5px solid transparent;border-radius:var(--r);font-size:15px}
.composer textarea:focus{outline:none;background:var(--surface);border-color:var(--ink)}


/* ================================================================= THEMES */
/* Each theme sets its own --canvas AND its own ink colours, so text moves
   with the background. Every pairing below was contrast-checked: no body text
   sits under 4.5:1 against the surface it is on, and no muted text under
   4.5:1 either. That is why --ink and --muted are redefined per theme rather
   than left to inherit — a dark canvas with the light theme's near-black ink
   would be unreadable, which is exactly the failure to avoid. */
body[data-theme="mist"]{
  --canvas:#f2f3f5;
  --topbar-bg:rgba(242,243,245,.86);
}
body[data-theme="paper"]{
  --canvas:#f6f2ea;              /* warm off-white */
  --surface:#fffdf9;
  --surface-2:#f1ece1;
  --line:#e3dbcc;
  --topbar-bg:rgba(246,242,234,.88);
  --tabs-bg:rgba(255,253,249,.94);
}
body[data-theme="sage"]{
  --canvas:#eef2ee;
  --surface:#ffffff;
  --surface-2:#e6ece6;
  --line:#d5ded5;
  --topbar-bg:rgba(238,242,238,.88);
  --tabs-bg:rgba(255,255,255,.94);
}
body[data-theme="dusk"]{
  --canvas:#eceef4;
  --surface:#ffffff;
  --surface-2:#e4e7f0;
  --line:#d3d8e6;
  --topbar-bg:rgba(236,238,244,.88);
  --tabs-bg:rgba(255,255,255,.94);
}
/* --- dark themes: ink and muted INVERT, or nothing is readable ---------- */
body[data-theme="midnight"]{
  --canvas:#0f1216;
  --surface:#171b21;
  --surface-2:#1f242c;
  --line:#2b323c;
  --ink:#f2f4f7;                 /* 15.8:1 on --surface */
  --ink-2:#dfe3ea;               /* 12.4:1 */
  --muted:#a3acba;               /*  7.1:1 — well clear of the 4.5 floor */
  --faint:#8b95a4;               /*  5.2:1 */
  --topbar-bg:rgba(15,18,22,.86);
  --btn-fg:#0f1216;              /* dark text on the light button — 15.8:1 */
  --btn-hover:#dfe3ea;
  --tabs-bg:rgba(23,27,33,.95);
  --shadow:0 1px 3px rgba(0,0,0,.5);
  --shadow-lg:0 -10px 44px rgba(0,0,0,.6);
  --green-soft:#12301f; --red-soft:#331616; --amber-soft:#332608; --blue-soft:#141f33;
  --green-ink:#5ce39a; --blue-ink:#7fb0ff; --green:#34d399; --red:#f87171; --amber:#fbbf24;
}
body[data-theme="forest"]{
  --canvas:#0e1714;
  --surface:#152119;
  --surface-2:#1c2b22;
  --line:#27392f;
  --ink:#eef5f0;
  --ink-2:#dae6de;
  --muted:#9db3a6;
  --faint:#87a094;
  --topbar-bg:rgba(14,23,20,.88);
  --btn-fg:#0e1714;
  --btn-hover:#dae6de;
  --tabs-bg:rgba(21,33,25,.95);
  --shadow:0 1px 3px rgba(0,0,0,.5);
  --shadow-lg:0 -10px 44px rgba(0,0,0,.6);
  --green-soft:#10331f; --red-soft:#331717; --amber-soft:#332708; --blue-soft:#15243a;
  --green-ink:#6ce6a4; --blue-ink:#8dbcff; --green:#3ddb96; --red:#f87171; --amber:#fbbf24;
}
/* The login screen's decorative gradient is light-theme only; on a dark theme
   it would wash the card out. */
body[data-theme="midnight"] .login,
body[data-theme="forest"] .login{background:var(--canvas)}

/* Theme picker */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.theme-swatch{border:2px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;
  background:var(--surface);cursor:pointer;text-align:left}
.theme-swatch.on{border-color:var(--ink)}
.theme-swatch .sw{height:46px;display:block}
.theme-swatch .nm{display:block;padding:7px 9px;font-size:12.5px;font-weight:700;color:var(--ink)}

/* ----------------------------------------------------------------- SHEET */
.sheet{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(13,15,18,.42);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .22s}
.sheet.on{opacity:1;visibility:visible}
.sheet-box{width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(24px);transition:transform .22s;box-shadow:var(--shadow-lg)}
.sheet.on .sheet-box{transform:translateY(0)}
/* A bigger touch target than the 4px line it draws — pressing "the top where
   the line is" has to actually catch, which is why this has padding around it
   and the visible bar is a child. */
.grabber{width:100%;padding:10px 0 14px;margin:0 0 8px;display:flex;justify-content:center;
  cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.grabber::before{content:'';display:block;width:44px;height:5px;border-radius:3px;
  background:var(--line);transition:background .15s,width .15s}
.grabber:active::before{background:var(--muted);width:56px}
.sheet-box.dragging{transition:none}
.sheet-h{font-size:20px;font-weight:800;letter-spacing:-.03em;margin-bottom:5px}
.sheet-sub{color:var(--muted);font-size:13.5px;margin-bottom:18px}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.sheet-actions .btn{flex:1}
@media(min-width:640px){
  .sheet{align-items:center}
  .sheet-box{border-radius:var(--r-xl);padding:22px 26px 26px}
  .grabber{display:none}
}

/* --------------------------------------------------------------- TAB BAR */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom));
  /* --tabs-bg, not a hardcoded white: on a dark theme the white bar stayed
     white and the muted tab labels dropped to 2.3:1 on it. */
  background:var(--tabs-bg);backdrop-filter:blur(16px);border-top:1px solid var(--line-2);
  display:flex;justify-content:space-around;align-items:center;gap:2px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;
  border-radius:var(--r);position:relative;color:var(--muted);transition:color .15s,background .15s;min-width:0}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9}
.tab span{font-size:10.5px;font-weight:700;letter-spacing:-.01em}
.tab.on{color:var(--ink);background:var(--surface-2)}
/* The signature preview draws with --ink, which follows the theme. */
.sign-pad svg path,.sign-pad svg line{stroke:var(--ink)}
/* Anchored to the icon itself rather than a hand-tuned offset from the tab's
   centre, which shifted whenever the label width changed. */
.tab{position:relative}
.tab .dot{top:2px;left:50%;right:auto;transform:translateX(4px);border-color:#fff}
@media(min-width:760px){
  .tabs{max-width:760px;margin:0 auto;border-radius:var(--r-xl) var(--r-xl) 0 0;
    border:1px solid var(--line-2);border-bottom:none;box-shadow:var(--shadow-lg)}
}

/* ------------------------------------------------------------- CARD ENTRY */
#cardMount{background:var(--surface-2);border-radius:var(--r);padding:15px;margin-bottom:4px}
.pay-summary{background:var(--surface-2);border-radius:var(--r);padding:15px 16px;margin-bottom:16px}
.pay-summary .r{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;color:var(--ink-2)}
.pay-summary .r.total{font-weight:800;font-size:16px;color:var(--ink);padding-top:10px;margin-top:6px;
  border-top:1px solid var(--line)}
.pm-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2);cursor:pointer}
.pm-row:last-of-type{border-bottom:none}
.pm-row input[type=radio]{width:19px;height:19px;accent-color:var(--ink);flex-shrink:0}
.sign-pad{background:var(--surface-2);border-radius:var(--r);padding:16px;margin:14px 0;min-height:92px;
  display:grid;place-items:center}
.sign-pad svg{max-width:100%;height:auto}
.terms{background:var(--surface-2);border-radius:var(--r);padding:15px;max-height:180px;overflow-y:auto;
  font-size:13.5px;line-height:1.62;color:var(--ink-2);white-space:pre-wrap}

/* ------------------------------------------------------- AGREEMENT READER */
/* The agreement is shown IN FULL. There is deliberately no max-height and no
   collapse anywhere in here: the previous .terms box capped the document at
   180px and showed only the admin-typed paragraph, so the customer was signing
   a window onto a fragment. The sheet itself scrolls; the document does not
   scroll inside it. */
/* Measured cause of the sideways scroll: at 320px the agreement's summary
   table laid out to 353px inside a 320px viewport, because a two-column table
   with long values cannot shrink below its content. Below 380px the tables
   stack instead, which removes the overflow at its source rather than hiding
   it with a scrollbar. */
.doc-scroll{margin:0;padding:0;overflow:visible;max-width:100%}
.doc-scroll table{width:100%!important;max-width:100%!important;table-layout:fixed}
.doc-scroll td,.doc-scroll th{word-break:break-word;overflow-wrap:anywhere}
@media(max-width:380px){
  .doc-scroll table,.doc-scroll tbody,.doc-scroll tr,.doc-scroll td,.doc-scroll th{
    display:block!important;width:100%!important;text-align:left!important}
  .doc-scroll th{padding-bottom:2px!important;border-bottom:0!important}
  .doc-scroll td{padding-top:0!important}
  .doc-scroll thead{display:none!important}
}
.doc-scroll .dbdoc{max-width:none}
.doc-scroll section,.doc-scroll p,.doc-scroll li{max-height:none!important;overflow:visible!important}
.doc-end{height:1px}
/* The scroll gate. Replaced by the sign controls once the document has been
   read to the end — which is also what gets stored as viewed_in_full. */
.doc-gate{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px;
  background:var(--surface-2);border-radius:var(--r)}
.doc-gate p{flex:1;font-size:13px;color:var(--ink-2);line-height:1.5;margin:0}
.doc-loading{padding:40px 0;text-align:center;color:var(--muted);font-size:14px}
/* Autopay consent sits in a bordered block so it reads as its own act, not as
   fine print attached to the terms checkbox. */
.autopay-consent{border:1.5px solid var(--ink);border-radius:var(--r);padding:14px;margin:16px 0 0}
.autopay-consent .lbl{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink);margin-bottom:9px}
.autopay-consent .consent{margin:0}
.consent{display:flex;gap:11px;align-items:flex-start;margin:16px 0;font-size:13.5px;line-height:1.5;cursor:pointer}
.consent input{margin-top:2px;width:19px;height:19px;accent-color:var(--green);flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));
  z-index:200;background:var(--ink);color:#fff;padding:13px 20px;border-radius:var(--r);font-size:14px;
  font-weight:600;max-width:calc(100vw - 40px);text-align:center;box-shadow:var(--shadow-lg);
  opacity:0;visibility:hidden;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(-4px)}
.toast.bad{background:var(--red)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
/* ============================================================================
   State + helpers
   ============================================================================ */
const API = window.location.origin;
/* ===================================================================== */
/* THEMES                                                                */
/*                                                                       */
/* Each theme redefines its INK colours as well as its background. A     */
/* dark canvas with the light theme's near-black text would be           */
/* unreadable, so the two always move together — that is the whole       */
/* reason the dark themes below override --ink, --muted and --faint.     */
/* ===================================================================== */
const DB_THEMES = [
  { id:'mist',     name:'Mist',     sw:'linear-gradient(135deg,#f2f3f5,#e2e5ea)', dark:false },
  { id:'paper',    name:'Paper',    sw:'linear-gradient(135deg,#f6f2ea,#e8dfcc)', dark:false },
  { id:'sage',     name:'Sage',     sw:'linear-gradient(135deg,#eef2ee,#cfdcd2)', dark:false },
  { id:'dusk',     name:'Dusk',     sw:'linear-gradient(135deg,#eceef4,#ccd3e6)', dark:false },
  { id:'midnight', name:'Midnight', sw:'linear-gradient(135deg,#0f1216,#243040)', dark:true  },
  { id:'forest',   name:'Forest',   sw:'linear-gradient(135deg,#0e1714,#1f3b2c)', dark:true  }
];

function dbTheme(){ try{ return localStorage.getItem('db_portal_theme') || 'mist'; }catch(e){ return 'mist'; } }

function dbSetTheme(id){
  const t = DB_THEMES.find(x=>x.id===id) || DB_THEMES[0];
  document.body.setAttribute('data-theme', t.id);
  /* Keeps the phone's status bar and the area behind the notch in step with
     the background, so a dark theme does not leave a white bar at the top. */
  let meta = document.querySelector('meta[name="theme-color"]');
  if(!meta){ meta=document.createElement('meta'); meta.name='theme-color'; document.head.appendChild(meta); }
  meta.content = t.dark ? '#0f1216' : '#f2f3f5';
  document.documentElement.style.colorScheme = t.dark ? 'dark' : 'light';
  try{ localStorage.setItem('db_portal_theme', t.id); }catch(e){}
  const g = document.getElementById('themeGrid');
  if(g) g.querySelectorAll('.theme-swatch').forEach(b=>b.classList.toggle('on', b.dataset.theme===t.id));
}

/* Applied before first paint so the app never flashes the wrong background. */
dbSetTheme(dbTheme());

function dbThemePickerHTML(){
  return '<div class="card"><div class="card-h"><h3>Background</h3></div>'
    + '<div class="theme-grid" id="themeGrid">'
    + DB_THEMES.map(t=>`<button class="theme-swatch ${dbTheme()===t.id?'on':''}" data-theme="${t.id}"
         onclick="dbSetTheme('${t.id}')">
         <span class="sw" style="background:${t.sw}"></span>
         <span class="nm">${t.name}</span></button>`).join('')
    + '</div>'
    + '<p style="font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.55">'
    + 'Saved on this device. Every background is checked so the text stays readable on it.</p>'
    + '</div>';
}

let TOKEN = localStorage.getItem('db_portal_token') || '';
let ME = JSON.parse(localStorage.getItem('db_portal_me') || 'null');
let VIEW = 'home';
let DASH = null, TIMELINE = [], MSGS = [], PAYMENTS = null, PLANS = [], PMS = [], REQS = [];
let UNREAD = 0, NOTICE_DAYS = 30, STRIPE = null, STRIPE_PK = '';
let PENDING = null;   // {leadId, email} while a sign-in code is outstanding
/* Set once a device is trusted, so the code step is skipped until it expires. */
const DEVICE = localStorage.getItem('db_device_token') || '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => '$' + Number(n || 0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
// timeZone:'UTC' is required here. Date-only fields (next_charge_date,
// due_date, etc.) come back as e.g. "2026-08-15" with no time component, which
// the JS Date constructor parses as UTC midnight. Without pinning the
// formatter to UTC too, toLocaleDateString() renders that instant in the
// browser's LOCAL zone — for anyone west of Greenwich (Houston included) that
// rolls the date back one day. Timestamps with a real time-of-day are
// unaffected: they still show their correct UTC calendar date.
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}) : '—';
const fmtShort = d => d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}) : '—';
function relTime(d){
  if(!d) return '';
  const s = (Date.now() - new Date(d)) / 1000;
  if(s < 60) return 'Just now';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  if(s < 604800) return Math.floor(s/86400) + 'd ago';
  return fmtShort(d);
}
const initials = n => String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();

function toast(msg, bad){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 4200);
}
const headers = () => ({'Authorization':'Bearer '+TOKEN, 'Content-Type':'application/json'});

async function api(path, opts = {}){
  const r = await fetch(API + path, {headers: headers(), ...opts});
  if(r.status === 401 || r.status === 403){ signOut(); throw new Error('Session expired. Please sign in again.'); }
  let d = null; try{ d = await r.json(); }catch(_){}
  if(!r.ok) throw new Error((d && (d.message || d.error)) || ('Request failed (' + r.status + ')'));
  return d || {};
}
const post = (path, body, method) =>
  api(path, {method: method || 'POST', body: body ? JSON.stringify(body) : undefined});

function sheet(html){
  dbInitSheetDrag();
  document.getElementById('sheetBox').innerHTML = '<div class="grabber"></div>' + html;
  document.getElementById('sheet').classList.add('on');
}

/* ===================================================================== */
/* DRAG-TO-DISMISS                                                       */
/* The grabber was decorative — pressing the line at the top of a sheet   */
/* did nothing. It now follows the finger, and a pull or a flick down     */
/* closes the sheet. Dragging up does nothing rather than lifting the     */
/* sheet off the bottom of the screen.                                   */
/* ===================================================================== */
function dbInitSheetDrag(){
  const sheet = document.getElementById('sheet');
  if(!sheet || sheet.dataset.dragReady) return;
  sheet.dataset.dragReady = '1';

  let startY=0, lastY=0, startT=0, dragging=false, box=null;

  const onDown = (e) => {
    const handle = e.target.closest('.grabber');
    if(!handle) return;
    box = sheet.querySelector('.sheet-box');
    if(!box) return;
    dragging = true;
    startY = lastY = (e.touches ? e.touches[0].clientY : e.clientY);
    startT = Date.now();
    box.classList.add('dragging');
  };

  const onMove = (e) => {
    if(!dragging || !box) return;
    lastY = (e.touches ? e.touches[0].clientY : e.clientY);
    const dy = Math.max(0, lastY - startY);      // downward only
    box.style.transform = `translateY(${dy}px)`;
    sheet.style.background = `rgba(13,15,18,${Math.max(0, .42 - dy/900)})`;
    if(e.cancelable) e.preventDefault();
  };

  const onUp = () => {
    if(!dragging || !box) return;
    dragging = false;
    const dy = Math.max(0, lastY - startY);
    const ms = Math.max(1, Date.now() - startT);
    const flick = dy / ms > 0.5;                 // fast flick counts as a dismiss
    box.classList.remove('dragging');
    box.style.transform = '';
    sheet.style.background = '';
    /* A third of the sheet, or a flick. Anything less springs back, so a
       mis-touch while scrolling does not close what you were reading. */
    if(dy > box.offsetHeight * 0.33 || (flick && dy > 60)) closeSheet();
  };

  sheet.addEventListener('touchstart', onDown, {passive:true});
  sheet.addEventListener('touchmove',  onMove, {passive:false});
  sheet.addEventListener('touchend',   onUp);
  sheet.addEventListener('touchcancel',onUp);
  sheet.addEventListener('mousedown',  onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup',   onUp);

  /* Tapping the grabber (no drag) closes it too — that is what "press the top
     where the line is and it goes back down" means. */
  sheet.addEventListener('click', (e) => {
    if(e.target.closest('.grabber') && Math.abs(lastY - startY) < 6) closeSheet();
  });
}

function closeSheet(){ document.getElementById('sheet').classList.remove('on'); }
document.getElementById('sheet').addEventListener('click', e => { if(e.target.id === 'sheet') closeSheet(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

/* ============================================================================
   Account recovery
   ============================================================================ */
/* The response is deliberately the same whether or not the address is on an
   account — this form must not reveal who has one. */
function openRecover(mode){
  const isPw = mode !== 'username';
  sheet('<h2 class="sheet-h">' + (isPw ? 'Reset your password' : 'Find your sign-in email') + '</h2>' +
    '<p class="sheet-sub">' + (isPw
      ? 'Enter the email on your account and we&rsquo;ll send you a link to set a new password.'
      : 'Enter the email you think you used and we&rsquo;ll confirm your sign-in details there.') + '</p>' +
    '<div class="field"><label for="rcEmail">Email</label>' +
      '<input class="input" id="rcEmail" type="email" autocomplete="email" placeholder="you@company.com"></div>' +
    '<div id="rcMsg" class="alert alert-ok hidden"></div>' +
    '<div id="rcErr" class="alert alert-err hidden"></div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" onclick="closeSheet()">Cancel</button>' +
      '<button class="btn btn-primary" id="rcGo">Send ' + (isPw ? 'reset link' : 'details') + '</button></div>');

  const input = document.getElementById('rcEmail');
  const prefill = document.getElementById('loginEmail');
  if(prefill && prefill.value) input.value = prefill.value;
  input.focus();

  const submit = async () => {
    const err = document.getElementById('rcErr');
    const msg = document.getElementById('rcMsg');
    const btn = document.getElementById('rcGo');
    err.classList.add('hidden');
    const email = input.value.trim();
    if(!email || email.indexOf('@') === -1){
      err.textContent = 'Enter the email address on your account.'; err.classList.remove('hidden'); return;
    }
    btn.disabled = true; btn.textContent = 'Sending…';
    try{
      const r = await fetch(API + '/api/auth/' + (isPw ? 'forgot-password' : 'forgot-username'), {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({email, audience:'customer'})
      });
      const d = await r.json();
      msg.textContent = d.message || 'If that email is on an account, it\u2019s on its way.';
      msg.classList.remove('hidden');
      btn.textContent = 'Sent';
      input.disabled = true;
    }catch(e){
      err.textContent = 'Could not send that just now. Please try again in a moment.';
      err.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'Send ' + (isPw ? 'reset link' : 'details');
    }
  };
  document.getElementById('rcGo').onclick = submit;
  input.addEventListener('keydown', e => { if(e.key === 'Enter') submit(); });
}

/* ============================================================================
   Auth
   ============================================================================ */
async function doLogin(){
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginErr');
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  err.classList.add('hidden');
  if(!email || !pass){ err.textContent = 'Enter your email and password.'; err.classList.remove('hidden'); return; }
  btn.disabled = true; btn.textContent = 'Signing in…';
  try{
    const r = await fetch(API + '/api/portal/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password: pass, deviceToken: DEVICE})
    });
    const d = await r.json();
    if(!r.ok || !d.success) throw new Error(d.message || 'Those details did not match an account.');

    // Password was right, but this device isn't trusted yet — a code has been
    // emailed and no session exists until it's verified.
    if(d.codeRequired){
      PENDING = {leadId: d.leadId, email: d.email};
      showCodeStep(d.message);
      btn.disabled = false; btn.textContent = 'Sign in';
      return;
    }

    TOKEN = d.token; ME = d.client || d.lead || {email};
    localStorage.setItem('db_portal_token', TOKEN);
    localStorage.setItem('db_portal_me', JSON.stringify(ME));
    boot();
  }catch(e){
    err.textContent = e.message; err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
}
document.getElementById('loginBtn').onclick = doLogin;
['loginEmail','loginPass'].forEach(id =>
  document.getElementById(id).addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); }));

/* Step two of sign-in. Replaces the password panel rather than opening a sheet,
   so on a phone there's one thing on screen and the keyboard is already numeric. */
function showCodeStep(msg){
  const panel = document.querySelector('#login .panel');
  panel.innerHTML =
    '<div class="alert alert-ok">' + esc(msg || 'We\'ve emailed you a 6-digit code.') + '</div>' +
    '<div id="codeErr" class="alert alert-err hidden"></div>' +
    '<div class="field"><label for="codeInput">6-digit code</label>' +
      '<input class="input" id="codeInput" inputmode="numeric" autocomplete="one-time-code" ' +
      'maxlength="6" placeholder="000000" style="font-size:24px;letter-spacing:.3em;text-align:center"></div>' +
    '<label class="consent" style="margin:4px 0 16px"><input type="checkbox" id="codeRemember" checked>' +
      '<span>Remember this device, so I don\'t need a code next time</span></label>' +
    '<button class="btn btn-primary btn-block" id="codeGo">Verify and sign in</button>' +
    '<p class="login-alt"><a href="#" onclick="resendCode();return false;">Send a new code</a>' +
      ' &nbsp;·&nbsp; <a href="#" onclick="location.reload();return false;">Start over</a></p>';

  const input = document.getElementById('codeInput');
  input.focus();
  // Six digits is the whole form — submit as soon as they're in.
  input.addEventListener('input', () => {
    input.value = input.value.replace(/\D/g, '').slice(0, 6);
    if(input.value.length === 6) verifyCode();
  });
  input.addEventListener('keydown', e => { if(e.key === 'Enter') verifyCode(); });
  document.getElementById('codeGo').onclick = verifyCode;
}

async function verifyCode(){
  const err = document.getElementById('codeErr');
  const btn = document.getElementById('codeGo');
  const code = (document.getElementById('codeInput')||{}).value.trim();
  if(code.length !== 6){ err.textContent = 'Enter the 6-digit code.'; err.classList.remove('hidden'); return; }
  err.classList.add('hidden');
  btn.disabled = true; btn.textContent = 'Verifying…';
  try{
    const r = await fetch(API + '/api/portal/login/verify', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        leadId: PENDING && PENDING.leadId, code,
        remember: (document.getElementById('codeRemember')||{}).checked
      })
    });
    const d = await r.json();
    if(!r.ok || !d.success) throw new Error(d.message || 'That code was not accepted.');
    TOKEN = d.token; ME = d.client || {email: PENDING && PENDING.email};
    localStorage.setItem('db_portal_token', TOKEN);
    localStorage.setItem('db_portal_me', JSON.stringify(ME));
    if(d.deviceToken) localStorage.setItem('db_device_token', d.deviceToken);
    PENDING = null;
    boot();
  }catch(e){
    err.textContent = e.message; err.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Verify and sign in';
  }
}

async function resendCode(){
  if(!PENDING) return;
  try{
    const r = await fetch(API + '/api/auth/login-code/send', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({leadId: PENDING.leadId, email: PENDING.email, audience:'customer'})
    });
    const d = await r.json();
    toast(d.message || 'A new code is on its way.');
  }catch(e){ toast('Could not send a new code.', true); }
}

function signOut(){
  TOKEN = ''; ME = null;
  clearInterval(window._unreadPoll);
  localStorage.removeItem('db_portal_token'); localStorage.removeItem('db_portal_me');
  document.getElementById('app').classList.remove('on');
  document.getElementById('tabs').classList.add('hidden');
  document.getElementById('login').style.display = 'flex';
  const b = document.getElementById('loginBtn');
  b.disabled = false; b.textContent = 'Sign in';
}

async function boot(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').classList.add('on');
  document.getElementById('tabs').classList.remove('hidden');
  const name = (ME && ME.name) || 'there';
  document.getElementById('greetName').textContent = name;
  document.getElementById('avatar').textContent = initials(name);
  const h = new Date().getHours();
  document.getElementById('greetTime').textContent =
    h < 12 ? 'Good morning,' : h < 18 ? 'Good afternoon,' : 'Good evening,';
  go('home');
  refreshUnread();
  // Poll so a message sent from the admin side appears without a reload.
  clearInterval(window._unreadPoll);
  window._unreadPoll = setInterval(refreshUnread, 45000);
}

/* ============================================================================
   Unread badge — topbar and tab bar kept in step
   ============================================================================ */
async function refreshUnread(){
  try{
    const d = await api('/api/portal/messages/unread-count');
    setUnread(Number(d.count ?? d.unread ?? d.unreadCount ?? 0));
  }catch(_){}
}
function setUnread(n){
  // Guard the value first: a failed fetch used to hand this NaN, which rendered
  // as a literal "NaN" in the badge.
  const c = Math.max(0, Math.floor(Number(n) || 0));
  UNREAD = c;
  for(const id of ['msgDot','tabDot']){
    const el = document.getElementById(id);
    if(!el) continue;
    // Hide BEFORE writing the text, so a zero never paints for a frame.
    el.classList.toggle('hidden', c === 0);
    el.textContent = c > 99 ? '99+' : String(c);
    el.setAttribute('aria-label', c === 1 ? '1 unread message' : c + ' unread messages');
  }
}

/* ============================================================================
   Change password — in-portal, while signed in.

   The username is the email address, so it's changed on the profile sheet
   above; this covers the password. The current password is required, so a
   session left open on someone else's device can't be used to take the account.
   ============================================================================ */
async function openPassword(){
  sheet('<h2 class="sheet-h">Change your password</h2>' +
    '<p class="sheet-sub">Your username is your email address \u2014 change that on the details screen.</p>' +
    '<div class="field"><label for="pwCur">Current password</label>' +
      '<input class="input" id="pwCur" type="password" autocomplete="current-password"></div>' +
    '<div class="field"><label for="pwNew">New password</label>' +
      '<input class="input" id="pwNew" type="password" autocomplete="new-password">' +
      '<p style="font-size:12.5px;color:var(--muted);margin-top:6px">At least 8 characters.</p></div>' +
    '<div class="field"><label for="pwNew2">Confirm new password</label>' +
      '<input class="input" id="pwNew2" type="password" autocomplete="new-password"></div>' +
    '<div id="pwErr" class="alert alert-err hidden"></div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-ghost" onclick="openProfile()">Back</button>' +
      '<button class="btn btn-primary" id="pwGo">Update password</button></div>');

  const fail = (m) => {
    const e = document.getElementById('pwErr');
    e.textContent = m; e.classList.remove('hidden');
  };

  document.getElementById('pwGo').onclick = async () => {
    document.getElementById('pwErr').classList.add('hidden');
    const cur = document.getElementById('pwCur').value;
    const nw  = document.getElementById('pwNew').value;
    const nw2 = document.getElementById('pwNew2').value;

    if(!cur) return fail('Enter your current password.');
    if(nw.length < 8) return fail('Your new password needs to be at least 8 characters.');
    if(nw !== nw2) return fail('Those two new passwords don\'t match.');
    if(nw === cur) return fail('That\'s the password you already have \u2014 pick a different one.');

    const btn = document.getElementById('pwGo');
    btn.disabled = true; btn.textContent = 'Updating\u2026';
    try{
      await post('/api/portal/change-password', { currentPassword: cur, newPassword: nw });
      sheet('<h2 class="sheet-h">Password updated</h2>' +
        '<p class="sheet-sub">You\'ll stay signed in here. We\'ve emailed you to confirm the change.</p>' +
        '<div class="sheet-actions"><button class="btn btn-primary" onclick="closeSheet()">Done</button></div>');
    }catch(e){
      btn.disabled = false; btn.textContent = 'Update password';
      fail(e.message || 'Could not change your password.');
    }
  };
}

function go(view){

  window.scrollTo(0, 0);

const loading = (title, sub) =>

/* ============================================================================
   HOME
   ============================================================================ */
async function vHome(){
  M().innerHTML = loading('Home', 'Your account at a glance.');
  try{ await loadDash(); }
  catch(e){ return fail('Home', e.message, 'vHome'); }

  const invoices = DASH.invoices || [];
  const open = invoices.filter(isOpen);
  const laterTotal = open.filter(i => !isDueNow(i)).reduce((t,i) => t + Number(i.total_amount || 0), 0);
  const agreements = (DASH.salesAgreements || []).filter(a => (a.status||'') !== 'cancelled');
  const toSign = agreements.filter(a => !isSigned(a) && ['sent','draft'].includes(a.status || ''));

  /* THE BALANCE COMES FROM THE SERVER, not from the invoice list.
     Computing it here from invoices alone missed every monthly plan: an autopay
     plan generates no invoice, so an unpaid month showed as nothing owed.
     /api/portal/outstanding applies one rule, shared with the admin portal, so
     the two can never quote different numbers at each other:
       * a MONTHLY plan is outstanding for its current period as soon as that
         period opens, whether or not the charge date has passed;
       * an ANNUAL plan is not — it lives under Billing and bills on its
         renewal date;
       * invoices follow the existing due_now / on_completion rule.
     If the endpoint is unavailable, fall back to the old invoice-only figure
     rather than showing the customer a blank balance. */
  let OUT = null;
  try{ OUT = (await api('/api/portal/outstanding')).outstanding; }catch(_){}

  const dueNow = open.filter(isDueNow);
  const owed = OUT ? Number(OUT.total || 0)
                   : dueNow.reduce((t,i) => t + Number(i.total_amount || 0), 0);
  const dueCount = OUT ? Number(OUT.count || 0) : dueNow.length;
  const planDue = OUT ? (OUT.dueNow || []).filter(x => x.kind === 'plan') : [];

  /* WHAT CAN ACTUALLY BE PAID RIGHT NOW.
     Not the same thing as what is outstanding. An autopay plan has no invoice
     behind it — it charges itself on its date — so there is nothing for the
     customer to pay and no payment sheet to open. Offering "Pay now" for one
     was offering an action that does not exist: the button navigated to
     Billing, where there was also nothing to pay, which is what made it look
     broken.
     Invoices are payable. Plans are not. */
  const payableInvoices = OUT
    ? (OUT.dueNow || []).filter(x => x.kind === 'invoice')
    : dueNow.map(i => ({invoiceId: i.id, amount: Number(i.total_amount || 0)}));
  const payableTotal = payableInvoices.reduce((t,x) => t + Number(x.amount || 0), 0);
  /* A failed autopay charge is the one plan case the customer can act on — not
     by paying an invoice, but by fixing the card we could not charge. */
  const planOverdue = planDue.filter(p => p.overdue);
  const nextPlanCharge = planDue.filter(p => !p.overdue)
    .sort((a,b) => new Date(a.dueDate || 0) - new Date(b.dueDate || 0))[0] || null;

  const parts = money(owed).split('.');

  M().innerHTML =
    '<div class="balance">' +
      '<small>Outstanding balance</small>' +
      '<div class="amt">' + parts[0] + '<span class="cents">.' + parts[1] + '</span></div>' +
      '<div class="note">' + (
        dueCount === 0 ? 'You&rsquo;re all paid up &mdash; nothing due right now.'
        /* Say what the money actually is. "2 payments due now" next to a
           balance made entirely of automatic charges reads as a demand, and
           the customer goes looking for a way to pay something that will pay
           itself. */
        : payableInvoices.length === 0 && nextPlanCharge
          ? 'Scheduled automatically &mdash; charges on ' + esc(nextPlanCharge.dueDateLabel || 'its due date') +
            '. Nothing for you to do.'
        : payableInvoices.length === 0 && planOverdue.length
          ? 'We couldn&rsquo;t take ' + (planOverdue.length === 1 ? 'this payment' : 'these payments') +
            ' automatically. Check your payment method.'
        : payableInvoices.length + ' invoice' + (payableInvoices.length === 1 ? '' : 's') + ' to pay' +
          (planDue.length ? ' &middot; ' + money(planDue.reduce((t,p) => t + Number(p.amount || 0), 0)) + ' on autopay' : '')
      ) +
        (laterTotal > 0 ? ' &middot; ' + money(laterTotal) + ' due on completion' : '') + '</div>' +

      /* The button offers only what is genuinely possible:
           one invoice   -> open that payment sheet directly
           several       -> Billing, where each has its own Pay button
           none, failed  -> fix the payment method
           none, healthy -> no button at all */
      (payableInvoices.length === 1
        ? '<button class="btn btn-primary btn-block" style="margin-top:16px" onclick="openPay(' +
            Number(payableInvoices[0].invoiceId) + ')">Pay ' + money(payableInvoices[0].amount) + '</button>'
        : payableInvoices.length > 1
          ? '<button class="btn btn-primary btn-block" style="margin-top:16px" onclick="go(\'billing\')">Pay ' +
              money(payableTotal) + ' &mdash; ' + payableInvoices.length + ' invoices</button>'
          : planOverdue.length
            ? '<button class="btn btn-primary btn-block" style="margin-top:16px" onclick="go(\'billing\')">Update payment method</button>'
            : '') +
    '</div>' +

    /* Monthly plans owed for the current period. Shown separately from
       invoices because there is no invoice to pay — they are charged
       automatically — so the customer needs to see what the money is for
       without being handed a Pay button that does nothing. */
    (planDue.length ?
      '<div class="card">' +
        '<div class="card-h"><h3>' +
          (planDue.every(p => p.cancelsAt) ? 'Final plan charges' : 'This month&rsquo;s plans') + '</h3>' +
          '<span class="tag ' + (planDue.some(p => p.overdue) ? 'amber' : 'grey') + '">' +
          money(planDue.reduce((t,p) => t + Number(p.amount || 0), 0)) + '</span></div>' +
        planDue.map(p =>
          '<div class="row">' +
            '<div class="chip green"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg></div>' +
            '<div class="row-body"><b>' + esc(p.label || 'Plan') + '</b>' +
              '<span>' + (p.overdue ? 'Payment overdue'
                        : p.cancelsAt ? 'Final charge before cancelling'
                        : 'Charges automatically') +
                (p.dueDateLabel ? ' &middot; ' + esc(p.dueDateLabel) : '') + '</span>' +
              /* Home now says the same thing Billing does about a cancelling
                 plan, instead of presenting it as an ordinary renewal. */
              (p.cancelsAt ? '<span>Cancels ' + esc(p.cancelsAtLabel || '') + '</span>' : '') +
            '</div>' +
            '<div class="row-end"><b>' + money(p.amount) + '</b>' +
              '<span>' + (p.overdue ? 'Past due' : p.cancelsAt ? 'Cancelling' : 'Autopay') + '</span>' +
              /* p.amount is the real total — base + tax + any card surcharge.
                 The base is shown underneath so the customer can reconcile it
                 against the rate on their agreement. */
              (p.baseAmount != null && Number(p.baseAmount) !== Number(p.amount)
                ? '<span>' + money(p.baseAmount) + ' + tax' +
                  (Number(p.processingFee) > 0 ? ' + fee' : '') + '</span>' : '') +
            '</div>' +
          '</div>').join('') +
      '</div>' : '') +

    (toSign.length ?
      '<div class="card" style="border:1.5px solid var(--green)">' +
        '<div class="card-h"><h3>Ready to sign</h3><span class="tag green">' + toSign.length + '</span></div>' +
        toSign.map(a =>
          '<div class="row">' +
            '<div class="chip green"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/></svg></div>' +
            '<div class="row-body"><b>' + esc(a.package_name || a.agreement_number || 'Agreement') + '</b>' +
              '<span>' + money(a.price) + (a.est_completion_date ? ' &middot; est. ' + fmtShort(a.est_completion_date) : '') + '</span></div>' +
            '<button class="btn btn-primary btn-sm" onclick="openSign(' + a.id + ')">Review</button>' +
          '</div>').join('') +
      '</div>' : '') +

    '<div class="quick">' +
      '<button onclick="go(\'project\')">' +
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V10"/><path d="M18 20V4"/><path d="M6 20v-4"/></svg>' +
        '<b>Project</b><span>Track your progress</span></button>' +
      '<button onclick="openRequest()">' +
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>' +
        '<b>New request</b><span>Ask us for something</span></button>' +
      '<button onclick="go(\'billing\')">' +
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><line x1="2" y1="10" x2="22" y2="10"/></svg>' +
        '<b>Billing</b><span>Invoices and plans</span></button>' +
      '<button onclick="go(\'messages\')">' +
        '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.9-.9L3 21l1.9-5A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>' +
        '<b>Messages</b><span>' + (UNREAD ? UNREAD + ' unread' : 'Talk to us') + '</span></button>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-h"><h3>Recent invoices</h3><span class="link" onclick="go(\'billing\')">See all</span></div>' +
      (invoices.length ? invoices.slice(0,4).map(invRow).join('')
        : '<p class="empty" style="padding:18px 0">No invoices yet.</p>') +
    '</div>';
}

const isSigned = a => !!(a && (a.signed_at || a.status === 'signed'));
const isOpen = i => !['paid','void','cancelled','refunded','draft'].includes(i.status);
/* Maintenance, renewals and deposits are owed on issue. A project balance is
   'on_completion' and only becomes due when the work finishes. */
/* Counts toward "due now" only if it is genuinely payable. The server sends
   payable; when it's absent (older backend) fall back to the obligation. */
const isDueNow = i => (i.payable !== undefined
  ? i.payable === true
  : (i.obligation || 'due_now') !== 'on_completion');

/* Why an invoice can't be paid yet, if it can't. */
const holdText = i =>
  i.hold_reason === 'awaiting_signature' ? 'Waiting on your signature'
  : i.hold_reason === 'due_on_completion' ? 'Due on completion'
  : (i.obligation === 'on_completion' ? 'Due on completion' : 'Not due yet');

function invRow(i){
  const paid = i.status === 'paid';
  const overdue = !paid && isDueNow(i) && i.due_date && new Date(i.due_date) < new Date()
    && !['void','cancelled','refunded','draft'].includes(i.status);
  return '<div class="row">' +
    '<div class="chip ' + (paid ? 'green' : (overdue ? 'red' : '')) + '">' +
      '<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">' +
      (paid ? '<polyline points="20 6 9 17 4 12"/>'
            : '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>') +
      '</svg></div>' +
    /* Lead with what the invoice is FOR. "Monthly Maintenance Cancellation"
       tells the customer something; "INV-699016" does not. The number stays,
       underneath, because that is what they quote back to us. */
    '<div class="row-body"><b>' + esc(i.short_description || i.invoice_number || 'Invoice') +
      (i.is_deposit ? ' <span class="tag amber">Deposit</span>' : '') + '</b>' +
      (i.short_description ? '<span>' + esc(i.invoice_number || '') + '</span>' : '') +
      '<span>' + (paid ? 'Paid ' + fmtShort(i.paid_at)
        : (!isDueNow(i) ? holdText(i) + (i.due_date && i.hold_reason !== 'awaiting_signature' ? ' · est. ' + fmtShort(i.due_date) : '')
        : (i.due_date ? (overdue ? 'Overdue ' : 'Due ') + fmtShort(i.due_date) : 'Due now'))) + '</span></div>' +
    '<div class="row-end"><b>' + money(i.total_amount) + '</b>' +
      (paid ? '<span class="pos">Paid</span>'
            : (isDueNow(i)
                // Pay is only offered when the server says it's payable.
                ? '<button class="btn btn-primary btn-sm" style="margin-top:5px" onclick="openPay(' + i.id + ')">Pay</button>'
                : '<span class="tag ' + (i.hold_reason === 'awaiting_signature' ? 'amber' : 'grey') + '">' +
                  (i.hold_reason === 'awaiting_signature' ? 'Sign first' : 'Not due yet') + '</span>')) +
    '</div></div>';
}

/* ============================================================================
   BILLING
   ============================================================================ */
async function vBilling(){
  M().innerHTML = loading('Billing', 'Invoices, plans and payment methods.');
  try{
    const [d, pay, plans] = await Promise.all([
      api('/api/portal/dashboard'),
      api('/api/portal/payments').catch(() => ({payments:[], totals:{paid:0,refunded:0,net:0}})),
      api('/api/portal/plans').catch(() => ({plans:[], paymentMethods:[], noticeDays:30}))
    ]);
    DASH = d.dashboard || {};
    PAYMENTS = pay; PLANS = plans.plans || []; PMS = plans.paymentMethods || [];
    NOTICE_DAYS = plans.noticeDays || 30;
  }catch(e){ return fail('Billing', e.message, 'vBilling'); }

  /* Annual renewals, from the same endpoint the home screen uses — so what is
     excluded from the balance there is exactly what is listed here. */
  let ANNUAL = [];
  try{ ANNUAL = ((await api('/api/portal/outstanding')).outstanding || {}).upcomingAnnual || []; }
  catch(_){}

  const invoices = DASH.invoices || [];
  const open = invoices.filter(isOpen);
  const dueNow = open.filter(isDueNow);
  const t = (PAYMENTS && PAYMENTS.totals) || {paid:0, refunded:0, net:0};

  M().innerHTML = '<h1 class="view-h">Billing</h1><p class="view-sub">Invoices, plans and payment methods.</p>' +

    '<div class="card">' +
      '<div class="card-h"><h3>Invoices</h3>' +
        (dueNow.length ? '<span class="tag amber">' + dueNow.length + ' due now</span>'
                       : '<span class="tag green">Nothing due</span>') + '</div>' +
      (invoices.length ? invoices.map(invRow).join('') : '<p class="empty" style="padding:18px 0">No invoices yet.</p>') +
    '</div>' +

    /* Annual renewals. Deliberately NOT on the home screen and never counted
       in the outstanding balance: a domain renewal eleven months out is not
       money owed today, and parking it on the home screen is noise. It is
       charged automatically on its renewal date. */
    (ANNUAL.length ?
      '<div class="card">' +
        '<div class="card-h"><h3>Upcoming annual renewals</h3>' +
          '<span class="tag grey">' + money(ANNUAL.reduce((t,p) => t + Number(p.amount || 0), 0)) + '</span></div>' +
        ANNUAL.map(p =>

function payRow(p){
  const refunds = Array.isArray(p.refunds) ? p.refunds : [];
  const label = p.invoice_number ? 'Invoice ' + p.invoice_number : (p.description || 'Payment');
  const method = p.method_last4 ? esc(p.method_brand || p.method || 'Card') + ' ····' + esc(p.method_last4) : esc(p.method || '');
  return '<div class="row">' +
    '<div class="chip green"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
    '<div class="row-body"><b>' + esc(label) + '</b>' +
      '<span>' + fmtShort(p.paid_at) + ' &middot; ' + method + '</span>' +
      refunds.map(r => '<span class="neg">Refunded ' + money(r.amount) + ' &middot; ' + fmtShort(r.created_at) + '</span>').join('') +
    '</div>' +
    '<div class="row-end" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">' +
      '<b>' + money(p.amount) + '</b>' +
      /* Receipt numbers were sliced at 14 chars, which cut generated ones
         mid-token and rendered "RCPT-MSV0UW80-" with a dangling dash. Break on
         a separator instead, so what is shown is always a whole segment. */
      '<span title="' + esc(p.receipt_number || '') + '">' +
        esc((function(rn){
          rn = String(rn || '');
          if(rn.length <= 18) return rn;
          const cut = rn.lastIndexOf('-', 18);
          return (cut > 4 ? rn.slice(0, cut) : rn.slice(0, 18)) + '…';
        })(p.receipt_number)) + '</span>' +
      '<button class="btn btn-ghost btn-sm" onclick="downloadReceipt(' + p.id + ',this)">Receipt</button>' +
    '</div>' +
  '</div>';

function planCard(p){
  const cancelling = p.status === 'pending_cancellation';
  const needsSig = p.status === 'pending_signature';
  const needsPm = p.status === 'pending_payment_method';
  const pm = p.payment_method;
  const method = pm ? esc(pm.brand || pm.bank_name || 'Card') + ' ····' + esc(pm.last4 || '') : 'No payment method';
  const tone = p.status === 'active' ? 'green' : (cancelling ? 'red' : 'amber');
  return '<div style="padding:15px 0;border-bottom:1px solid var(--line-2)">' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">' +
      '<div style="min-width:0">' +
        '<b style="font-size:15px;font-weight:800;letter-spacing:-.02em;display:block">' + esc(p.label) + '</b>' +
        '<span style="font-size:13px;color:var(--muted)">' + money(p.charge_total != null ? p.charge_total : p.amount) + (p.interval_unit === 'year' ? '/yr' : '/mo') + ' &middot; ' + method + '</span>' +
      '</div><span class="tag ' + tone + '">' + esc(String(p.status || '').replace(/_/g,' ')) + '</span>' +
    '</div>' +
    (cancelling ? '<div class="alert alert-warn" style="margin:12px 0 0">Ends ' + fmtDate(p.cancels_at) +
      (p.days_until_cancellation != null ? ' &mdash; ' + p.days_until_cancellation + ' day' + (p.days_until_cancellation === 1 ? '' : 's') + ' away' : '') +
      '. ' + (p.kind === 'crm' ? 'You keep CRM access until then.' : 'Service continues until then.') +
      /* When a charge inside the notice window paid for a period running past
         the 30 days, the end date moves out to cover it. Saying so stops the
         later date looking like a mistake. */
      ' You keep everything you&rsquo;ve paid for through that date.' + '</div>' : '') +
    (needsSig ? '<div class="alert alert-info" style="margin:12px 0 0">Needs your signature before it can start. Nothing is charged until you sign.</div>' : '') +
    (needsPm ? '<div class="alert alert-info" style="margin:12px 0 0">Signed &mdash; add a payment method to start the plan.</div>' : '') +
    /* A cancelling plan has no "first payment" and does not "renew monthly".
       The old line said both, because it only distinguished active from
       everything-else — so a plan you had just cancelled cheerfully announced
       when its first payment would be and that it renews monthly. */
    /* "First payment" means the plan has NEVER been charged. That is a fact
       about the plan's history, not about its current status — the old line
       inferred it from status alone, so a plan that had been paid, cancelled,
       reinstated and cancelled again still announced its "first payment", on a
       date it would never be charged.

       hasBeenCharged is the real test. And a cancelling plan whose next charge
       lands on or after its end date has no further payment at all: that date
       is a leftover, not a schedule. */
    (function(){
      const hasBeenCharged = Number(p.charges_completed || 0) > 0 || !!p.last_charge_date;
      if(cancelling){
        const end = p.cancels_at ? new Date(p.cancels_at) : null;
        const nxt = p.next_charge_date ? new Date(p.next_charge_date) : null;
        const willCharge = nxt && end && nxt < end;
        return '<div style="font-size:13px;color:var(--muted);margin-top:10px">' +
          (willCharge
            ? 'Final payment ' + fmtDate(p.next_charge_date) + ' &middot; nothing after that'
            : 'No further payments' +
              (hasBeenCharged && p.last_charge_date ? ' &middot; last paid ' + fmtDate(p.last_charge_date) : '')) +
          '</div>';
      }
      if(!p.next_charge_date) return '';
      const when = fmtDate(p.next_charge_date);
      const cadence = p.interval_unit === 'year' ? ' &middot; renews yearly' : ' &middot; then monthly';
      const label = hasBeenCharged ? 'Next payment ' : 'First payment ';
      return '<div style="font-size:13px;color:var(--muted);margin-top:10px">' +
        (needsSig ? label + when + ' &middot; once signed'
         : needsPm ? label + when + ' &middot; once a method is added'
         : label + when + cadence) + '</div>';
    })() +
    '<div style="display:flex;gap:9px;margin-top:13px;flex-wrap:wrap">' +
      (needsSig && p.agreement_id ? '<button class="btn btn-primary btn-sm" onclick="openSign(' + p.agreement_id + ')">Review &amp; sign</button>' : '') +
      (p.can_change_payment_method && !needsSig
        ? '<button class="btn btn-ghost btn-sm" onclick="changePm(\'' + p.kind + '\',' + p.id + ')">' + (pm ? 'Change method' : 'Add method') + '</button>' : '') +
      (cancelling ? '<button class="btn btn-primary btn-sm" onclick="reinstate(\'' + p.kind + '\',' + p.id + ')">Keep this plan</button>'
        : (p.can_cancel ? '<button class="btn btn-danger btn-sm" onclick="cancelPlan(\'' + p.kind + '\',' + p.id + ')">Cancel</button>' : '')) +
    '</div></div>';
}

/* One authenticated download path for every PDF the portal offers.
   A bare <a href> cannot carry the bearer token: the request arrives
   unauthenticated, returns 401, and the browser saves the error JSON with a
   .pdf extension. That is what "Download Agreement is broken" was. */
async function downloadDoc(path, fallbackName, okMessage, btn){
  const label = btn ? btn.textContent : 'Download';
  if(btn){ btn.disabled = true; btn.textContent = 'Preparing…'; }
  try{
    const r = await fetch(API + path, {headers: {'Authorization':'Bearer ' + TOKEN}});
    if(!r.ok){
      let msg = 'Could not prepare that PDF (' + r.status + ')';
      try{ const d = await r.json(); if(d && d.message) msg = d.message; }catch(_){}
      throw new Error(msg);
    }
    const blob = await r.blob();
    if(!blob.size) throw new Error('The PDF came back empty. Please contact us.');
    /* Prefer the filename the server set, so a receipt keeps its receipt
       number rather than an internal row id. */
    let name = fallbackName;
    const cd = r.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename="?([^";]+)"?/);
    if(m) name = m[1];
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    /* Revoked late: Safari cancels the download if the URL dies too soon. */
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast(okMessage);
  }catch(e){ toast(e.message, true); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = label; } }
}

function downloadAgreement(id, btn){
  return downloadDoc('/api/portal/sales-agreements/' + id + '/pdf',
                     'Agreement-' + id + '.pdf', 'Agreement downloaded.', btn);
}

          '<div>No messages yet. Say hello &mdash; we&rsquo;re quick to reply.</div></div>') +
      '</div>' +
      '<div class="composer">' +
        '<textarea id="msgBox" rows="1" placeholder="Write a message…"></textarea>' +
        '<button class="btn btn-primary" id="msgSend" onclick="sendMsg()">Send</button>' +
      '</div>' +
    '</div>';

  const box = document.getElementById('msgBox');
  box.addEventListener('input', () => { box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight,130) + 'px'; });
  box.addEventListener('keydown', e => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendMsg(); } });
  const th = document.getElementById('thread'); th.scrollTop = th.scrollHeight;
}

async function sendMsg(){
  const box = document.getElementById('msgBox');
  const btn = document.getElementById('msgSend');
  const body = box.value.trim();
  if(!body) return;
  btn.disabled = true;
  try{
    await post('/api/portal/messages', {body});
    box.value = ''; box.style.height = 'auto';
    await vMessages();
  }catch(e){ toast(e.message, true); btn.disabled = false; }
}
