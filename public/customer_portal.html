<style>
/* ========================================================================
   DIAMONDBACK CODING — CUSTOMER PORTAL
   Tokens lifted verbatim from admin_portal.html so this file sits in the
   same design system as the rest of the platform.
   ======================================================================== */
:root{
  /* Brand */
  --brand-gold:#D4A574;
  --brand-gold-light:#E5C4A0;
  --brand-gold-dark:#B88F5F;
  --accent-amber:#D4A574;
  --accent-rust:#A67C52;
  --accent-dim:rgba(212,165,116,.12);
  --accent-glow:rgba(212,165,116,.25);

  /* Surfaces */
  --bg-void:#000000;
  --bg-primary:#0a0a0a;
  --bg-secondary:#121212;
  --bg-tertiary:#1a1a1a;
  --bg-elevated:#1e1e1e;
  --bg-card:#141414;
  --bg-hover:rgba(212,165,116,.08);

  /* Borders */
  --border-subtle:rgba(255,255,255,.06);
  --border-default:rgba(255,255,255,.1);
  --border-strong:rgba(212,165,116,.2);
  --border-accent:rgba(212,165,116,.4);

  /* Text */
  --text-primary:#ffffff;
  --text-secondary:#b4b4b4;
  --text-muted:#808080;
  --text-faint:#4d4d4d;

  /* Status */
  --status-new:#60a5fa;
  --status-pending:#f59e0b;
  --status-sent:#3b82f6;
  --status-paid:#10b981;
  --status-overdue:#dc2626;
  --status-draft:#9ca3af;
  --status-closed:#6b7280;
  --status-success:#10b981;
  --status-danger:#ef4444;

  /* Type */
  --font-display:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'Space Mono','Courier New',monospace;

  /* Geometry */
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-xl:24px;
  --shadow-sm:0 2px 8px rgba(0,0,0,.4);
  --shadow-md:0 4px 16px rgba(0,0,0,.5);
  --shadow-lg:0 8px 32px rgba(0,0,0,.6);
  --shadow-glow:0 0 40px rgba(212,165,116,.15);
  --sidebar-width:280px;
  --transition-fast:150ms cubic-bezier(.4,0,.2,1);
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-display);background:var(--bg-primary);color:var(--text-primary);-webkit-font-smoothing:antialiased}
a{color:var(--brand-gold);text-decoration:none}
a:hover{color:var(--brand-gold-light)}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--brand-gold);outline-offset:2px}


.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;cursor:pointer;
  border-radius:var(--radius-sm);padding:13px 22px;font-size:14px;font-weight:600;letter-spacing:.2px;
  transition:var(--transition-fast);font-family:var(--font-display)}
.btn-primary{background:var(--brand-gold);color:#1a1206}
.btn-primary:hover{background:var(--brand-gold-light);transform:translateY(-1px);box-shadow:var(--shadow-glow)}
.btn-secondary{background:transparent;color:var(--brand-gold);border:1px solid var(--border-accent)}
.btn-secondary:hover{background:var(--accent-dim)}
.btn-ghost{background:var(--bg-tertiary);color:var(--text-primary);border:1px solid var(--border-default)}
.btn-ghost:hover{border-color:var(--border-accent);color:var(--brand-gold)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

input,select,textarea{width:100%;background:var(--bg-tertiary);border:1px solid var(--border-default);
  color:var(--text-primary);border-radius:var(--radius-sm);padding:12px 14px;font-size:14px;
  font-family:var(--font-display);transition:var(--transition-fast)}
/* NOTE: Crown's build had `input:focus,select,textarea:focus` — the bare
   `select` left every dropdown permanently drawn in the focus color. Fixed. */
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-gold);box-shadow:0 0 0 3px var(--accent-dim)}
input::placeholder,textarea::placeholder{color:var(--text-faint)}
label{display:block;font-family:var(--font-mono);font-size:10.5px;color:var(--text-muted);margin-bottom:7px;
  font-weight:700;letter-spacing:1px;text-transform:uppercase}
.field{margin-bottom:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  padding:24px;box-shadow:var(--shadow-sm)}
.card h3{font-family:var(--font-mono);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-secondary)}

.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-family:var(--font-mono);font-size:10px;
  font-weight:700;text-transform:uppercase;letter-spacing:.6px;background:var(--bg-tertiary);color:var(--text-muted)}
.pill.paid,.pill.completed{background:rgba(16,185,129,.12);color:var(--status-paid)}
.pill.unpaid,.pill.overdue{background:rgba(220,38,38,.12);color:var(--status-overdue)}
.pill.sent{background:rgba(59,130,246,.12);color:var(--status-sent)}
.pill.pending,.pill.new{background:rgba(245,158,11,.12);color:var(--status-pending)}
.pill.draft{background:rgba(156,163,175,.12);color:var(--status-draft)}
.pill.scheduled,.pill.in-progress,.pill.signed{background:var(--accent-dim);color:var(--brand-gold)}
.pill.cancelled{background:rgba(107,114,128,.14);color:var(--status-closed);text-decoration:line-through}

/* ---------------- LOGO (identical treatment to admin_portal.html) ---------- */
.logo{display:flex;align-items:center;gap:14px}
.logo-mark{width:44px;height:44px;background:linear-gradient(135deg,var(--accent-amber) 0%,var(--accent-rust) 100%);
  border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;position:relative;
  box-shadow:0 4px 20px rgba(212,165,116,.3);flex-shrink:0}
.logo-mark::before{content:'';position:absolute;inset:-2px;
  background:linear-gradient(135deg,var(--accent-amber),transparent);border-radius:var(--radius-md);
  opacity:.5;z-index:-1}
.logo-mark svg{width:24px;height:24px;color:var(--bg-void)}
.logo-text{display:flex;flex-direction:column;gap:2px}
.logo-title{font-weight:800;font-size:17px;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--text-primary) 0%,var(--accent-amber) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-subtitle{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.15em;color:var(--text-muted)}
/* compact variants */
.logo.sm .logo-mark{width:34px;height:34px;border-radius:var(--radius-sm)}
.logo.sm .logo-mark svg{width:19px;height:19px}
.logo.sm .logo-title{font-size:14px}
.logo.sm .logo-subtitle{font-size:9px}
.logo.lg{flex-direction:column;align-items:flex-start;gap:16px}
.logo.lg .logo-mark{width:52px;height:52px}
.logo.lg .logo-mark svg{width:28px;height:28px}

/* ---------------- LOGIN ---------------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(ellipse at 50% -10%,rgba(212,165,116,.10),transparent 55%),var(--bg-void)}
#login .box{width:100%;max-width:430px}
#login .card{padding:38px;border-color:var(--border-strong);box-shadow:var(--shadow-lg)}
#login h2{font-family:var(--font-display);font-size:23px;font-weight:600;letter-spacing:-.3px;margin-bottom:4px}
.db-badge{width:52px;height:52px;border-radius:var(--radius-md);background:var(--accent-dim);
  border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.login-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.28);color:#ff9d9d;padding:11px 14px;
  border-radius:var(--radius-sm);font-size:13px;margin-bottom:14px}

/* ---------------- SHELL ---------------- */
#app{display:grid;grid-template-columns:var(--sidebar-width) 1fr;min-height:100vh}
.sidebar{background:var(--bg-void);border-right:1px solid var(--border-subtle);padding:26px 18px;
  display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.sidebar .nav-link{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);
  color:var(--text-muted);cursor:pointer;font-size:14px;font-weight:500;transition:var(--transition-fast);
  border:1px solid transparent}
.nav-link:hover{background:var(--bg-hover);color:var(--text-primary)}
.nav-link.active{background:var(--accent-dim);color:var(--brand-gold);border-color:var(--border-strong)}
.nav-link svg{width:18px;height:18px;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--brand-gold);color:#1a1206;font-family:var(--font-mono);
  font-size:10px;font-weight:700;border-radius:999px;padding:2px 8px}
.sidebar .spacer{flex:1}

.main{padding:36px 40px;max-width:1120px}
.page-title{font-family:var(--font-display);font-size:30px;font-weight:600;letter-spacing:-.7px;margin-bottom:5px}
.page-sub{color:var(--text-muted);font-size:14px;margin-bottom:28px}

.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:30px}
.stat{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);
  padding:22px;transition:var(--transition-fast)}
.stat.tappable{cursor:pointer}
.stat.tappable:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.stat .label{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:10px}
.stat .value{font-family:var(--font-display);font-size:29px;font-weight:600;letter-spacing:-.8px}
.stat.lead{border-color:var(--border-strong);background:
  linear-gradient(150deg,rgba(212,165,116,.09),rgba(212,165,116,.01)),var(--bg-card)}
.stat.lead .value{color:var(--brand-gold)}

.list-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 0;
  border-bottom:1px solid var(--border-subtle)}
.list-item:last-child{border-bottom:none}
.muted{color:var(--text-muted)}.sm{font-size:13px}.mt{margin-top:18px}
.mono{font-family:var(--font-mono)}

.timeline{position:relative;padding-left:26px}
.timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--border-default)}
.tl-item{position:relative;padding-bottom:18px}
.tl-dot{position:absolute;left:-26px;top:2px;width:16px;height:16px;border-radius:50%;
  background:var(--bg-tertiary);border:2px solid var(--text-faint)}
.tl-dot.done{background:var(--brand-gold);border-color:var(--brand-gold)}

/* ---------------- MODAL ---------------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;
  padding:20px;z-index:100}
.modal{background:var(--bg-secondary);border:1px solid var(--border-strong);border-radius:var(--radius-lg);
  width:100%;max-width:530px;max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;
  border-bottom:1px solid var(--border-subtle)}
.modal-head h3{font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-secondary)}
.modal-body{padding:24px}
.modal-body h4{font-family:var(--font-display);font-size:17px;font-weight:600;letter-spacing:-.2px}
.x{cursor:pointer;color:var(--text-muted);font-size:22px;line-height:1;background:none;border:none;padding:0 4px}
.x:hover{color:var(--text-primary)}
.steps{display:flex;gap:8px;margin-bottom:22px}
.step{flex:1;height:3px;border-radius:999px;background:var(--bg-elevated)}
.step.active{background:var(--brand-gold)}
.summary-line{display:flex;justify-content:space-between;padding:9px 0;font-size:14px}
.summary-line span:last-child{font-family:var(--font-mono)}
.summary-line.total{border-top:1px solid var(--border-default);margin-top:6px;padding-top:14px;font-size:17px;font-weight:600}
#payment-element{margin-top:6px}
.pay-msg{font-size:13px;margin-top:12px}

/* ---------------- MESSAGES ---------------- */
.msg-wrap{display:flex;flex-direction:column;height:calc(100vh - 210px);max-height:720px;min-height:420px;
  background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);overflow:hidden}
.msg-head{padding:16px 22px;border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:12px}
.msg-head .n{font-weight:600;font-size:15px}
.msg-head .s{font-size:12px;color:var(--text-muted)}
.msg-feed{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:3px;background:var(--bg-primary)}
.msg-day{text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--text-faint);margin:14px 0 8px;
  font-weight:700;text-transform:uppercase;letter-spacing:1px}
.bub{max-width:74%;padding:11px 15px;border-radius:16px;font-size:14px;line-height:1.5;word-wrap:break-word;margin-bottom:2px}
.bub.them{align-self:flex-start;background:var(--bg-elevated);color:var(--text-primary);border-bottom-left-radius:5px}
.bub.me{align-self:flex-end;background:var(--brand-gold);color:#1a1206;font-weight:500;border-bottom-right-radius:5px}
.bub.mkt{align-self:stretch;max-width:100%;background:var(--accent-dim);border:1px solid var(--border-strong);
  color:var(--text-primary);border-radius:var(--radius-md);padding:15px 17px}
.bub.mkt .mk-tag{display:inline-block;font-family:var(--font-mono);font-size:9.5px;font-weight:700;letter-spacing:1px;
  text-transform:uppercase;color:var(--brand-gold);margin-bottom:7px}
.bub.mkt .mk-sub{font-weight:600;font-size:15px;margin-bottom:4px}
.bub-meta{font-family:var(--font-mono);font-size:9.5px;color:var(--text-faint);margin:0 5px 10px}
.bub-meta.me{align-self:flex-end}.bub-meta.them{align-self:flex-start}
.msg-compose{border-top:1px solid var(--border-subtle);padding:12px 14px;display:flex;gap:10px;
  align-items:flex-end;background:var(--bg-card)}
.msg-compose textarea{flex:1;resize:none;min-height:44px;max-height:130px;border-radius:16px;padding:11px 15px}
.msg-send{flex-shrink:0;width:44px;height:44px;border-radius:var(--radius-sm);border:none;cursor:pointer;
  background:var(--brand-gold);color:#1a1206;display:flex;align-items:center;justify-content:center;
  transition:var(--transition-fast)}
.msg-send:hover{background:var(--brand-gold-light)}
.msg-send:disabled{opacity:.45}
.msg-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  color:var(--text-muted);text-align:center;padding:30px}
.msg-empty svg{width:42px;height:42px;opacity:.3}
.msg-empty .hint{font-size:13.5px;max-width:280px;line-height:1.5}

/* ---------------- MOBILE ---------------- */
.mobile-bar{display:none;position:fixed;top:0;left:0;right:0;background:var(--bg-void);
  border-bottom:1px solid var(--border-subtle);align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;z-index:40}
.hamb{background:var(--bg-tertiary);border:1px solid var(--border-subtle);color:var(--text-primary);cursor:pointer;
  width:40px;height:40px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
  font-size:17px;position:relative}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:45}
.scrim.show{display:block}
@media(max-width:900px){
  #app{grid-template-columns:1fr}
  .sidebar{position:fixed;z-index:50;transform:translateX(-100%);transition:transform .25s;width:270px}
  .sidebar.open{transform:none}
  .main{padding:calc(env(safe-area-inset-top,0px) + 90px) 16px 44px;max-width:none}
  .stat-grid{grid-template-columns:1fr 1fr;gap:12px}
  .stat.lead{grid-column:1 / -1}
  .row{grid-template-columns:1fr}
  .mobile-bar{display:flex}
  .mobile-bar .logo{min-width:0}
  .mobile-bar .logo-text{min-width:0;overflow:hidden}
  .mobile-bar .logo-title,.mobile-bar .logo-subtitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .page-title{font-size:24px}
  .msg-wrap{height:calc(100vh - 195px)}
  .list-item{flex-wrap:wrap}
  input,select,textarea{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .btn-primary:hover,.stat.tappable:hover{transform:none}
}

</style>
</head>

    <div class="nav-link" data-view="requests" onclick="nav('requests')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 0 1 4 0v.09A1.65 1.65 0 0 0 15 4.6h.09a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Service Requests</div>
    <div class="nav-link" data-view="messages" onclick="nav('messages')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Messages<span class="nav-badge hidden" id="msgNavBadge">0</span></div>
    <div class="nav-link" data-view="documents" onclick="nav('documents')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>Receipts &amp; Docs</div>
    <div class="spacer"></div>
    <div class="nav-link" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</div>
  </aside>

  <main class="main" id="main"><!-- views injected here --></main>
</div>

<div id="payModalMount"></div>

<script>
/* ========================================================================
   CONFIG
   ======================================================================== */
const API = (location.origin && location.origin.startsWith('http')) ? location.origin : '';
const COMPANY = 'Diamondback Coding';

// Shown if Stripe can't load, so the customer has a way to pay.
// TODO: replace with Diamondback's real support number.
const SUPPORT_PHONE = '';

// Stripe *publishable* key (starts pk_live_ / pk_test_). Safe to expose.
// Preferred: set STRIPE_PUBLISHABLE_KEY on the server — it's served from
// /api/config/stripe and used automatically. This is only a fallback.
const STRIPE_PK_FALLBACK = '';

let TOKEN  = localStorage.getItem('db_portal_token') || '';
let CLIENT = JSON.parse(localStorage.getItem('db_portal') || 'null');
let DASH = null, REQUESTS = [], MESSAGES = [], STRIPE = null, STRIPE_PK = '';

/* ---------------- HELPERS ---------------- */
function authHeaders(){ return { 'Authorization':'Bearer '+TOKEN, 'Content-Type':'application/json' }; }
function money(n){ return '$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—'; }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toggleSidebar(force){
  const sb = document.querySelector('.sidebar'), sc = document.getElementById('scrim');
  const open = (force===undefined) ? !sb.classList.contains('open') : force;
  sb.classList.toggle('open', open); sc.classList.toggle('show', open);
}

/* ---------------- AUTH ---------------- */
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginErr');
  errEl.classList.add('hidden');
  if(!email || !password){ errEl.textContent='Enter your email and password.'; errEl.classList.remove('hidden'); return; }
  try{
    const r = await fetch(API+'/api/portal/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const d = await r.json();
    if(!r.ok || !d.success){ errEl.textContent = d.message || 'That email and password don\u2019t match an account.'; errEl.classList.remove('hidden'); return; }
    TOKEN = d.token; CLIENT = d.client;
    localStorage.setItem('db_portal_token',TOKEN);
    localStorage.setItem('db_portal',JSON.stringify(CLIENT));
    startApp();
  }catch(e){ errEl.textContent='Can\u2019t reach the server. Check your connection and try again.'; errEl.classList.remove('hidden'); }
}
function logout(){ localStorage.removeItem('db_portal_token'); localStorage.removeItem('db_portal'); location.reload(); }
document.getElementById('loginPass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

/* ---------------- BOOTSTRAP ---------------- */
async function startApp(){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  try{
    const c = await (await fetch(API+'/api/config/stripe')).json();
    STRIPE_PK = c.publishableKey || STRIPE_PK_FALLBACK || '';
    if(STRIPE_PK && window.Stripe) STRIPE = Stripe(STRIPE_PK);
  }catch(e){
    if(STRIPE_PK_FALLBACK && window.Stripe){ STRIPE_PK = STRIPE_PK_FALLBACK; STRIPE = Stripe(STRIPE_PK); }
  }

  await loadDashboard();
  await loadRequests();
  await loadMessages();
  refreshMsgBadge();

  // Live thread: poll messages, and re-render only if the thread actually changed
  // so we don't stomp a half-typed reply.
  let lastSig = msgSig();
  async function pollMessages(){
    const link = document.querySelector('.nav-link[data-view="messages"]');
    const onThread = !!(link && link.classList.contains('active'));
    await loadMessages();
    refreshMsgBadge();
    if(onThread){
      const sig = msgSig();
      if(sig !== lastSig){
        const ta = document.getElementById('msgInput');
        const draft = ta ? ta.value : '';
        viewMessages();
        const ta2 = document.getElementById('msgInput');
        if(ta2 && draft){ ta2.value = draft; ta2.style.height='auto'; ta2.style.height=Math.min(ta2.scrollHeight,130)+'px'; }
      }
    }
    lastSig = msgSig();
  }
  setInterval(pollMessages, 7000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') pollMessages(); });
  window.addEventListener('focus', refreshMsgBadge);

  nav('dashboard');
}
function msgSig(){
  if(!MESSAGES.length) return '0|';
  const last = MESSAGES[MESSAGES.length-1];
  return MESSAGES.length + '|' + (last.id || last.created_at || '');
}

const EMPTY_DASH = {invoices:[],projects:[],salesAgreements:[],tickets:[],activity:[]};
async function loadDashboard(){
  try{
    const r = await fetch(API+'/api/portal/dashboard',{headers:authHeaders()});
    if(r.status===401){ logout(); return; }
    const d = await r.json();
    DASH = d.dashboard || EMPTY_DASH;
    const unpaid = (DASH.invoices||[]).filter(i=>i.status!=='paid').length;
    const b=document.getElementById('invBadge');
    if(unpaid>0){ b.textContent=unpaid; b.classList.remove('hidden'); } else b.classList.add('hidden');
  }catch(e){ DASH = EMPTY_DASH; }
}
async function loadRequests(){
  try{ const d = await (await fetch(API+'/api/portal/service-requests',{headers:authHeaders()})).json(); REQUESTS = d.requests||[]; }
  catch(e){ REQUESTS=[]; }
}

/* ---------------- NAV ---------------- */
function nav(view){
  document.querySelectorAll('.nav-link').forEach(n=>n.classList.toggle('active', n.dataset.view===view));
  toggleSidebar(false);
  ({dashboard:viewDashboard,invoices:viewInvoices,projects:viewProjects,requests:viewRequests,
    documents:viewDocuments,messages:viewMessages}[view]||viewDashboard)();
}

/* ---------------- DASHBOARD ---------------- */
function viewDashboard(){
  const inv = DASH.invoices||[];
  const outstanding = inv.filter(i=>i.status!=='paid').reduce((s,i)=>s+Number(i.total_amount||0),0);
  const agreements = (DASH.salesAgreements||[]).filter(a=>(a.status||'')!=='cancelled').length;
  const openReq = REQUESTS.filter(r=>r.status!=='completed'&&r.status!=='closed').length;
  const recent = inv.slice(0,4).map(i=>`
    <div class="list-item">
      <div><div class="mono sm">${esc(i.invoice_number||('Invoice #'+i.id))}</div>
        <div class="muted sm">${fmtDate(i.issue_date||i.created_at)}</div></div>
      <div style="text-align:right"><div class="mono">${money(i.total_amount)}</div>
        <span class="pill ${esc(i.status)}">${esc(i.status)}</span></div>
    </div>`).join('') || '<p class="muted sm">Invoices will appear here once we send you one.</p>';

  document.getElementById('main').innerHTML = `
    <div class="page-title">Welcome back${CLIENT&&CLIENT.name?', '+esc(CLIENT.name.split(' ')[0]):''}</div>
    <div class="page-sub">Your account at a glance.</div>
    <div class="stat-grid">
      <div class="stat lead"><div class="label">Outstanding balance</div><div class="value">${money(outstanding)}</div></div>
      <div class="stat tappable" onclick="nav('projects')"><div class="label">Agreements</div><div class="value">${agreements}</div></div>
      <div class="stat tappable" onclick="nav('requests')"><div class="label">Open requests</div><div class="value">${openReq}</div></div>
    </div>
    <div class="card"><h3 style="margin-bottom:10px;">Recent invoices</h3>${recent}
      ${outstanding>0?`<div class="mt"><button class="btn btn-primary" onclick="nav('invoices')">Pay an invoice</button></div>`:''}
    </div>`;
}

/* ---------------- INVOICES ---------------- */
function viewInvoices(){
  const inv = DASH.invoices||[];
  const rows = inv.map(i=>`
    <div class="list-item">
      <div><div class="mono sm">${esc(i.invoice_number||('Invoice #'+i.id))}</div>
        <div class="muted sm">${esc(i.short_description||'Development services')} · Due ${fmtDate(i.due_date)}</div></div>
      <div style="display:flex;align-items:center;gap:16px;">
        <div style="text-align:right"><div class="mono">${money(i.total_amount)}</div>
          <span class="pill ${esc(i.status)}">${esc(i.status)}</span></div>
        ${i.status!=='paid'
          ? `<button class="btn btn-primary" onclick="openPay(${i.id})">Pay now</button>`
          : `<button class="btn btn-ghost" onclick="viewReceipt(${i.id})">Receipt</button>`}
      </div>
    </div>`).join('') || '<p class="muted sm">No invoices yet.</p>';
  document.getElementById('main').innerHTML = `
    <div class="page-title">Invoices</div>
    <div class="page-sub">Review and pay by card without leaving the portal.</div>
    <div class="card">${rows}</div>`;
}

/* ---------------- AGREEMENTS ---------------- */
function serviceLabel(t){
  const m = {
    web_development:'Web Development',
    web_design:'Web Design',
    crm_implementation:'CRM Implementation',
    custom_software:'Custom Software',
    integration:'Integrations & API Work',
    maintenance:'Maintenance & Support',
    hosting:'Hosting & Infrastructure',
    seo:'SEO & Performance'
  };
  return m[t] || (t ? String(t).replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) : 'Service');
}
function viewProjects(){
  const list = DASH.salesAgreements||[];
  const head = `<div class="page-title">Agreements</div>
    <div class="page-sub">Your signed scopes of work with ${COMPANY}.</div>`;
  if(!list.length){
    document.getElementById('main').innerHTML = head +
      `<div class="card"><p class="muted sm">No agreements yet. When we prepare a scope of work for you, it shows up here with its payment terms.</p></div>`;
    return;
  }
  const invoices = DASH.invoices||[];
  const cards = list.map(a=>{
    const price = Number(a.price||0);
    const reqDep = !!a.require_deposit && Number(a.deposit_pct||0)>0;
    const pct = Number(a.deposit_pct||0);
    const dep = reqDep ? (Number(a.deposit) || Math.round(price*pct)/100) : 0;
    const bal = Math.round((price-dep)*100)/100;
    const linked = invoices.filter(i=> i.id===a.invoice_id || i.id===a.balance_invoice_id);
    const payRows = linked.map(i=>`
      <div class="list-item" style="padding:9px 0;">
        <div><div class="mono sm">${esc(i.invoice_number||('Invoice #'+i.id))}</div>
          <div class="muted sm">${esc(i.short_description||'')}</div></div>
        <div style="display:flex;align-items:center;gap:12px;">
          <div class="mono sm">${money(i.total_amount)}</div>
          <span class="pill ${esc(i.status)}">${esc(i.status)}</span>
          ${i.status!=='paid'?`<button class="btn btn-primary" onclick="openPay(${i.id})">Pay</button>`:''}
        </div></div>`).join('');
    const terms = reqDep
      ? `Deposit ${pct}% (${money(dep)}) at signing · Balance ${money(bal)} on delivery`
      : `Full amount ${money(price)} due on delivery`;
    const st = a.status||'draft';
    return `<div class="card mt">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">
        <div><h3>${esc(serviceLabel(a.service_type))}${a.package_name?(' — '+esc(a.package_name)):''}</h3>
          <div class="muted sm" style="margin-top:4px;">${esc(a.agreement_number||'')}${a.project?(' · '+esc(a.project)):(a.vehicle?(' · '+esc(a.vehicle)):'')} · ${fmtDate(a.created_at)}</div></div>
        <span class="pill ${st==='completed'?'paid':(st==='cancelled'?'cancelled':'in-progress')}">${esc(st)}</span>
      </div>
      <div class="mt"><span class="muted sm">Total</span><div class="mono" style="font-size:19px;font-weight:800;">${money(price)}</div></div>
      <div class="muted sm mt">${esc(terms)}</div>
      ${payRows?`<div class="mt">${payRows}</div>`:''}
      ${a.terms?`<details class="mt"><summary class="muted sm mono" style="cursor:pointer;">View scope of work</summary>
        <div class="sm" style="white-space:pre-wrap;margin-top:10px;line-height:1.6;">${esc(a.terms)}</div></details>`:''}
      <div class="mt"><button class="btn btn-secondary" onclick="downloadAgreement(${a.id},this)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download agreement</button></div>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML = head + cards;
}
async function downloadAgreement(id, btn){
  const orig = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Preparing…'; }
  try{
    const r = await fetch(API+`/api/portal/sales-agreements/${id}/pdf`, { headers:{ 'Authorization':'Bearer '+TOKEN } });
    if(!r.ok) throw new Error('download failed');
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `Agreement-${id}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }catch(e){
    alert('That agreement couldn\u2019t be prepared. Try again, or message us from the Messages tab.');
  }finally{
    if(btn){ btn.disabled = false; btn.innerHTML = orig; }
  }
}
async function loadMilestones(pid){
  try{
    const d = await (await fetch(API+'/api/portal/projects/'+pid+'/milestones',{headers:authHeaders()})).json();
    const ms = d.milestones||d.data||[];
    const el = document.getElementById('ml-'+pid); if(!el || !ms.length) return;
    el.innerHTML = `<div class="timeline">${ms.map(m=>`<div class="tl-item">
      <div class="tl-dot ${m.status==='completed'?'done':''}"></div>
      <div style="font-size:14px;font-weight:500">${esc(m.title||m.name)}</div>
      <div class="muted sm">${m.status==='completed'?('Completed '+fmtDate(m.completed_at||m.updated_at)):(m.due_date?('Due '+fmtDate(m.due_date)):(m.status||'pending'))}</div>
    </div>`).join('')}</div>`;
  }catch(e){}
}

/* ---------------- SERVICE REQUESTS ---------------- */
function viewRequests(){
  const rows = REQUESTS.map(r=>`
    <div class="list-item">
      <div><div class="sm">${esc(r.service_type)}</div>
        <div class="muted sm">${esc(r.project||r.vehicle||'')}${r.preferred_date?(' · prefers '+fmtDate(r.preferred_date)):''}</div></div>
      <span class="pill ${esc(r.status)}">${esc(r.status)}</span>
    </div>`).join('') || '<p class="muted sm">Nothing requested yet.</p>';
  document.getElementById('main').innerHTML = `
    <div class="page-title">Service Requests</div>
    <div class="page-sub">Ask for new work or a change to something we already built. We\u2019ll confirm scope and timing.</div>
    <div class="card">
      <div class="row">
        <div class="field"><label>What do you need</label><select id="srType">
          <option>New website or page</option>
          <option>Website change or fix</option>
          <option>CRM setup or configuration</option>
          <option>Custom software / automation</option>
          <option>Integration or API work</option>
          <option>Maintenance &amp; support</option>
          <option>Hosting or domain</option>
          <option>Other</option>
        </select></div>
        <div class="field"><label>Project or site</label><input id="srProject" placeholder="example.com — checkout page"></div>
      </div>
      <div class="field"><label>Preferred start date</label><input id="srDate" type="date"></div>
      <div class="field"><label>Details</label><textarea id="srDetails" rows="3" placeholder="What should it do, and is anything blocking you right now?"></textarea></div>
      <button class="btn btn-primary" onclick="submitRequest()">Send request</button>
    </div>
    <div class="card mt"><h3 style="margin-bottom:8px;">Your requests</h3>${rows}</div>`;
}
async function submitRequest(){
  const project = document.getElementById('srProject').value;
  const body = {
    service_type: document.getElementById('srType').value,
    project: project,
    // service_requests still has Crown's `vehicle` column. Sending both keeps
    // this working before and after you rename that column to `project`.
    vehicle: project,
    preferred_date: document.getElementById('srDate').value||null,
    details: document.getElementById('srDetails').value
  };
  try{
    const r = await fetch(API+'/api/portal/service-requests',{method:'POST',headers:authHeaders(),body:JSON.stringify(body)});
    const d = await r.json();
    if(d.success){ await loadRequests(); nav('requests'); }
    else alert(d.message||'That request didn\u2019t go through. Check the details and try again.');
  }catch(e){ alert('Can\u2019t reach the server. Try again in a moment.'); }
}

/* ---------------- RECEIPTS & DOCS ---------------- */
function viewDocuments(){
  const paid = (DASH.invoices||[]).filter(i=>i.status==='paid');
  const rows = paid.map(i=>`
    <div class="list-item">
      <div><div class="mono sm">Receipt — ${esc(i.invoice_number||('#'+i.id))}</div>
        <div class="muted sm">Paid ${fmtDate(i.paid_at)}</div></div>
      <button class="btn btn-ghost" onclick="viewReceipt(${i.id})">View</button>
    </div>`).join('') || '<p class="muted sm">Receipts appear here after a payment clears.</p>';
  document.getElementById('main').innerHTML = `
    <div class="page-title">Receipts &amp; Documents</div>
    <div class="page-sub">Payment receipts and signed paperwork.</div>
    <div class="card">${rows}</div>`;
}
function viewReceipt(id){
  const i = (DASH.invoices||[]).find(x=>x.id===id); if(!i) return;
  const sub = Number(i.subtotal||0);
  const tax = Number(i.tax_amount||0);
  const tot = Number(i.total_amount||0);
  const fee = Math.max(0, +(tot - sub - tax).toFixed(2));
  let rate = Number(i.tax_rate||0); if(rate>0 && rate<1) rate = rate*100;
  const taxLabel = rate>0 ? `Sales tax (${(+rate.toFixed(2))}%)` : 'Sales tax';
  const w = window.open('','_blank');
  w.document.write(`<title>Receipt ${esc(i.invoice_number||id)}</title>
   <body style="font-family:Arial,Helvetica,sans-serif;max-width:600px;margin:40px auto;color:#222;">
   <h2 style="border-bottom:3px solid #D4A574;padding-bottom:10px;font-family:'Space Mono',monospace;letter-spacing:1px;">${esc(COMPANY)}</h2>
   <h3>Payment receipt</h3>
   <p><b>Invoice:</b> ${esc(i.invoice_number||('#'+i.id))}<br>
   <b>Date paid:</b> ${fmtDate(i.paid_at)}<br>
   <b>Description:</b> ${esc(i.short_description||'Development services')}</p>
   <table style="width:100%;border-collapse:collapse;margin-top:14px;">
     <tr><td style="padding:8px 0;">Subtotal</td><td style="text-align:right;">${money(sub)}</td></tr>
     <tr><td style="padding:8px 0;">${taxLabel}</td><td style="text-align:right;">${money(tax)}</td></tr>
     ${fee>0?`<tr><td style="padding:8px 0;">Card processing fee</td><td style="text-align:right;">${money(fee)}</td></tr>`:''}
     <tr style="border-top:2px solid #222;font-weight:bold;"><td style="padding:10px 0;">Total paid</td><td style="text-align:right;">${money(tot)}</td></tr>
   </table>
   <p style="color:#888;margin-top:20px;font-size:13px;">Payment method: ${esc(i.payment_method||'Card')} · Ref: ${esc(i.payment_reference||'')}</p>
   <p style="color:#888;font-size:13px;">Thank you for your business.</p>
   <script>window.print()<\/script>
</body>`);
}

/* ---------------- IN-PORTAL PAYMENT (Stripe Elements) ---------------- */
let payState = { invoiceId:null, breakdown:null, clientSecret:null, elements:null, step:1 };

async function openPay(invoiceId){
  payState = { invoiceId, breakdown:null, clientSecret:null, elements:null, step:1 };
  renderPayModal();
  try{
    const r = await fetch(API+`/api/portal/invoices/${invoiceId}/checkout`,{headers:authHeaders()});
    const d = await r.json();
    if(!d.success){ alert(d.message||'That invoice couldn\u2019t be loaded.'); closePay(); return; }
    payState.breakdown = d.breakdown; payState.invoice = d.invoice;
    renderPayModal();
  }catch(e){ alert('That invoice couldn\u2019t be loaded.'); closePay(); }
}
function closePay(){ document.getElementById('payModalMount').innerHTML=''; }
function payStepsBar(){ return `<div class="steps">${[1,2,3].map(s=>`<div class="step ${payState.step>=s?'active':''}"></div>`).join('')}</div>`; }

function renderPayModal(){
  const mount = document.getElementById('payModalMount');
  const b = payState.breakdown;
  let inner = '';
  if(!b){
    inner = `<div class="modal-body"><p class="muted mono sm">Loading invoice…</p></div>`;
  } else if(payState.step===1){
    inner = `<div class="modal-body">${payStepsBar()}
      <h4 style="margin-bottom:14px;">Review</h4>
      <div class="muted sm mono">${esc(payState.invoice.invoice_number||'')}</div>
      <div class="muted sm">${esc(payState.invoice.short_description||'Development services')}</div>
      <div class="mt">
        <div class="summary-line"><span>Subtotal</span><span>${money(b.subtotal)}</span></div>
        <div class="summary-line"><span>Sales tax${b.taxRate?` (${b.taxRate}%)`:''}</span><span>${money(b.tax)}</span></div>
        ${b.discount?`<div class="summary-line"><span>Discount</span><span>-${money(b.discount)}</span></div>`:''}
        <div class="summary-line"><span>Card processing fee</span><span>${money(b.processingFee)}</span></div>
        <div class="summary-line total"><span>Total due</span><span>${money(b.total)}</span></div>
      </div>
      <button class="btn btn-primary mt" style="width:100%" onclick="payGoto(2)">Continue to billing</button></div>`;
  } else if(payState.step===2){
    const c = CLIENT||{};
    inner = `<div class="modal-body">${payStepsBar()}
      <h4 style="margin-bottom:14px;">Billing details</h4>
      <div class="row">
        <div class="field"><label>Full name</label><input id="bName" value="${esc(c.name||'')}"></div>
        <div class="field"><label>Email</label><input id="bEmail" value="${esc(c.email||'')}"></div>
      </div>
      <div class="field"><label>Phone</label><input id="bPhone" value="${esc(c.phone||'')}"></div>
      <div class="field"><label>Billing address</label><input id="bAddr" placeholder="Street address"></div>
      <div class="row">
        <div class="field"><label>City</label><input id="bCity"></div>
        <div class="field"><label>ZIP</label><input id="bZip"></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:6px;">
        <button class="btn btn-ghost" onclick="payGoto(1)">Back</button>
        <button class="btn btn-primary" style="flex:1" onclick="payGoto(3)">Continue to payment</button></div></div>`;
  } else if(payState.step===3){
    inner = `<div class="modal-body">${payStepsBar()}
      <h4 style="margin-bottom:6px;">Payment</h4>
      <div class="summary-line total" style="border:none;margin:0;padding:6px 0 14px;"><span>Total</span><span>${money(b.total)}</span></div>
      ${STRIPE ? `
        <div id="payment-element" style="min-height:64px;"><div class="muted sm mono">Loading secure card form…</div></div>
        <div id="payMsg" class="pay-msg"></div>
        <div style="display:flex;gap:10px;margin-top:16px;">
          <button class="btn btn-ghost" id="payBack" onclick="payGoto(2)">Back</button>
          <button class="btn btn-primary" style="flex:1" id="payBtn" onclick="confirmPay()">Pay ${money(b.total)}</button></div>
        <p class="muted sm" style="margin-top:10px;text-align:center;">Secured by Stripe. Card details go straight to Stripe and are never stored on our servers.</p>
      ` : `
        <div class="pay-msg" style="color:var(--status-pending)">Card payment isn\u2019t available right now.${SUPPORT_PHONE?` Call us at ${esc(SUPPORT_PHONE)} and we\u2019ll take payment over the phone.`:` Message us from the Messages tab and we\u2019ll send a payment link.`}</div>
        <div style="margin-top:14px;"><button class="btn btn-ghost" onclick="payGoto(2)">Back</button></div>
      `}</div>`;
  } else if(payState.step==='done'){
    inner = `<div class="modal-body" style="text-align:center;padding:40px 24px;">
      <div style="width:60px;height:60px;border-radius:50%;background:rgba(16,185,129,.12);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#D4A574" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg></div>
      <h3 class="mono">Payment received</h3>
      <p class="muted mt">${money(b.total)} paid. Your receipt is in Receipts &amp; Docs.</p>
      <button class="btn btn-primary mt" onclick="afterPaid()">Done</button></div>`;
  }
  mount.innerHTML = `<div class="overlay" onclick="if(event.target===this)closePay()"><div class="modal" role="dialog" aria-modal="true" aria-label="Pay invoice">
    <div class="modal-head"><h3>Pay invoice</h3><button class="x" onclick="closePay()" aria-label="Close">&times;</button></div>${inner}</div></div>`;

  if(payState.step===3 && STRIPE && !payState.mounted){ mountStripe(); }
}

async function payGoto(step){
  if(step===3){
    payState.billing = {
      name:    (document.getElementById('bName')||{}).value  || (CLIENT&&CLIENT.name)  || '',
      email:   (document.getElementById('bEmail')||{}).value || (CLIENT&&CLIENT.email) || '',
      phone:   (document.getElementById('bPhone')||{}).value || '',
      address: (document.getElementById('bAddr')||{}).value  || '',
      city:    (document.getElementById('bCity')||{}).value  || '',
      zip:     (document.getElementById('bZip')||{}).value   || ''
    };
    try{
      const r = await fetch(API+`/api/portal/invoices/${payState.invoiceId}/payment-intent`,{method:'POST',headers:authHeaders(),body:'{}'});
      const d = await r.json();
      if(!d.success){ alert(d.message||'Payment couldn\u2019t be started.'); return; }
      payState.clientSecret = d.clientSecret;
      payState.breakdown = d.breakdown||payState.breakdown;
      payState.mounted = false;
      // Re-init Stripe from the key returned here in case the config load raced.
      const pk = d.publishableKey || STRIPE_PK_FALLBACK;
      if(!STRIPE && pk && window.Stripe){ STRIPE_PK = pk; STRIPE = Stripe(STRIPE_PK); }
    }catch(e){ alert('Payment couldn\u2019t be started.'); return; }
  }
  payState.step = step; renderPayModal();
}

function mountStripe(){
  if(!STRIPE || !payState.clientSecret) return;
  const bil = payState.billing || {};
  payState.elements = STRIPE.elements({
    clientSecret: payState.clientSecret,
    appearance:{ theme:'night', variables:{
      colorPrimary:'#D4A574', colorBackground:'#1a1a1a', colorText:'#ffffff',
      colorDanger:'#ef4444', borderRadius:'10px', fontFamily:'Outfit, system-ui, sans-serif'
    }}
  });
  const pe = payState.elements.create('payment', {
    layout: 'tabs',
    defaultValues: { billingDetails: {
      name: bil.name||'', email: bil.email||'', phone: bil.phone||'',
      address: { line1: bil.address||'', city: bil.city||'', postal_code: bil.zip||'', country: 'US' }
    }}
  });
  const el = document.getElementById('payment-element'); if(el) el.innerHTML='';
  pe.mount('#payment-element'); payState.mounted = true;
  pe.on('ready', ()=>{ payState.mounted = true; });
}

async function confirmPay(){
  const msg = document.getElementById('payMsg'); const btn = document.getElementById('payBtn');
  if(!STRIPE || !payState.elements){ if(msg) msg.textContent='Payments aren\u2019t available right now.'; return; }
  btn.disabled=true; btn.textContent='Processing…'; if(msg){ msg.style.color=''; msg.textContent=''; }
  // redirect:'if_required' keeps the customer in the modal — only 3-D Secure
  // and similar methods bounce out. Never Stripe Checkout.
  const { error, paymentIntent } = await STRIPE.confirmPayment({
    elements: payState.elements,
    confirmParams: { return_url: window.location.href },
    redirect: 'if_required'
  });
  if(error){
    if(msg){ msg.style.color='var(--status-danger)'; msg.textContent = error.message || 'The card was declined. Check the details and try again.'; }
    btn.disabled=false; btn.textContent='Pay '+money(payState.breakdown.total); return;
  }
  if(paymentIntent && (paymentIntent.status==='succeeded' || paymentIntent.status==='processing')){
    // Mark paid on our side immediately (server verifies against Stripe) so the
    // client portal and admin portal both update without waiting on the webhook.
    try{
      await fetch(API+`/api/portal/invoices/${payState.invoiceId}/confirm-paid`,{
        method:'POST', headers:authHeaders(), body: JSON.stringify({ payment_intent_id: paymentIntent.id })
      });
    }catch(_){}
    payState.step='done'; renderPayModal();
  } else {
    if(msg) msg.textContent='The payment didn\u2019t complete. Try again.';
    btn.disabled=false; btn.textContent='Pay '+money(payState.breakdown.total);
  }
}
async function afterPaid(){ closePay(); await loadDashboard(); nav('invoices'); }

/* ---------------- MESSAGES ---------------- */
function msgTime(d){
  if(!d) return '';
  const t=new Date(d), now=new Date(); if(isNaN(t)) return '';
  if(t.toDateString()===now.toDateString()) return t.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  const days=Math.round((now-t)/86400000);
  if(days===1) return 'Yesterday';
  if(days<7) return t.toLocaleDateString([], {weekday:'short'});
  return t.toLocaleDateString([], {month:'short',day:'numeric'});
}
async function loadMessages(){
  try{ const d = await (await fetch(API+'/api/portal/messages',{headers:authHeaders()})).json(); MESSAGES = d.messages||[]; }
  catch(e){ MESSAGES=[]; }
}
async function refreshMsgBadge(){
  try{
    const d = await (await fetch(API+'/api/portal/messages/unread-count',{headers:authHeaders()})).json();
    const n = d.count||0;
    ['msgNavBadge','msgMobileBadge'].forEach(id=>{
      const b=document.getElementById(id); if(!b) return;
      b.textContent=n; if(n>0) b.classList.remove('hidden'); else b.classList.add('hidden');
    });
  }catch(e){}
}
function viewMessages(){
  // The thread header represents US, not the customer. Crown's build showed the
  // customer's initials beside the shop name here, which read as their own avatar.
  let feed;
  if(!MESSAGES.length){
    feed = `<div class="msg-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <div class="hint">Start the thread — ask a question and we\u2019ll reply here.</div></div>`;
  } else {
    let lastDay='';
    feed = MESSAGES.map(m=>{
      const day = m.created_at ? new Date(m.created_at).toLocaleDateString([], {month:'long',day:'numeric'}) : '';
      let dayDiv=''; if(day && day!==lastDay){ dayDiv=`<div class="msg-day">${esc(day)}</div>`; lastDay=day; }
      const txt = esc(m.body).replace(/\n/g,'<br>');
      if(m.kind==='marketing'){
        return `${dayDiv}<div class="bub mkt"><span class="mk-tag">Offer from ${esc(COMPANY)}</span>${m.subject?`<div class="mk-sub">${esc(m.subject)}</div>`:''}<div>${txt}</div></div><div class="bub-meta them">${esc(msgTime(m.created_at))}</div>`;
      }
      const side = m.sender==='admin' ? 'them' : 'me';
      const who  = m.sender==='admin' ? COMPANY : 'You';
      return `${dayDiv}<div class="bub ${side}">${txt}</div><div class="bub-meta ${side}">${esc(who)} · ${esc(msgTime(m.created_at))}</div>`;
    }).join('');
  }
  document.getElementById('main').innerHTML = `
    <div class="page-title">Messages</div>
    <div class="page-sub">Talk directly to the team. Replies land in this thread.</div>
    <div class="msg-wrap">
      <div class="msg-head">
        <div class="logo-mark" style="width:40px;height:40px;border-radius:var(--radius-sm);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></div>
        <div><div class="n">${esc(COMPANY)}</div><div class="s">Typically replies within a day</div></div>
      </div>
      <div class="msg-feed" id="msgFeed">${feed}</div>
      <div class="msg-compose">
        <textarea id="msgInput" placeholder="Write a message…" rows="1" aria-label="Message"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px'"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendClientMessage();}"></textarea>
        <button class="msg-send" id="msgSendBtn" onclick="sendClientMessage()" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>`;
  const feedEl=document.getElementById('msgFeed'); if(feedEl) feedEl.scrollTop=feedEl.scrollHeight;
  refreshMsgBadge();
}
async function sendClientMessage(){
  const inp=document.getElementById('msgInput'); const txt=(inp?.value||'').trim(); if(!txt) return;
  const btn=document.getElementById('msgSendBtn'); if(btn) btn.disabled=true;
  try{
    const r = await fetch(API+'/api/portal/messages',{method:'POST',headers:authHeaders(),body:JSON.stringify({body:txt})});
    const d = await r.json();
    if(r.ok && d.success){
      MESSAGES.push(d.message);
      const feed=document.getElementById('msgFeed');
      if(feed){
        if(feed.querySelector('.msg-empty')) feed.innerHTML='';
        feed.insertAdjacentHTML('beforeend',
          `<div class="bub me">${esc(txt).replace(/\n/g,'<br>')}</div><div class="bub-meta me">You · just now</div>`);
        feed.scrollTop=feed.scrollHeight;
      }
      if(inp){ inp.value=''; inp.style.height='auto'; }
    } else { alert(d.message||'That message didn\u2019t send. Try again.'); }
  }catch(e){ alert('Can\u2019t reach the server. Try again in a moment.'); }
  finally{ if(btn) btn.disabled=false; }
}

/* ---------------- INIT ---------------- */
if(TOKEN && CLIENT){ startApp(); }
</script>
