    '',
    'ON SUCCESS',
    '  200 with { ok: true, contact_id }.',
    t.forms.autoEnrol
      ? '  The lead is created and the follow-up cadence starts immediately.'
      : '  The lead is created. Follow-up does not start automatically.'
  ].join('\n');
  modal('Form setup for ' + esc(t.name),
    `<p style="margin:0 0 14px;font-size:13.5px;line-height:1.6">Hand this to whoever builds the website. It is plain form posting — no JavaScript library, no API key on the page.</p>
     <pre class="snippet">${esc(parts)}</pre>`,
    `<div class="sp"><button class="btn-o" data-mclose>Close</button>
      <button class="btn-dark" data-copy="${esc(formEndpoint(t))}">${I('file', 15)}Copy the endpoint</button></div>`, 'wide');
}


/* ============================================================
   Client portals — Reserve Legacy sees every customer of every
   studio, without ever emailing them directly
   ============================================================ */
const pStatusCls = s => s === 'Active' ? 'p-booked' : s === 'Invited' ? 'p-warn' : 'p-lost';

function adminPortals(box) {
  const s = platformStats();
  const rows = TENANTS.filter(t => t.status !== 'Terminated')
    .map(t => ({ t, n: t.clients.length,
      active: t.clients.filter(c => c.status === 'Active').length,
      invited: t.clients.filter(c => c.status === 'Invited').length,
      susp: t.clients.filter(c => c.status === 'Suspended').length,
      owed: t.clients.reduce((x, c) => x + c.balance, 0),
      stale: t.clients.filter(c => c.status === 'Invited' && now() - c.createdAt > 30 * DAY).length }))
    .sort((a, b) => b.n - a.n);
  box.innerHTML = `
  <p class="lede">Every customer of every studio on the platform. Reserve Legacy can see and fix access here,
  but invitations and resets always send from the studio's own address — a client never hears from us directly.</p>
  ${clockBar()}
  <div class="stats">
    ${st('Client portals', s.portals.toLocaleString('en-US'), 'across ' + rows.length + ' studios')}
    ${st('Active', s.portalsActive, 'signed in and using it')}
    ${st('Never signed in', s.portalsInvited, 'still on temporary credentials')}
    ${st('Suspended', s.portalsSuspended, 'access blocked by the studio')}
    ${st('Owed by clients', money(s.clientOwed), 'across every studio')}
  </div>
  ${rows.reduce((n, r) => n + r.stale, 0) ? `<div class="warnbox">${I('warn', 18)}
    <p><b>${rows.reduce((n, r) => n + r.stale, 0)} clients were invited over a month ago and have never signed in.</b>
    Usually the invitation went to spam, or the studio has the wrong address on file.</p></div>` : ''}
  <div class="tbl-wrap"><table class="tbl">
    <colgroup><col style="width:24%"><col style="width:11%"><col style="width:11%"><col style="width:12%">
      <col style="width:11%"><col style="width:13%"><col style="width:18%"></colgroup>
    <thead><tr><th>Studio</th><th>Portals</th><th>Active</th><th>Never signed in</th>
      <th>Suspended</th><th>Owed by clients</th><th>Portal domain</th></tr></thead>
    <tbody>${rows.map(r => `<tr data-tenant="${r.t.id}">
      <td><div class="cell-b"><span class="logo-sq" style="background:${avc(r.t.name)}">${initials(r.t.name)}</span>
        <b>${esc(r.t.name)}</b></div></td>
      <td style="font-weight:600">${r.n}</td>
      <td style="color:var(--body)">${r.active}</td>
      <td>${r.invited ? `<span class="pill ${r.stale ? 'p-lost' : 'p-warn'}">${r.invited}${r.stale ? ' · ' + r.stale + ' stale' : ''}</span>` : '<span style="color:var(--faint)">—</span>'}</td>
      <td style="color:var(--body)">${r.susp || '—'}</td>
      <td style="color:var(--body)">${r.owed ? money(r.owed) : '—'}</td>
      <td style="color:var(--muted);font-size:12px">portal.${esc(r.t.email.domain)}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

function adminTenantPortals(t) {
  const cs = t.clients;
  const n = s => cs.filter(c => c.status === s).length;
  return `
  <p class="lede">${esc(t.name)}'s own customers. Each of these people signs in at
  <b>portal.${esc(t.email.domain)}</b>, sees ${esc(t.name)}'s branding, and gets email from
  <b>${esc(t.email.sender)}</b> — never from Reserve Legacy.</p>
  <div class="stats">
    ${st('Client portals', cs.length, 'created automatically on conversion')}
    ${st('Active', n('Active'), 'password set')}
    ${st('Never signed in', n('Invited'), 'temporary credentials still valid')}
    ${st('Suspended', n('Suspended'), 'blocked by the studio')}
    ${st('Owed by clients', money(cs.reduce((s2, c) => s2 + c.balance, 0)), 'unpaid invoices')}
  </div>
  <div class="tbl-wrap"><table class="tbl">
    <colgroup><col style="width:19%"><col style="width:20%"><col style="width:11%"><col style="width:11%">
      <col style="width:12%"><col style="width:11%"><col style="width:16%"></colgroup>
    <thead><tr><th>Client</th><th>Portal address</th><th>Status</th><th>Agreement</th>
      <th>Last sign-in</th><th>Owed</th><th></th></tr></thead>
    <tbody>${cs.map(c => `<tr>
      <td><div class="cell-b"><span class="logo-sq" style="background:${avc(c.name)}">${initials(c.name)}</span>
        <b>${esc(c.name)}</b></div></td>
      <td style="color:var(--muted);font-size:12px">${esc(c.url)}</td>
      <td><span class="pill ${pStatusCls(c.status)}">${c.status}</span></td>
      <td>${c.agreementSigned ? '<span class="pill p-booked">Signed</span>' : '<span class="pill p-warn">Waiting</span>'}</td>
      <td style="color:var(--body)">${c.lastLogin ? fmtD(c.lastLogin) : 'Never'}</td>
      <td>${c.balance ? `<span class="pill p-warn">${money(c.balance)}</span>` : '<span style="color:var(--faint)">—</span>'}</td>
      <td class="rowact">
        <button class="mini" data-cportal="${t.id}|${c.id}" title="Manage">${I('cog', 14)}</button>
      </td></tr>`).join('')}</tbody></table></div>
  <p class="hint" style="margin-top:12px">Reserve Legacy can restore access or force a password reset when a studio
  cannot — support cases, a locked-out client, a studio that has gone quiet. Every action lands in the audit log.</p>`;
}

function openClientPortal(key) {
  const [tid, cid] = key.split('|');
  const t = TENANTS.find(x => x.id === tid);
  const c = t.clients.find(x => x.id === cid);
  modal(`${esc(c.name)} — ${esc(t.name)}`, `
    <dl class="kv">
      <dt>Studio</dt><dd>${esc(t.name)} · ${esc(t.id)}</dd>
      <dt>Portal</dt><dd style="word-break:break-all;font-size:12px">${esc(c.url)}</dd>
      <dt>Username</dt><dd>${esc(c.username)}</dd>
      <dt>Status</dt><dd><span class="pill ${pStatusCls(c.status)}">${c.status}</span></dd>
      <dt>Password</dt><dd>${c.passwordSet ? 'Set by the client' : 'Still on temporary credentials'}</dd>
      <dt>Session</dt><dd>${esc(c.session)}</dd>
      <dt>Agreement</dt><dd>${c.agreementSigned ? 'Signed' : 'Waiting for signature'}</dd>
      <dt>Last sign-in</dt><dd>${c.lastLogin ? fmtDT(c.lastLogin) + ' · ' + c.logins + ' visits' : 'Never'}</dd>
      <dt>Owed</dt><dd>${c.balance ? money(c.balance) + ' — gallery locked' : 'Nothing outstanding'}</dd>
      <dt>Email comes from</dt><dd>${esc(t.email.sender)}</dd>
    </dl>
    <p class="hint" style="margin-top:14px">Anything you do here is on the studio's behalf. The client sees
    ${esc(t.name)}'s name on every screen and every email, with a small “powered by Reserve Legacy” line on sign-in.</p>`,
    `<div class="sp">
      <button class="btn-o" data-cpreset="${key}">${I('lock', 15)}Force password reset</button>
      ${c.status === 'Suspended'
      ? `<button class="btn-dark" data-cpstatus="${key}|Active">${I('check', 15)}Restore access</button>`
      : `<button class="btn-o" data-cpstatus="${key}|Suspended">${I('lock', 15)}Suspend access</button>`}
      <button class="btn-dark" data-mclose>Close</button>
    </div>`, 'wide');
}


/* ====================================================================
   adminboot.js
   ==================================================================== */

/* ---------- Reserve Legacy admin — boot ---------- */
const ADMIN = { view: 'overview', tenantId: null, tab: 'Overview' };
seedTenants(now());
audit('platform.start', 'Admin console initialised', 'ops@reservelegacy.com');
renderAdminLogin();
</script>
