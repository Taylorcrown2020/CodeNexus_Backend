/* ============================================================
   Auth — email + password, emailed verification code, trusted
   devices, session expiry and an immutable audit trail.
   These are the SOC 2 CC6 (access) and CC7 (monitoring)
   controls made visible; the real enforcement is server side.
   ============================================================ */

const AUTH = {
  stage: 'password',        // password → code → done
  email: '',
  pending: null,            // { code, sentAt, attempts, expiresAt, user }
  session: null,            // { userId, startedAt, expiresAt, remember }
  trusted: [],              // remembered devices
  inbox: [],                // simulated inbox so the code is visible
  lockedUntil: 0,
  failures: 0
};

const REMEMBER_OPTIONS = [
  { k: 'none', l: 'Just this once', ms: 0 },
  { k: '1d', l: '1 day', ms: DAY },
  { k: '7d', l: '7 days', ms: 7 * DAY },
  { k: '30d', l: '30 days', ms: 30 * DAY }
];
const SESSION_IDLE = 30 * 60e3;   // 30 minutes idle timeout
const CODE_TTL = 10 * 60e3;       // code expires in 10 minutes
const MAX_ATTEMPTS = 5;

const genCode = () => String(100000 + Math.floor(Math.random() * 900000));

function startLogin(email, password) {
  if (now() < AUTH.lockedUntil)
    return { ok: false, why: `Too many attempts. Locked for ${Math.ceil((AUTH.lockedUntil - now()) / 60e3)} more minutes.` };
  const user = TEAM.find(u => u.email.toLowerCase() === String(email).toLowerCase());
  if (!user || !password || password.length < 8) {
    AUTH.failures++;
    audit('auth.login.failed', `Failed sign-in for ${email}`, email, 'warn');
    if (AUTH.failures >= MAX_ATTEMPTS) {
      AUTH.lockedUntil = now() + 15 * 60e3;
      audit('auth.lockout', `Account locked after ${MAX_ATTEMPTS} failed attempts`, email, 'critical');
      return { ok: false, why: 'Too many failed attempts. Locked for 15 minutes.' };
    }
    return { ok: false, why: 'That email and password do not match an account.' };
  }
  AUTH.failures = 0;
  AUTH.email = user.email;

  const trusted = AUTH.trusted.find(t => t.userId === user.id && t.expiresAt > now());
  if (trusted) {
    audit('auth.login.trusted', `Signed in on a trusted device, second factor skipped`, user.email);
    return finishLogin(user, 'trusted');
  }
  const code = genCode();
  AUTH.pending = { code, sentAt: now(), attempts: 0, expiresAt: now() + CODE_TTL, user };
  AUTH.stage = 'code';
  AUTH.inbox.unshift({
    at: now(), to: user.email, subject: `${code} is your Reserve Legacy sign-in code`,
    body: `Your verification code is ${code}. It expires in 10 minutes. If this was not you, change your password and tell your studio owner — this attempt came from 198.51.100.42, Chrome on macOS.`
  });
  audit('auth.mfa.sent', 'Verification code emailed', user.email);
  return { ok: true, stage: 'code' };
}

function verifyCode(input, rememberKey) {
  const p = AUTH.pending;
  if (!p) return { ok: false, why: 'Start again — no code is pending.' };
  if (now() > p.expiresAt) {
    audit('auth.mfa.expired', 'Verification code expired', p.user.email, 'warn');
    return { ok: false, why: 'That code expired. Send a new one.' };
  }
  p.attempts++;
  if (String(input).trim() !== p.code) {
    audit('auth.mfa.failed', `Wrong verification code (attempt ${p.attempts})`, p.user.email, 'warn');
    if (p.attempts >= MAX_ATTEMPTS) { AUTH.pending = null; AUTH.stage = 'password'; return { ok: false, why: 'Too many wrong codes. Start again.' }; }
    return { ok: false, why: `That code is not right. ${MAX_ATTEMPTS - p.attempts} attempts left.` };
  }
  const opt = REMEMBER_OPTIONS.find(o => o.k === rememberKey) || REMEMBER_OPTIONS[0];
  if (opt.ms > 0) {
    AUTH.trusted = AUTH.trusted.filter(t => t.userId !== p.user.id);
    AUTH.trusted.push({ userId: p.user.id, label: 'Chrome · macOS', expiresAt: now() + opt.ms, addedAt: now(), duration: opt.l });
    audit('auth.device.trusted', `Device remembered for ${opt.l}`, p.user.email);
  }
  return finishLogin(p.user, 'mfa', opt);
}

function finishLogin(user, method, opt) {
  AUTH.session = { userId: user.id, startedAt: now(), lastSeen: now(), expiresAt: now() + SESSION_IDLE, method, remember: opt ? opt.l : 'not remembered' };
  AUTH.pending = null; AUTH.stage = 'done';
  ACCOUNT.previousLogin = ACCOUNT.lastSeenAt || ACCOUNT.lastLogin;
  audit('auth.login.success', `Signed in (${method === 'trusted' ? 'trusted device' : 'password + emailed code'})`, user.email);
  return { ok: true, stage: 'done', user };
}
function resendCode() {
  if (!AUTH.pending) return;
  const code = genCode();
  AUTH.pending.code = code; AUTH.pending.expiresAt = now() + CODE_TTL; AUTH.pending.attempts = 0;
  AUTH.inbox.unshift({ at: now(), to: AUTH.pending.user.email, subject: `${code} is your Reserve Legacy sign-in code`, body: `Your new verification code is ${code}.` });
  audit('auth.mfa.resent', 'New verification code emailed', AUTH.pending.user.email);
}
function signOut() {
  if (AUTH.session) audit('auth.logout', 'Signed out', userById(AUTH.session.userId).email);
  AUTH.session = null; AUTH.stage = 'password'; AUTH.pending = null;
}
function forgetDevices() {
  AUTH.trusted = [];
  audit('auth.device.revoked', 'All remembered devices revoked', null, 'warn');
}
const sessionUser = () => AUTH.session ? userById(AUTH.session.userId) : null;

   - A package is a sellable shoot type with a preset invoice.

/* ---------- identity resolution ----------
   One rule, used by every inbound path: match on email first,
   then phone. Never create a second record for someone you have. */
const normEmail = e => String(e || '').trim().toLowerCase();
const normPhone = p => String(p || '').replace(/\D/g, '').slice(-10);

function findContact({ email, phone }) {
  const e = normEmail(email), p = normPhone(phone);
  if (e) { const hit = CONTACTS.find(c => normEmail(c.email) === e); if (hit) return hit; }
  if (p && p.length === 10) { const hit = CONTACTS.find(c => normPhone(c.phone) === p); if (hit) return hit; }
  return null;
}

/* ---------- lead → customer ---------- */
function convertToCustomer(contactId, why = 'Converted by hand') {
  const c = byId(contactId); if (!c) return null;
  if (CLIENT_STAGES.includes(c.stage)) return c;
  const from = c.stage;
  c.stage = 'Booked';
  c.convertedAt = now();
  c.activity.unshift({ at: now(), kind: 'won', text: `Became a customer — ${why} (was ${from})` });
  logEvent('convert', `${c.name} converted from ${from.toLowerCase()} to customer — ${why}`, c.id);
  /* the chasing sequence stops; they are not a lead any more */
  unenrol(c.id, 'Became a customer');
  return c;
}
function revertToLead(contactId) {
  const c = byId(contactId); if (!c) return;
  c.stage = 'In conversation';
  c.activity.unshift({ at: now(), kind: 'stage', text: 'Moved back to a lead' });
  enrol(c.id, 'Moved back to a lead');
}

function packagePrice(pk) {
  const lines = pk.lineItems.reduce((s, l) => s + l.qty * l.rate, 0);
  const fees = pk.additionalFees.reduce((s, f) => s + Number(f.amount || 0), 0);
  const sub = lines + fees;
  const tax = pk.taxExempt ? 0 : sub * BILLING.taxRate;
  const proc = (sub + tax) * BILLING.processingPct;
  return { sub, tax, proc, total: sub + tax + proc };
}

/* assigning a package does the whole job in one action */
function assignPackage(contactId, packageId, opts = {}) {
  const c = byId(contactId), pk = packageById(packageId);
  if (!c || !pk) return null;

  convertToCustomer(c.id, `booked ${pk.name}`);
  c.session = pk.session;
  c.value = packagePrice(pk).sub;
  if (opts.date) c.shootDate = opts.date;

  const s = shootFor(c.id);
  Object.assign(s, {
    date: c.shootDate, hours: pk.hours, packageId: pk.id,
    next: 'Send the contract', callTime: s.callTime || '2:00 PM'
  });

  const deposit = pk.depositPct > 0 && pk.depositPct < 100;
  const factor = deposit ? pk.depositPct / 100 : 1;
  const inv = newInvoice(c.id, {
    kind: deposit ? 'Retainer' : 'Balance',
    termDays: pk.termDays,
    lineItems: pk.lineItems.filter(l => l.rate > 0).map(l => ({
      desc: deposit ? `${l.desc} — ${pk.depositPct}% retainer` : l.desc,
      qty: l.qty, rate: Math.round(l.rate * factor)
    })),
    additionalFees: deposit ? [] : pk.additionalFees.map(f => ({ ...f })),
    taxExempt: pk.taxExempt,
    notes: `${pk.name}. ${pk.blurb}${deposit ? ` The remaining balance is due before the shoot.` : ''}`
  });

  /* create the balance invoice up front as a draft so nothing is forgotten */
  if (deposit) {
    const bal = newInvoice(c.id, {
      kind: 'Balance', draft: true, termDays: pk.termDays,
      lineItems: pk.lineItems.filter(l => l.rate > 0).map(l => ({
        desc: `${l.desc} — balance`, qty: l.qty, rate: l.rate - Math.round(l.rate * factor)
      })),
      additionalFees: pk.additionalFees.map(f => ({ ...f })),
      taxExempt: pk.taxExempt, notes: `Balance for ${pk.name}, due before the shoot.`
    });
    bal.dueAt = c.shootDate - 14 * DAY;
  }

  /* the gallery clock starts from the package's turnaround */
  if (!GALLERIES.some(g => g.contactId === c.id)) {
    GALLERIES.push({
      id: 'g' + (GALLERIES.length + 1), contactId: c.id,
      name: `${c.name.split(' ')[1] || c.name} — ${pk.session}`,
      photos: 0, views: 0, favs: 0, status: 'Awaiting the shoot', ordered: 0,
      shotAt: c.shootDate, dueAt: c.shootDate + pk.turnaroundDays * DAY
    });
  }

  createPortalAccount(c.id);
  const signed = signedAgreement(c.id);
  if (!signed) {
    issueAgreement(c.id, pk.id);
    inv.heldForSignature = true;
    inv.packageId = pk.id;
    logEvent('agreement', `${inv.id} is held until ${c.name} signs the service agreement`, c.id);
  } else if (pk.autoSend !== false) {
    emailInvoice(inv, pk);
  }
  logEvent('package', `${pk.name} assigned to ${c.name} — ${inv.id} raised${inv.heldForSignature ? ', held for signature' : pk.autoSend !== false ? ' and emailed' : ''}`, c.id);
  return { contact: c, invoice: inv, pkg: pk };
}

function issueAgreement(contactId, packageId, opts = {}) {

function signAgreement(agreementId, typedName) {

  const c = byId(a.contactId);
  c.activity.unshift({ at: now(), kind: 'agreement', text: `${a.id} signed by ${typedName}` });
  logEvent('agreement', `${c.name} signed ${a.id}`, c.id);

  /* anything held back waiting on the signature now goes out */
  INVOICES.filter(i => i.contactId === c.id && i.heldForSignature).forEach(inv => {
    inv.heldForSignature = false;
    if (!inv.draft) emailInvoice(inv, inv.packageId ? packageById(inv.packageId) : null);
  });
  return a;
}

/* ---------- portal accounts ---------- */
let PORTAL_ACCOUNTS = [];
function portalFor(contactId) { return PORTAL_ACCOUNTS.find(p => p.contactId === contactId); }

function createPortalAccount(contactId) {
  const c = byId(contactId); if (!c) return null;
  let p = portalFor(contactId);
  if (p) return p;
  const base = c.name.toLowerCase().replace(/[^a-z]+/g, '.').replace(/^\.|\.$/g, '');
  let username = base, n = 1;
  while (PORTAL_ACCOUNTS.some(x => x.username === username)) username = base + (++n);
  p = {
    contactId, username,
    email: c.email, phone: c.phone, name: c.name,
    tempPassword: makeTempPassword(),
    passwordSet: false,
    status: 'Invited',
    createdAt: now(), invitedAt: now(), lastLogin: null, loginCount: 0,
    url: 'https://' + ACCOUNT.portalDomain + '/' + username,
    history: []
  };
  PORTAL_ACCOUNTS.push(p);
  p.history.push({ at: now(), text: 'Portal created and invitation sent' });
  c.activity.unshift({ at: now(), kind: 'portal', text: 'Client portal created and invite sent' });
  logEvent('portal', `Client portal created for ${c.name}`, c.id);

  sendPortalInvite(p);
  return p;
}

function makeTempPassword() {
  const words = ['amber', 'cedar', 'harbor', 'willow', 'copper', 'lantern', 'meadow', 'quartz', 'ember', 'rowan'];
  const w = words[Math.floor(Math.random() * words.length)];
  return w + '-' + Math.floor(1000 + Math.random() * 9000);
}

/* the invitation always sends from the STUDIO, never from Reserve Legacy */
function sendPortalInvite(p, reason) {
  const c = byId(p.contactId); if (!c) return;
  OUTBOX.unshift({
    id: 'm' + (OUTBOX.length + 1), contactId: c.id, channel: 'Email', dir: 'out',
    subject: `Your ${ACCOUNT.studio} client portal`,
    body: `Hi ${c.name.split(' ')[0]}, ${reason === 'reset' ? 'here are fresh sign-in details for your portal.' : 'your client portal is ready.'} `
      + `Everything lives there — your agreement to sign, your invoices and payments, and your photographs when they are ready.\n\n`
      + `Sign in at ${p.url}\n`
      + `Username: ${p.username}\n`
      + `Temporary password: ${p.tempPassword}\n\n`
      + `You will be asked to choose your own password the first time you sign in. This temporary one stops working after that. `
      + `Any trouble at all, just reply to this email. — ${ACCOUNT.studio}`,
    at: now(), from: ACCOUNT.sendingEmail, label: reason === 'reset' ? 'Portal password reset' : 'Portal invite', track: 'portal'
  });
  p.invitedAt = now();
  p.history.push({ at: now(), text: reason === 'reset' ? 'Password reset and new credentials emailed' : 'Invitation emailed' });
  c.activity.unshift({ at: now(), kind: 'portal', text: reason === 'reset' ? 'Portal password reset and emailed' : 'Portal invitation emailed' });
  logEvent('portal', `${reason === 'reset' ? 'New credentials' : 'Portal invite'} emailed to ${c.name} from ${ACCOUNT.sendingEmail}`, c.id);
}

function resetPortalPassword(contactId) {
  const p = portalFor(contactId); if (!p) return;
  p.tempPassword = makeTempPassword();
  p.passwordSet = false;
  p.status = p.status === 'Suspended' ? 'Suspended' : 'Invited';
  sendPortalInvite(p, 'reset');
  return p;
}
function setPortalStatus(contactId, status) {
  const p = portalFor(contactId), c = byId(contactId); if (!p) return;
  p.status = status;
  p.history.push({ at: now(), text: 'Portal ' + status.toLowerCase() });
  c.activity.unshift({ at: now(), kind: 'portal', text: `Portal access ${status.toLowerCase()}` });
  logEvent('portal', `${c.name} — portal ${status.toLowerCase()}`, c.id);
  audit('portal.status', `${c.name}: portal ${status.toLowerCase()}`, meUser().email, status === 'Suspended' ? 'warn' : 'info');
}
const portalStatusCls = s => s === 'Active' ? 'p-booked' : s === 'Invited' ? 'p-warn' : 'p-lost';

/* changes made in the CRM push out to the portal record, so the client
   sees their own corrected name, email and phone next time they sign in */
function syncPortalFromCrm(contactId) {
  const p = portalFor(contactId), c = byId(contactId);
  if (!p || !c) return;
  const changed = [];
  if (p.name !== c.name) { changed.push('name'); p.name = c.name; }
  if (p.email !== c.email) { changed.push('email'); p.email = c.email; }
  if (p.phone !== c.phone) { changed.push('phone'); p.phone = c.phone; }
  if (changed.length) {
    p.history.push({ at: now(), text: 'Updated from the CRM: ' + changed.join(', ') });
    logEvent('portal', `${c.name} — portal ${changed.join(', ')} updated from the CRM`, c.id);
  }
  return changed;
}
function syncAllPortals() { PORTAL_ACCOUNTS.forEach(p => syncPortalFromCrm(p.contactId)); }

/* changes made by the client in the portal write straight back to the CRM */
function updatePortalProfile(contactId, patch) {
  const p = portalFor(contactId), c = byId(contactId);
  if (!p || !c) return;
  if (patch.name) { p.name = patch.name; c.name = patch.name; }
  if (patch.email) { p.email = patch.email; c.email = patch.email; }
  if (patch.phone) { p.phone = patch.phone; c.phone = patch.phone; }
  if (patch.username) p.username = patch.username;
  if (patch.password) { p.password = patch.password; p.activated = true; }
  c.activity.unshift({ at: now(), kind: 'portal', text: 'Client updated their details in the portal' });
  logEvent('portal', `${c.name} updated their portal profile`, c.id);
}

/* ---------- galleries: photos, locking, watermarks ---------- */
const SWATCHES = [
  ['#c8b6a6', '#8d7b68'], ['#9db2bf', '#526d82'], ['#b9b4c7', '#5c5470'],
  ['#c7d2c0', '#728156'], ['#e0c9b1', '#a67b5b'], ['#adb5bd', '#6c757d'],
  ['#d4a5a5', '#9c6f6f'], ['#a8bfa0', '#5f7a61']
];
function makePlaceholderPhotos(n, seed) {
  return Array.from({ length: n }, (_, i) => {
    const [a, b] = SWATCHES[(hash(seed + i) % SWATCHES.length)];
    return { id: 'ph' + seed + '-' + i, a, b, rot: (hash(seed + 'r' + i) % 7) - 3 };
  });
}
function galleryPhotos(g) {
  if (!g.items) g.items = makePlaceholderPhotos(Math.min(12, Math.max(6, Math.round(g.photos / 40))), g.id);
  return g.items;
}
/* a gallery unlocks when the invoice covering that work is settled */
function galleryInvoice(g) {
  const own = INVOICES.find(i => i.id === g.invoiceId && !i.void);
  if (own) return own;
  const theirs = INVOICES.filter(i => i.contactId === g.contactId && !i.void && !i.draft)
    .sort((a, b) => b.issuedAt - a.issuedAt);
  return theirs[0] || null;
}
function galleryUnlocked(g) {
  const inv = galleryInvoice(g);
  if (!inv) return false;
  const bal = INVOICES.filter(i => i.contactId === g.contactId && !i.void && !i.draft)
    .reduce((s, i) => s + invoiceTotals(i).balance, 0);
  return bal <= 0.01;
}

/* ---------- deleting ---------- */
function deleteContact(contactId) {
  const c = byId(contactId); if (!c) return;
  const name = c.name;
  CONTACTS = CONTACTS.filter(x => x.id !== contactId);
  INVOICES = INVOICES.filter(i => i.contactId !== contactId);
  GALLERIES = GALLERIES.filter(g => g.contactId !== contactId);
  SHOOTS = SHOOTS.filter(s => s.contactId !== contactId);
  ENROLMENTS = ENROLMENTS.filter(e => e.contactId !== contactId);
  AGREEMENTS = AGREEMENTS.filter(a => a.contactId !== contactId);
  PORTAL_ACCOUNTS = PORTAL_ACCOUNTS.filter(p => p.contactId !== contactId);
  OUTBOX = OUTBOX.filter(m => m.contactId !== contactId);
  HOLDS = HOLDS.filter(h => h.contactId !== contactId);
  logEvent('delete', `${name} deleted, along with their invoices, galleries and messages`, null);
  audit('crm.contact.deleted', `${name} and all related records deleted`, meUser().email, 'warn');
}

        <div><label class="login-l">Postcode</label><input class="inp" id="pcZip" placeholder="75206" maxlength="10"></div>

      <button class="btn-dark" data-dopay="${inv.id}">${I('lock', 15)}Pay ${money(t.balance)}</button></div>`);

  num.oninput = () => { num.value = num.value.replace(/\D/g, '').slice(0, 16).replace(/(.{4})/g, '$1 ').trim(); };
  const exp = document.getElementById('pcExp');

    let v = exp.value.replace(/\D/g, '').slice(0, 4);
    exp.value = v.length > 2 ? v.slice(0, 2) + ' / ' + v.slice(2) : v;
  };

function takePayment(invoiceId) {
  const num = document.getElementById('pcNum').value.replace(/\s/g, '');
  const exp = document.getElementById('pcExp').value.replace(/\D/g, '');
  const cvc = document.getElementById('pcCvc').value;
  const err = document.getElementById('pcErr');
  if (num.length < 15) { err.textContent = 'That card number is not complete.'; return; }
  if (exp.length < 4) { err.textContent = 'Add the expiry date.'; return; }
  if (cvc.length < 3) { err.textContent = 'Add the security code.'; return; }
  const inv = INVOICES.find(i => i.id === invoiceId);
  const t = invoiceTotals(inv);
  recordPayment(inv, t.balance, 'Card ···· ' + num.slice(-4));
  closeModal();
  const g = GALLERIES.find(x => x.contactId === inv.contactId);
  const unlocked = g && galleryUnlocked(g);

}

/* ---------- seed: existing customers already have portals ---------- */
function seedPortals() {
  CONTACTS.filter(c => CLIENT_STAGES.includes(c.stage)).forEach((c, i) => {
    const p = createPortalAccount(c.id);
    p.lastLogin = now() - (1 + (i % 9)) * DAY;
    p.passwordSet = i % 4 !== 0;
    p.status = i % 7 === 0 ? 'Suspended' : (p.passwordSet ? 'Active' : 'Invited');
    p.loginCount = p.passwordSet ? 2 + (i % 9) : 0;
    const a = issueAgreement(c.id);
    /* most are signed; leave a couple outstanding so the gate is visible */
    if (i % 5 !== 0) {
      a.status = 'Signed';
      a.signedAt = c.createdAt + 2 * DAY;
      a.signerName = c.name;
      a.signerIp = '198.51.100.' + (20 + (hash(c.name) % 60));

  /* point each gallery at the invoice that unlocks it */
  GALLERIES.forEach(g => {
    const inv = INVOICES.filter(i => i.contactId === g.contactId && !i.void && !i.draft)
      .sort((a, b) => b.issuedAt - a.issuedAt)[0];
    if (inv) g.invoiceId = inv.id;
  });
}

   Simulated clock so every automation can be watched running.

/* enrolment: one per contact, per the cadence in data.js */
let ENROLMENTS = [];
let OUTBOX = [];        // everything the system has sent
let EVENTS = [];        // account activity feed, drives the daily report

function logEvent(kind, text, contactId) {
  EVENTS.unshift({ at: now(), kind, text, contactId });
  if (EVENTS.length > 400) EVENTS.pop();
}

/* ---------- enrolling ---------- */
function enrol(contactId, reason = 'New enquiry') {
  const c = byId(contactId);
  if (!c || c.optedOut) return null;
  if (!has('instantReply')) return null;
  let e = ENROLMENTS.find(x => x.contactId === contactId);
  if (e) return e;
  e = {
    id: 'e' + contactId, contactId, step: 1, round: 1,
    status: 'active', nextAt: now(), lastSentAt: null, sentCount: 0,
    startedAt: now(), reason, history: []
  };
  ENROLMENTS.push(e);
  logEvent('enrol', `${c.name} entered follow-up — ${reason}`, contactId);
  return e;
}
function unenrol(contactId, why = 'Opted out') {
  const e = ENROLMENTS.find(x => x.contactId === contactId);
  if (!e) return;
  e.status = why === 'Opted out' ? 'opted-out' : 'stopped';
  e.nextAt = null;
  logEvent('stop', `${byId(contactId).name} — follow-up stopped (${why.toLowerCase()})`, contactId);
}
function optOut(contactId) {
  const c = byId(contactId); if (!c) return;
  c.optedOut = true;
  unenrol(contactId, 'Opted out');
  c.activity.unshift({ at: now(), kind: 'stop', text: 'Opted out of all automated messages' });
}

/* ---------- message building ---------- */
function ctx(c) {
  return {
    first: c.name.split(' ')[0], name: c.name, session: c.session,
    shootDate: c.shootDate, venue: c.venueId ? venueById(c.venueId).name : null
  };
}
function copyFor(c, round, step, channel) {
  const bank = COPY[Math.min(round, 3)][channel];
  const fn = bank[Math.min(step, bank.length) - 1] || bank[bank.length - 1];
  const out = fn(ctx(c));
  return channel === 'Email' ? { subject: out[0], body: out[1] } : { body: out };
}

/* ---------- sending ---------- */
function send(contactId, channel, msg, meta = {}) {
  const c = byId(contactId);
  if (!c || c.optedOut) return null;
  const m = {
    id: 'm' + (OUTBOX.length + 1), contactId, channel, dir: 'out',
    subject: msg.subject || null, body: msg.body, at: now(),
    from: channel === 'SMS' ? ACCOUNT.sendingNumber : ACCOUNT.sendingEmail,
    ...meta
  };
  OUTBOX.unshift(m);
  c.activity.unshift({ at: now(), kind: 'sent', text: `${channel} sent — ${meta.label || 'follow-up'}` });
  return m;
}

/* ---------- the cadence tick ---------- */
function runFollowUp() {
  ENROLMENTS.forEach(e => {
    const c = byId(e.contactId);
    if (!c || c.optedOut) return;

    if (e.status === 'paused' && e.resumeAt != null && now() >= e.resumeAt) {
      e.status = 'active'; e.round += 1; e.step = 1; e.nextAt = e.resumeAt; e.resumeAt = null;
      logEvent('reset', `${c.name} — 48-hour pause over, restarting at step 1 with round ${e.round} wording`, c.id);
    }
    if (e.status !== 'active' || e.nextAt == null || now() < e.nextAt) return;

    const stepDef = CADENCE[Math.min(e.step, CADENCE.length) - 1];
    const chans = stepDef.channels.filter(ch => ch !== 'SMS' || has('textFollowUp'));
    if (!chans.length) { e.step += 1; e.nextAt = now() + CADENCE[Math.min(e.step, CADENCE.length) - 1].wait; return; }
    chans.forEach(ch => {
      const msg = copyFor(c, e.round, e.step, ch);
      send(c.id, ch, msg, { label: `Step ${e.step} · round ${e.round}`, auto: true });
    });
    e.history.push({ at: now(), step: e.step, round: e.round, channels: chans });
    e.lastSentAt = now(); e.sentCount += chans.length;
    logEvent('send', `${c.name} — step ${e.step} sent by ${chans.join(' + ')}`, c.id);

    if (stepDef.repeat) {
      e.nextAt = now() + stepDef.wait;
    } else {
      e.step += 1;
      e.nextAt = now() + CADENCE[Math.min(e.step, CADENCE.length) - 1].wait;
    }
  });
}

/* ---------- inbound reply → pause 48h, then reset ---------- */
function receiveReply(contactId, text) {
  const c = byId(contactId); if (!c) return;
  c.lastInbound = now();
  OUTBOX.unshift({
    id: 'm' + (OUTBOX.length + 1), contactId, channel: 'Email', dir: 'in',
    body: text, at: now(), from: c.email
  });
  c.activity.unshift({ at: now(), kind: 'reply', text: 'Replied' });
  if (/\bstop\b|unsubscribe|opt.?out|remove me/i.test(text)) { optOut(contactId); return; }

  const e = ENROLMENTS.find(x => x.contactId === contactId);
  if (e && e.status === 'active') {
    e.status = 'paused'; e.resumeAt = now() + REPLY_PAUSE; e.nextAt = null;
    logEvent('pause', `${c.name} replied — follow-up paused 48 hours, then restarts at step 1`, c.id);
  }
  if (c.stage === 'New enquiry') c.stage = 'In conversation';
}

/* ---------- birthdays ---------- */
let BIRTHDAY_SENT = new Set();
function runBirthdays() {
  if (!has('anniversary')) return;
  const d = new Date(now());
  const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  CONTACTS.forEach(c => {
    if (c.optedOut) return;
    if (c.birthday.m !== d.getMonth() || c.birthday.d !== d.getDate()) return;
    const k = c.id + ':' + key;
    if (BIRTHDAY_SENT.has(k)) return;
    BIRTHDAY_SENT.add(k);
    const kind = c.stage === 'Past client' ? 'past' : (c.stage === 'Booked' ? 'client' : 'lead');
    const [subject, body] = BIRTHDAY_COPY[kind](ctx(c));
    send(c.id, 'Email', { subject, body }, { label: 'Birthday', auto: true });
    logEvent('birthday', `Birthday message sent to ${c.name}`, c.id);
  });
}
function birthdaysToday() {
  const d = new Date(now());
  return CONTACTS.filter(c => c.birthday.m === d.getMonth() && c.birthday.d === d.getDate());
}
function nextBirthdays(n = 6) {
  const d = new Date(now());
  return CONTACTS.map(c => {
    let y = d.getFullYear();
    let t = new Date(y, c.birthday.m, c.birthday.d).getTime();
    if (t < now() - DAY) t = new Date(y + 1, c.birthday.m, c.birthday.d).getTime();
    return { c, t };
  }).sort((a, b) => a.t - b.t).slice(0, n);
}

/* ---------- segments ---------- */
function segmentMatch(c, seg) {
  if (c.optedOut) return false;
  if (seg.birthdayToday) {
    const d = new Date(now());
    return c.birthday.m === d.getMonth() && c.birthday.d === d.getDate();
  }
  if (seg.stage && c.stage !== seg.stage) return false;
  if (seg.stages && !seg.stages.includes(c.stage)) return false;
  if (seg.minScore != null && c.score < seg.minScore) return false;
  if (seg.maxScore != null && c.score > seg.maxScore) return false;
  if (seg.session && c.session !== seg.session) return false;
  if (seg.quietDays != null && c.lastInbound && (now() - c.lastInbound) < seg.quietDays * DAY) return false;
  return true;
}
const segmentSize = seg => CONTACTS.filter(c => segmentMatch(c, seg)).length;
function segmentLabel(seg) {
  if (seg.birthdayToday) return 'Anyone with a birthday today';
  const bits = [];
  if (seg.stage) bits.push(seg.stage);
  if (seg.stages) bits.push(seg.stages.join(' or '));
  if (seg.minScore != null) bits.push('score ' + Math.round(seg.minScore / 10) + '+');
  if (seg.maxScore != null) bits.push('score under ' + Math.round(seg.maxScore / 10));
  if (seg.session) bits.push(seg.session);
  return bits.length ? bits.join(' · ') : 'Everyone';
}

/* ---------- template rendering ---------- */
function renderTemplate(tpl, c) {
  const vars = {
    first_name: c ? c.name.split(' ')[0] : 'there',
    full_name: c ? c.name : 'there',
    session_type: c ? c.session : 'session',
    shoot_date: c ? fmtD(c.shootDate) : 'your date',
    studio: ACCOUNT.studio,
    studio_phone: ACCOUNT.sendingNumber,
    venue: c && c.venueId ? venueById(c.venueId).name : 'your venue'
  };
  const fill = s => String(s || '').replace(/\{\{(\w+)\}\}/g, (m, k) => vars[k] != null ? vars[k] : m);
  if (tpl.kind === 'uploaded') return { subject: fill(tpl.subject), html: fill(tpl.html) };
  const html = tpl.blocks.map(b => {
    if (b.t === 'heading') return `<h2>${esc(fill(b.v))}</h2>`;
    if (b.t === 'text') return `<p>${esc(fill(b.v)).replace(/\n/g, '<br>')}</p>`;
    if (b.t === 'image') return b.v ? `<img src="${b.v}" alt="">` : `<div class="tpl-ph">${esc(b.caption || 'Image')}</div>`;
    if (b.t === 'button') return `<a class="tpl-btn" href="${esc(b.href || '#')}">${esc(fill(b.v))}</a>`;
    if (b.t === 'gallery') return `<div class="tpl-grid">${Array.from({ length: +b.v || 3 }, () => '<span></span>').join('')}</div>`;
    if (b.t === 'divider') return '<hr>';
    return '';
  }).join('');
  return { subject: fill(tpl.subject), html };
}

/* ---------- campaigns ---------- */
const SCHEDULES = { 'daily': DAY, 'every-7': 7 * DAY, 'every-14': 14 * DAY, 'every-30': 30 * DAY, 'every-90': 90 * DAY, 'once': null };
const SCHEDULE_LABEL = { 'daily': 'Every day', 'every-7': 'Every 7 days', 'every-14': 'Every 14 days', 'every-30': 'Every 30 days', 'every-90': 'Every 90 days', 'once': 'Send once' };

function runCampaign(cm, manual = false) {
  const tpl = TEMPLATES.find(t => t.id === cm.templateId);
  if (!tpl) return 0;
  const targets = CONTACTS.filter(c => segmentMatch(c, cm.segment));
  targets.forEach(c => {
    const r = renderTemplate(tpl, c);
    send(c.id, cm.channel, { subject: r.subject, body: r.html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 220) },
      { label: 'Campaign · ' + cm.name, auto: !manual, campaignId: cm.id });
  });
  cm.lastRun = now(); cm.sent += targets.length;
  if (targets.length) logEvent('campaign', `“${cm.name}” sent to ${targets.length} ${targets.length === 1 ? 'person' : 'people'}`, null);
  return targets.length;
}
function runCampaigns() {
  if (!has('nurture')) return;
  CAMPAIGNS.forEach(cm => {
    if (!cm.on) return;
    const every = SCHEDULES[cm.schedule];
    if (every == null) return;
    if (cm.lastRun == null || now() - cm.lastRun >= every) runCampaign(cm);
  });
}

/* ---------- date holds ---------- */
function placeHold(contactId, days = 7) {
  const c = byId(contactId); if (!c) return;
  HOLDS = HOLDS.filter(h => h.contactId !== contactId);
  HOLDS.push({ id: 'h' + contactId, contactId, date: c.shootDate, placedAt: now(), expiresAt: now() + days * DAY });
  c.activity.unshift({ at: now(), kind: 'hold', text: `${days}-day hold placed on ${fmtD(c.shootDate)}` });
  logEvent('hold', `Hold placed on ${fmtD(c.shootDate)} for ${c.name}`, c.id);
}
function runHolds() {
  HOLDS.filter(h => now() >= h.expiresAt).forEach(h => {
    const c = byId(h.contactId);
    logEvent('hold-exp', `Hold expired — ${fmtD(h.date)} released${c ? ' (' + c.name + ')' : ''}`, h.contactId);
    if (c) c.activity.unshift({ at: now(), kind: 'hold', text: 'Date hold expired and the date was released' });
  });
  HOLDS = HOLDS.filter(h => now() < h.expiresAt);
}

/* ---------- master tick ---------- */
function tick() { runFollowUp(); runBirthdays(); runCampaigns(); runHolds(); runPaymentReminders(); }

function advance(ms) {
  const target = CLOCK.now + ms;
  const stepSize = HOUR;
  while (CLOCK.now < target) {
    CLOCK.now = Math.min(CLOCK.now + stepSize, target);
    tick();
  }
  CLOCK.now = target;
  tick();
}
function nextDueAt() {
  const times = ENROLMENTS
    .map(e => e.status === 'active' ? e.nextAt : (e.status === 'paused' ? e.resumeAt : null))
    .filter(t => t != null && t > now());
  return times.length ? Math.min(...times) : null;
}

/* ---------- plan usage ---------- */
function usage() {
  const seatsUsed = TEAM.filter(u => u.active).length;
  const mk = (used, c) => ({ used, cap: c, pct: c === Infinity ? 0 : Math.min(100, Math.round(used / c * 100)) });
  return {
    plan: ACCOUNT.plan,
    seats: mk(seatsUsed, cap('seats')),
    contacts: mk(CONTACTS.length, cap('contacts')),
    galleries: mk(GALLERIES.length, cap('galleries')),
    storage: mk(ACCOUNT.storageUsedGB, STORAGE_GB[ACCOUNT.plan])
  };
}
const usageLevel = u => u.pct >= 95 ? 'critical' : u.pct >= 80 ? 'warn' : 'ok';
function worstUsage() {
  const u = usage();
  return ['seats', 'contacts', 'galleries', 'storage']
    .map(k => ({ k, ...u[k], level: usageLevel(u[k]) }))
    .sort((a, b) => b.pct - a.pct)[0];
}

/* ---------- permissions ---------- */
const RANK = { Owner: 3, 'Co-admin': 2, Member: 1 };
function canRemove(actor, target) {
  if (target.role === 'Owner') return { ok: false, why: 'The owner account cannot be removed.' };
  if (actor.id === target.id) return { ok: false, why: 'You cannot remove your own login.' };
  if (RANK[actor.role] < 2) return { ok: false, why: 'Only admins can remove logins.' };
  if (actor.role === 'Co-admin' && RANK[target.role] >= 2)
    return { ok: false, why: 'Co-admins cannot remove other admins. Ask the owner.' };
  return { ok: true };
}
function canChangeRole(actor, target) {
  if (target.role === 'Owner') return { ok: false, why: "The owner's role cannot be changed." };
  if (RANK[actor.role] < 2) return { ok: false, why: 'Only admins can change roles.' };
  if (actor.role === 'Co-admin' && RANK[target.role] >= 2)
    return { ok: false, why: 'Co-admins cannot change another admin. Ask the owner.' };
  return { ok: true };
}

/* ---------- daily report ---------- */
function sinceLastLogin() {
  const since = ACCOUNT.lastLogin || (now() - DAY);
  const ev = EVENTS.filter(e => e.at > since);
  const newEnq = CONTACTS.filter(c => c.createdAt > since);
  const replies = ev.filter(e => e.kind === 'reply' || e.kind === 'pause');
  const sends = OUTBOX.filter(m => m.at > since && m.dir === 'out');
  const bdays = birthdaysToday();
  const shoots = CONTACTS.filter(c => c.stage === 'Booked' && c.shootDate > now() && c.shootDate < now() + 7 * DAY);
  const overdue = INVOICES.filter(i => i.status === 'Overdue');
  const holds = HOLDS.filter(h => h.expiresAt < now() + 3 * DAY);
  const late = GALLERIES.filter(g => g.status !== 'Delivered' && g.dueAt < now() + 7 * DAY);
  return { since, ev, newEnq, replies, sends, bdays, shoots, overdue, holds, late };
}

/* fallback so the assistant still answers with the API unavailable */
function localAnswer(q) {

  if (/who.*(call|contact|chase|today)|priorit/.test(s))

      : 'No birthdays today. Next up: ' + nextBirthdays(3).map(x => `${x.c.name} on ${fmtD(x.t)}`).join(', ') + '.';
  }

    const a = ENROLMENTS.filter(e => e.status === 'active').length, p = ENROLMENTS.filter(e => e.status === 'paused').length;
    return `${a} people are in an active follow-up sequence and ${p} are paused after replying. Paused contacts resume 48 hours after their reply and restart at step 1 with different wording.`;
  }
  if (/revenue|money|invoice|owed/.test(s)) {
    const out = INVOICES.filter(i => i.status !== 'Paid' && i.status !== 'Draft').reduce((x, i) => x + i.amount, 0);
    return `${money(out)} is outstanding across ${INVOICES.filter(i => i.status !== 'Paid' && i.status !== 'Draft').length} invoices, ${INVOICES.filter(i => i.status === 'Overdue').length} of them overdue.`;

/* ---------- boot ---------- */
function boot() {
  seedContacts(now());
  seedGalleries(now());
  TEMPLATES.forEach(t => t.updatedAt = now() - 6 * DAY);

  /* backfill history so the app opens with a running system, not an empty one */
  const start = CLOCK.now;
  CLOCK.now = start - 21 * DAY;
  ACCOUNT.lastLogin = start - 26 * HOUR;
  CONTACTS.filter(c => c.stage === 'New enquiry' || c.stage === 'In conversation').forEach(c => {
    CLOCK.now = Math.max(c.createdAt, start - 21 * DAY);
    enrol(c.id, c.source);
  });
  CLOCK.now = start - 21 * DAY;
  advance(21 * DAY - HOUR);

  /* a few replies so paused/reset states are visible on open */
  const talkers = CONTACTS.filter(c => c.stage === 'In conversation').slice(0, 3);
  talkers.forEach((c, i) => { CLOCK.now = start - (30 - i * 9) * HOUR; receiveReply(c.id, 'Thanks — looking through these now, will come back to you.'); });
  const stopper = CONTACTS.filter(c => c.stage === 'New enquiry')[11];
  if (stopper) { CLOCK.now = start - 40 * HOUR; receiveReply(stopper.id, 'STOP'); }

  /* two enquiries land after the last login, one birthday is today,
     two shoots fall inside the week — so the daily report has substance */
  CLOCK.now = start - 9 * HOUR;
  const fresh = CONTACTS.filter(c => c.stage === 'New enquiry').slice(-2);
  fresh.forEach((c, i) => { CLOCK.now = start - (7 - i * 3) * HOUR; c.createdAt = CLOCK.now; enrol(c.id, c.source); });
  const bd = new Date(start);
  CONTACTS[4].birthday = { m: bd.getMonth(), d: bd.getDate() };
  CONTACTS.filter(c => c.stage === 'Booked').slice(0, 2).forEach((c, i) => { c.shootDate = start + (2 + i * 2) * DAY; });

  seedPackages();
  seedInvoiceBook();
  seedPortals();
  CLOCK.now = start;
  placeHold(CONTACTS.filter(c => c.stage === 'Consult booked')[0]?.id, 5);
  tick();
}

/* ============================ SHELL ============================ */
function renderSidebar() {
  const GROUPS = [
    ['Clients', ['today', 'leads', 'customers', 'portals', 'shoots']],
    ['Conversations', ['inbox', 'followup', 'marketing']],
    ['Business', ['galleries', 'invoices', 'reports']]
  ];
  const nav = GROUPS.flatMap(g => g[1]);
  const badge = {
    leads: CONTACTS.filter(c => LEAD_STAGES.includes(c.stage)).length,
    customers: CONTACTS.filter(c => CLIENT_STAGES.includes(c.stage)).length,
    invoices: INVOICES.filter(i => !i.void && invoiceStatus(i) === 'Overdue').length,
    portals: PORTAL_ACCOUNTS.filter(p => p.status === 'Invited').length,
    inbox: OUTBOX.filter(m => m.dir === 'in' && m.at > (ACCOUNT.lastLogin || 0)).length,
    followup: ENROLMENTS.filter(e => e.status === 'active').length
  };
  $('#sbBrandName').textContent = 'Reserve Legacy';
  $('#sbBrandSub').textContent = 'Studio CRM';
  $('#sbWsName').textContent = ACCOUNT.studio.split(' Photography')[0];
  const item = k => {
    const g = MODULE_GATE[k], locked = g && !has(g);
    return `<button class="nav-item${UI.view === k ? ' is-on' : ''}${locked ? ' locked' : ''}" data-go="${k}">
      ${I(VIEWS[k].i)}<span>${VIEWS[k].t}</span>
      ${locked ? `<span class="nav-badge" title="Not on the ${ACCOUNT.plan} plan">${I('lock', 11)}</span>`
        : badge[k] ? `<span class="nav-badge">${badge[k]}</span>` : ''}
    </button>`;
  };
  $('#sbNav').innerHTML = GROUPS.map(([label, keys]) =>
    `<div class="nav-sec">${label}</div>` + keys.map(item).join('')).join('');

  const u = usage(), w = worstUsage();
  const lvl = k => usageLevel(u[k]);
  $('#sbUsage').innerHTML = `
    <div class="storage">
      <div class="storage-top"><b>Plan usage</b>
        ${w.level !== 'ok' ? `<span class="usage-chip ${w.level === 'critical' ? 'critical' : ''}">${I('warn', 11)}${w.pct}%</span>`
      : `<span>${ACCOUNT.plan}</span>`}</div>
      ${['contacts', 'seats', 'storage'].map(k => `
        <div style="margin-bottom:8px">
          <div style="display:flex;font-size:11px;color:var(--muted);margin-bottom:4px">
            <span style="text-transform:capitalize">${k === 'storage' ? 'Gallery storage' : k}</span>
            <span style="margin-left:auto">${k === 'storage' ? (u[k].used / 1000).toFixed(1) + ' TB' : u[k].used} / ${k === 'storage' ? (u[k].cap === Infinity ? '∞' : (u[k].cap / 1000) + ' TB') : fmtCap(u[k].cap)}</span>
          </div>
          <div class="meter-bar ${lvl(k)}"><i style="width:${u[k].pct}%"></i></div>
        </div>`).join('')}
      ${w.level !== 'ok'
      ? `<button class="storage-btn" data-sales style="justify-content:center">${I('phone', 13)} Talk to sales about ${w.k === 'seats' ? 'more logins' : 'a bigger plan'}</button>`
      : `<button class="storage-btn" data-go="settings" style="justify-content:center">View plan details</button>`}
    </div>`;
}

function toolbarFor(v) {
  const ai = `<button class="btn-ai" data-ai>${I('spark', 16)}Ask AI</button>`;
  const clock = `<div class="tool-right"><button class="btn-o" data-clockbar>${I('clock', 15)}${new Date(now()).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}, ${new Date(now()).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' })}</button></div>`;
  const addC = `<button class="btn-dark" data-newlead>${I('plus', 16)}New enquiry</button>`;
  if (v === 'enquiries' || v === 'people') return `${ai}${addC}${clock}`;
  if (v === 'shoots') return `${ai}
    <div class="seg"><button data-shootview="board"${UI.shootView === 'board' ? ' class="is-on"' : ''}>${I('kanban', 15)}Board</button>
      <button data-shootview="packages"${UI.shootView === 'packages' ? ' class="is-on"' : ''}>${I('tag', 15)}Packages</button></div>
    ${UI.shootView === 'packages'
      ? `<button class="btn-dark" data-newpkg>${I('plus', 16)}New package</button>`
      : `<button class="btn-dark" data-newshoot>${I('plus', 16)}New shoot</button>`}${clock}`;
  if (v === 'galleries') return `${ai}<button class="btn-dark" data-newgal>${I('plus', 16)}New gallery</button>${clock}`;
  if (v === 'invoices') return `${ai}<button class="btn-dark" data-newinv="">${I('plus', 16)}New invoice</button>${clock}`;
  if (v === 'marketing') return `${ai}<button class="btn-o" data-newtpl>${I('plus', 15)}New template</button><button class="btn-o" data-newcamp>${I('send', 15)}New campaign</button>${clock}`;
  if (v === 'settings') return `${ai}<button class="btn-dark" data-adduser>${I('plus', 16)}Add login</button>${clock}`;
  return `${ai}${clock}`;
}

function go(v) {
  const gate = MODULE_GATE[v];
  if (gate && !has(gate)) { UI.view = v; UI.sel.clear();
    $('#pageTitle').textContent = VIEWS[v].t;
    $('#toolbar').innerHTML = `<button class="btn-ai" data-ai>${I('spark',16)}Ask AI</button>`;
    renderSidebar();
    $('#view').innerHTML = lockedScreen(v, gate);
    return;
  }
  UI.view = v; UI.sel.clear();
  $('#pageTitle').textContent = VIEWS[v].t;
  $('#toolbar').innerHTML = toolbarFor(v);
  renderSidebar();
  const box = $('#view'); box.scrollTop = 0;
  box.innerHTML = `<p class="lede">${VIEWS[v].lede}</p>` + clockBar();
  const host = document.createElement('div');
  box.appendChild(host);
  ({
    today: vToday, leads: vLeads, customers: vCustomers, portals: vPortals, shoots: vShoots, people: vPeople, inbox: vInbox,
    followup: vFollowUp, marketing: vMarketing, galleries: vGalleries, invoices: vInvoices,
    reports: vReports, help: vHelp, settings: vSettings
  })[v](host);
}
const refresh = () => go(UI.view);

}

/* ============================ TABLES ============================ */
const LEAD_STAGES = ['New enquiry', 'In conversation', 'Consult booked'];
const CLIENT_STAGES = ['Booked', 'Past client'];
function vLeads(box) { peopleTable(box, CONTACTS.filter(c => LEAD_STAGES.includes(c.stage))); }
function vCustomers(box) { peopleTable(box, CONTACTS.filter(c => CLIENT_STAGES.includes(c.stage)), true); }
function vPeople(box) { peopleTable(box, CONTACTS); }

function peopleTable(box, rows, isClient) {
  const { key, dir } = UI.sort;
  const sorted = [...rows].sort((a, b) => {
    let x = a[key], y = b[key];
    if (typeof x === 'string') return x.localeCompare(y) * dir;
    return ((x || 0) - (y || 0)) * dir;
  });
  const pages = Math.max(1, Math.ceil(sorted.length / UI.per));
  UI.page = Math.min(UI.page, pages);
  const pg = sorted.slice((UI.page - 1) * UI.per, UI.page * UI.per);
  const cols = isClient
    ? [['name', 'Name'], ['session', 'Session'], ['stage', 'Status'], ['value', 'Booked value'],
       ['shootDate', 'Shoot date'], ['source', 'Source'], ['ownerId', 'Photographer']]
    : [['name', 'Name'], ['session', 'Session'], ['stage', 'Status'], ['score', 'Score'],
       ['shootDate', 'Shoot date'], ['source', 'Source'], ['ownerId', 'Photographer']];

  box.innerHTML = `
  <div class="tbl-wrap">
    <table class="tbl">
      <colgroup><col style="width:40px"><col style="width:20%"><col style="width:11%"><col style="width:14%">
        <col style="width:12%"><col style="width:11%"><col style="width:12%"><col style="width:12%"><col style="width:8%"></colgroup>
      <thead><tr><th><span class="cbx" data-all>${I('check', 11)}</span></th>
        ${cols.map(([k, l]) => `<th class="s" data-sort="${k}"><span class="th">${l}${I('sortY', 13)}</span></th>`).join('')}
        <th><span class="th">${isClient ? 'Balance' : 'Follow-up'}</span></th>
        <th style="width:78px"></th></tr></thead>
      <tbody>${pg.map(c => rowFor(c, isClient)).join('')}</tbody>
    </table>
    <div class="tbl-foot"><span>${sorted.length} people</span>
      <div class="pager">${Array.from({ length: Math.min(pages, 6) }, (_, i) => i + 1).map(p =>
        `<button data-page="${p}"${p === UI.page ? ' class="is-on"' : ''}>${p}</button>`).join('')}</div>
    </div>
  </div>`;
  syncBulk();
}
function rowFor(c, isClient) {
  const sel = UI.sel.has(c.id);
  const e = ENROLMENTS.find(x => x.contactId === c.id);
  const col = c.score >= 70 ? '#16a34a' : c.score >= 45 ? '#e8a01f' : '#cfd3d9';
  const fu = c.optedOut ? '<span class="pill p-lost">Opted out</span>'
    : !e ? '<span style="color:var(--faint);font-size:12px">—</span>'
      : e.status === 'paused' ? `<span class="pill p-warn">Paused</span>`
        : e.status === 'active' ? `<span class="pill p-talk">Step ${Math.min(e.step, 7)}</span>`
          : '<span class="pill p-past">Stopped</span>';
  const bal = INVOICES.filter(i => i.contactId === c.id && !i.void && !i.draft)
    .reduce((s, i) => s + invoiceTotals(i).balance, 0);
  const od = INVOICES.some(i => i.contactId === c.id && !i.void && invoiceStatus(i) === 'Overdue');
  const last = isClient
    ? (bal > 0.01 ? `<span class="pill ${od ? 'p-lost' : 'p-warn'}">${money(bal)}</span>`
        : '<span class="pill p-booked">Settled</span>')
    : fu;
  return `<tr data-row="${c.id}"${sel ? ' class="sel"' : ''}>
    <td><span class="cbx${sel ? ' on' : ''}" data-pick="${c.id}">${I('check', 11)}</span></td>
    <td><div class="cell-b"><span class="logo-sq" style="background:${avc(c.name)}">${initials(c.name)}</span><b>${esc(c.name)}</b></div></td>
    <td>${esc(c.session)}</td>
    <td><span class="pill ${STAGE_CLS[c.stage]}">${esc(c.stage)}</span></td>
    <td>${isClient ? `<b style="font-weight:600">${money(c.value)}</b>`
      : `<div class="score-wrap"><span class="score-bar"><i style="width:${c.score}%;background:${col}"></i></span>
         <span class="score-n">${Math.round(c.score / 10)}</span></div>`}</td>
    <td style="color:var(--body)">${fmtD(c.shootDate)}</td>
    <td style="color:var(--body)">${esc(c.source)}</td>
    <td><div class="cell-b"><span class="av" style="background:${avc(userById(c.ownerId).name)}">${initials(userById(c.ownerId).name)}</span>
      <span style="font-size:12.5px">${esc(userById(c.ownerId).name.split(' ')[0])}</span></div></td>
    <td>${last}</td>
    <td class="rowact">
      ${isClient ? `<button class="mini" data-portal="${c.id}" title="Open their portal">${I('users', 14)}</button>`
        : `<button class="mini go" data-convert="${c.id}" title="Convert to customer">${I('checkC', 14)}</button>`}
      <button class="mini danger" data-del="${c.id}" title="Delete">${I('x', 14)}</button>
    </td></tr>`;
}
function syncBulk() {
  const b = $('#bulk'); if (!b) return;
  b.classList.toggle('on', UI.sel.size > 0);
  if (UI.sel.size) $('#bulkN').textContent = `${UI.sel.size} selected`;

function wireBoard() {
  let drag = null;
  $$('.kc').forEach(k => {
    k.addEventListener('dragstart', e => { drag = k.dataset.card; k.classList.add('ghost'); e.dataTransfer.effectAllowed = 'move'; });
    k.addEventListener('dragend', () => { k.classList.remove('ghost'); drag = null; });
  });
  $$('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('drag-over');
      if (!drag) return;
      const c = byId(drag), to = col.dataset.col;
      if (c.stage === to) return;
      c.stage = to;
      c.activity.unshift({ at: now(), kind: 'stage', text: `Moved to ${to}` });
      if (to === 'Booked') { unenrol(c.id, 'Booked'); toast(`${c.name} booked — chasing sequence stopped.`); }
      else toast(`${c.name} moved to ${to}.`);
      refresh();
    });
  });
}

function wireUpload() {
  const f = $('#tplFile');
  if (f) f.onchange = ev => {
    const file = ev.target.files[0]; if (!file) return;
    const rd = new FileReader();
    rd.onload = () => {
      const id = 'tpl' + (TEMPLATES.length + 1);
      TEMPLATES.push({ id, name: file.name.replace(/\.html?$/i, ''), subject: 'Imported template', kind: 'uploaded', html: rd.result, updatedAt: now() });
      UI.tplId = id; toast('Template uploaded.'); refresh();
    };
    rd.readAsText(file);
  };
  $$('[data-imgblk]').forEach(inp => {
    inp.onchange = ev => {
      const file = ev.target.files[0]; if (!file) return;
      const rd = new FileReader();
      rd.onload = () => {
        const tpl = TEMPLATES.find(t => t.id === UI.tplId);
        tpl.blocks[+inp.dataset.imgblk].v = rd.result; tpl.updatedAt = now();
        toast('Image added to the template.'); refresh();
      };
      rd.readAsDataURL(file);
    };
  });
}

async function aiAsk(q) {

  UI.chat.push({ r: 'q', t: q });

  openAI();
  let out;
  try {
    out = await askClaude(
      `You are the assistant inside Reserve Legacy CRM, used by a photography studio. Answer from the JSON snapshot only. Be brief and concrete — name people, dates and numbers. Never invent data that is not in the snapshot. Plain text, no markdown.`,
      `Studio snapshot:\n${studioSnapshot()}\n\nQuestion: ${q}`);

    SHOOTS.push(s);

function goldenHour(dateMs) {
  const d = new Date(dateMs), m = d.getMonth();
  const sunset = [17.6, 18.1, 19.6, 20.0, 20.3, 20.6, 20.5, 20.1, 19.4, 18.7, 17.5, 17.3][m];
  const h = Math.floor(sunset - 1), mm = Math.round(((sunset - 1) % 1) * 60);
  const t = (hh, mi) => `${((hh + 11) % 12) + 1}:${String(mi).padStart(2, '0')} ${hh >= 12 ? 'PM' : 'AM'}`;
  return { start: t(h, mm), sunset: t(Math.floor(sunset), Math.round((sunset % 1) * 60)) };
}

function globalSearch(q) {
  const s = q.trim().toLowerCase();
  if (!s) return [];
  const out = [];
  CONTACTS.forEach(c => {
    if ([c.name, c.email, c.phone, c.session, c.city, c.source].join(' ').toLowerCase().includes(s))
      out.push({ kind: 'Person', label: c.name, sub: `${c.stage} · ${c.session} · ${c.email}`, act: () => openDrawer(c.id) });
  });
  INVOICES.filter(i => !i.void).forEach(i => {
    const c = byId(i.contactId);
    if ((i.id + ' ' + (c ? c.name : '') + ' ' + i.kind).toLowerCase().includes(s))
      out.push({ kind: 'Invoice', label: i.id, sub: `${c ? c.name : ''} · ${money(invoiceTotals(i).total)} · ${invoiceStatus(i)}`, act: () => openInvoice(i.id) });
  });
  GALLERIES.forEach(g => {
    if (g.name.toLowerCase().includes(s))
      out.push({ kind: 'Gallery', label: g.name, sub: `${g.photos} photos · ${g.status}`, act: () => { go('galleries'); openGalleryEditor(g.id); } });
  });
  PACKAGES.forEach(p => {
    if (p.name.toLowerCase().includes(s))
      out.push({ kind: 'Package', label: p.name, sub: `${p.session} · ${money(packagePrice(p).total)}`, act: () => openPackageEditor(p.id) });
  });
  Object.entries(VIEWS).forEach(([k, vv]) => {
    if (vv.t.toLowerCase().includes(s)) out.push({ kind: 'Screen', label: vv.t, sub: 'Go to this screen', act: () => go(k) });
  });
  return out.slice(0, 12);
}

    <div class="form-row"><label>Note</label><textarea class="inp" style="height:66px;padding:9px 11px" id="shNote" placeholder="Can you pick these up today?"></textarea></div>

function openAudit() {

/* ============================ TOAST ============================ */
let tT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 2800); }

/* ============================ EVENTS ============================ */
document.addEventListener('click', async e => {
  const h = s => e.target.closest(s);
  let x;

  if ((x = h('[data-go]'))) return go(x.dataset.go);
  if (h('[data-close]') || e.target.id === 'scrim') return closeDrawer();
  if (h('[data-mclose]')) return closeModal();

  /* clock */
  if ((x = h('[data-adv]'))) {
    const k = x.dataset.adv;
    if (k === 'next') {
      const t = nextDueAt();
      if (!t) return toast('Nothing scheduled.');
      advance(t - now() + 60e3);
      toast('Ran forward to the next automated message.');
    } else {
      advance({ '1h': HOUR, '1d': DAY, '1w': 7 * DAY }[k]);
      toast('Studio clock advanced. Automations ran.');
    }
    return refresh();
  }

  /* records */
  if ((x = h('[data-open]'))) { e.preventDefault(); return openDrawer(x.dataset.open); }
  if ((x = h('[data-pick]'))) {
    const id = x.dataset.pick;
    UI.sel.has(id) ? UI.sel.delete(id) : UI.sel.add(id);
    x.classList.toggle('on'); x.closest('tr').classList.toggle('sel'); return syncBulk();
  }
  if (h('[data-all]')) {
    const rows = $$('[data-row]'); const all = rows.every(r => UI.sel.has(r.dataset.row));
    rows.forEach(r => all ? UI.sel.delete(r.dataset.row) : UI.sel.add(r.dataset.row));
    return refresh();
  }
  if ((x = h('[data-row]')) && !h('[data-pick]') && !h('.rowact') && !h('[data-convert]') && !h('[data-del]') && !h('[data-portal]'))
    return openDrawer(x.dataset.row);
  if ((x = h('[data-shootview]'))) { UI.shootView = x.dataset.shootview; return go('shoots'); }
  if ((x = h('[data-openshoot]'))) return openShoot(x.dataset.openshoot);
  if ((x = h('[data-del]'))) return confirmDelete(x.dataset.del);
  if ((x = h('[data-dodel]'))) {
    const name = byId(x.dataset.dodel).name;
    deleteContact(x.dataset.dodel);
    closeModal(); closeDrawer(); toast(`${name} deleted.`); return refresh();
  }
  if (h('[data-bulkdel]')) {
    const n = UI.sel.size;
    modal('Delete ' + n + (n === 1 ? ' person' : ' people') + '?', `
      <p style="margin:0;font-size:13.5px;line-height:1.6">This removes them and everything attached — invoices,
      galleries, agreements, messages and their client portal. It cannot be undone.</p>`,
      `<div class="sp"><button class="btn-o" data-mclose>Cancel</button>
        <button class="btn-dark danger-btn" data-dobulkdel>${I('x', 15)}Delete ${n}</button></div>`);
    return;
  }
  if (h('[data-dobulkdel]')) {
    const n = UI.sel.size;
    UI.sel.forEach(id => deleteContact(id));
    UI.sel.clear(); closeModal(); toast(`${n} deleted.`); return refresh();
  }
  if ((x = h('[data-portal]'))) { closeModal(); return openPortal(x.dataset.portal); }
  if ((x = h('[data-manageportal]'))) return openPortalManager(x.dataset.manageportal);
  if ((x = h('[data-resendinvite]'))) {
    sendPortalInvite(portalFor(x.dataset.resendinvite));
    toast(`Invitation resent from ${ACCOUNT.sendingEmail}.`);
    openPortalManager(x.dataset.resendinvite); return refresh();
  }
  if ((x = h('[data-resetpw]'))) {
    const p2 = resetPortalPassword(x.dataset.resetpw);
    toast(`New temporary password ${p2.tempPassword} emailed to the customer.`);
    openPortalManager(x.dataset.resetpw); return refresh();
  }
  if ((x = h('[data-portalstatus]'))) {
    const [cid, s2] = x.dataset.portalstatus.split('|');
    setPortalStatus(cid, s2);
    toast(s2 === 'Suspended' ? 'Portal access suspended.' : 'Portal access restored.');
    openPortalManager(cid); return refresh();
  }
  if ((x = h('[data-issuesa]'))) {
    const a = issueAgreement(x.dataset.issuesa);
    toast(`${a.id} issued and emailed. Nothing proceeds until it is signed.`);
    drawDrawer(); return refresh();
  }
  if ((x = h('[data-convert]'))) {
    const c = byId(x.dataset.convert);
    convertToCustomer(c.id);
    createPortalAccount(c.id);
    const a = issueAgreement(c.id);
    toast(`${c.name} is a customer. Portal created and ${a.id} sent for signature.`);
    if (UI.drawer === c.id) drawDrawer();
    return refresh();
  }
  if ((x = h('[data-revert]'))) { revertToLead(x.dataset.revert); toast('Moved back to a lead and re-enrolled.'); drawDrawer(); return refresh(); }
  if (h('[data-bulkconvert]')) {
    let n = 0; UI.sel.forEach(id => { if (!CLIENT_STAGES.includes(byId(id).stage)) { convertToCustomer(id, 'bulk convert'); n++; } });
    UI.sel.clear(); toast(`${n} converted to customers.`); return refresh();
  }
  if ((x = h('[data-assignto]'))) return openAssign(x.dataset.assignto);
  if ((x = h('[data-assignpkg]'))) return openAssign(null, x.dataset.assignpkg);
  if (h('[data-doassign]')) {
    const cid = $('#asClient').value, pid = $('#asPkg').value;
    const date = Date.parse($('#asDate').value) || null;
    const r = assignPackage(cid, pid, { date });
    closeModal();
    toast(`${r.pkg.name} assigned. ${r.invoice.id} raised and emailed to ${r.contact.email}.`);
    go('shoots'); return openDrawer(cid);
  }
  if ((x = h('[data-editpkg]'))) return openPackageEditor(x.dataset.editpkg);
  if (h('[data-newpkg]')) return openPackageEditor(null);
  if (h('[data-savepkg]')) return savePackage();
  if ((x = h('[data-pkgline]'))) { EDIT_PKG.lineItems.push({ desc: '', qty: 1, rate: 0 }); return drawPackageEditor(); }
  if ((x = h('[data-pkglinerm]'))) { EDIT_PKG.lineItems.splice(+x.dataset.pkglinerm, 1); return drawPackageEditor(); }
  if ((x = h('[data-pkgfee]'))) { EDIT_PKG.additionalFees.push({ label: '', amount: 0 }); return drawPackageEditor(); }
  if ((x = h('[data-pkgfeerm]'))) { EDIT_PKG.additionalFees.splice(+x.dataset.pkgfeerm, 1); return drawPackageEditor(); }
  if (h('[data-simform]')) return simulateForm();
  if (h('[data-simpurchase]')) return simulatePurchase();
  if ((x = h('[data-emailinv]'))) {
    const inv = INVOICES.find(i => i.id === x.dataset.emailinv);
    emailInvoice(inv); closeModal(); toast(`${inv.id} emailed to ${byId(inv.contactId).email}.`); return refresh();
  }
  if (h('[data-newshoot]')) return openShootEditor(null);
  if ((x = h('[data-editshoot]'))) return openShootEditor(x.dataset.editshoot);
  if (h('[data-saveshoot]')) return saveShoot();
  if ((x = h('[data-shootinv]'))) { closeModal(); return openInvoiceEditor(null, x.dataset.shootinv); }
  if (h('[data-planrequest]')) return openPlanRequest();
  if ((x = h('[data-sort]'))) {
    const k = x.dataset.sort;
    UI.sort = { key: k, dir: UI.sort.key === k ? -UI.sort.dir : -1 }; return refresh();
  }
  if ((x = h('[data-page]'))) { UI.page = +x.dataset.page; return refresh(); }
  if (h('#bulkClear')) { UI.sel.clear(); return refresh(); }
  if (h('[data-bulkenrol]')) {
    let n = 0; UI.sel.forEach(id => { if (enrol(id, 'Added by hand')) n++; });
    UI.sel.clear(); toast(`${n} people added to follow-up.`); return refresh();
  }
  if (h('[data-bulkstop]')) {
    UI.sel.forEach(id => unenrol(id, 'Stopped by hand'));
    const n = UI.sel.size; UI.sel.clear(); toast(`Follow-up stopped for ${n}.`); return refresh();
  }

  /* follow-up */
  if ((x = h('[data-startfu]'))) { enrol(x.dataset.startfu, 'Started by hand'); toast('Follow-up started — first message sent.'); tick(); openDrawer(x.dataset.startfu); return refresh(); }
  if ((x = h('[data-stopfu]'))) { unenrol(x.dataset.stopfu, 'Stopped by hand'); toast('Follow-up stopped.'); openDrawer(x.dataset.stopfu); return refresh(); }
  if ((x = h('[data-hold]'))) { placeHold(x.dataset.hold, 7); toast('7-day hold placed. It releases itself.'); openDrawer(x.dataset.hold); return refresh(); }
  if ((x = h('[data-releasehold]'))) { HOLDS = HOLDS.filter(hh => hh.id !== x.dataset.releasehold); toast('Date released.'); return refresh(); }

  /* inbox */
  if ((x = h('[data-th]'))) { UI.thread = x.dataset.th; return refresh(); }
  if ((x = h('[data-simreply]'))) {
    receiveReply(x.dataset.simreply, 'Thanks for following up — we are still deciding, can you send the album options?');
    toast('Reply received. Follow-up paused 48 hours, then restarts at step 1 with new wording.');
    return refresh();
  }
  if ((x = h('[data-reply]'))) {
    const t = $('#composer'); if (!t.value.trim()) return toast('Write something first.');
    send(x.dataset.reply, 'Email', { subject: 'Re: your enquiry', body: t.value.trim() }, { label: 'Sent by you' });
    toast('Sent from ' + ACCOUNT.sendingEmail); return refresh();
  }

  /* AI */
  if (h('[data-ai]')) return openAI();
  if ((x = h('[data-aiq]'))) return aiAsk(x.dataset.aiq);
  if (h('[data-aisend]')) { const v = $('#aiInput').value; $('#aiInput').value = ''; return aiAsk(v); }
  if ((x = h('[data-aidraft]')) || (x = h('[data-draftfor]')))
    return aiDraft(x.dataset.aidraft || x.dataset.draftfor);
  if ((x = h('[data-senddraft]'))) {
    send(x.dataset.senddraft, 'Email', { subject: 'A note from ' + ACCOUNT.studio, body: $('#draftBox').value }, { label: 'Sent by you' });
    closeModal(); toast('Sent.'); return refresh();
  }

  /* marketing */
  if ((x = h('[data-tpl]'))) { UI.tplId = x.dataset.tpl; return refresh(); }
  if ((x = h('[data-addblk]'))) {
    const t = TEMPLATES.find(t => t.id === UI.tplId);
    const type = x.dataset.addblk;
    t.blocks.push(type === 'button' ? { t: 'button', v: 'Click here', href: 'https://' }
      : type === 'gallery' ? { t: 'gallery', v: '3' }
        : type === 'image' ? { t: 'image', v: '', caption: 'Image' }
          : type === 'divider' ? { t: 'divider' } : { t: type, v: '' });
    return refresh();
  }
  if ((x = h('[data-rmblk]'))) { TEMPLATES.find(t => t.id === UI.tplId).blocks.splice(+x.dataset.rmblk, 1); return refresh(); }
  if ((x = h('[data-mvblk]'))) {
    const b = TEMPLATES.find(t => t.id === UI.tplId).blocks, i = +x.dataset.mvblk, j = i + (+x.dataset.dir);
    if (j < 0 || j >= b.length) return;
    [b[i], b[j]] = [b[j], b[i]]; return refresh();
  }
  if (h('[data-newtpl]')) {
    const id = 'tpl' + (TEMPLATES.length + 1);
    TEMPLATES.push({ id, name: 'Untitled template', subject: 'Subject line', kind: 'built', updatedAt: now(), blocks: [{ t: 'heading', v: 'Hello {{first_name}}' }, { t: 'text', v: '' }] });
    UI.tplId = id; go('marketing'); return toast('Template created.');
  }
  if (h('[data-newcamp]')) return openNewCampaign();
  if (h('[data-savecamp]')) {
    const name = $('#cmName').value.trim() || 'Untitled campaign';
    CAMPAIGNS.push({
      id: 'cm' + (CAMPAIGNS.length + 1), name, templateId: $('#cmTpl').value,
      segment: segFromValue($('#cmSeg').value), schedule: $('#cmSched').value,
      channel: $('#cmCh').value, on: true, lastRun: null, sent: 0
    });
    closeModal(); toast('Campaign created and switched on.'); return refresh();
  }
  if ((x = h('[data-runcamp]'))) {
    const n = runCampaign(CAMPAIGNS.find(c => c.id === x.dataset.runcamp), true);
    toast(n ? `Sent to ${n} ${n === 1 ? 'person' : 'people'}.` : 'Nobody matches that group right now.');
    return refresh();
  }
  if ((x = h('[data-campon]'))) {
    const cm = CAMPAIGNS.find(c => c.id === x.dataset.campon); cm.on = !cm.on;
    toast(`${cm.name} ${cm.on ? 'switched on' : 'paused'}.`); return refresh();
  }
  if ((x = h('[data-usetpl]'))) { openNewCampaign(); setTimeout(() => { $('#cmTpl').value = x.dataset.usetpl; }, 40); return; }

  /* team */
  if (h('[data-adduser]')) return openAddUser();
  if (h('[data-saveuser]')) {
    const n = $('#nuName').value.trim(); if (!n) return toast('Name is required.');
    TEAM.push({ id: 'u' + (TEAM.length + 1), name: n, email: $('#nuEmail').value.trim() || 'new@willowandivy.com', role: $('#nuRole').value, title: $('#nuTitle').value.trim() || 'Team member', active: true });
    closeModal(); toast('Login created. A seat has been used.'); return refresh();
  }
  if ((x = h('[data-rmuser]'))) {
    const t = TEAM.find(u => u.id === x.dataset.rmuser), r = canRemove(meUser(), t);
    if (!r.ok) return toast(r.why);
    TEAM = TEAM.filter(u => u.id !== t.id);
    toast(`${t.name} removed. That seat is free again.`); return refresh();
  }
  if ((x = h('[data-role]'))) {
    const t = TEAM.find(u => u.id === x.dataset.role), r = canChangeRole(meUser(), t);
    if (!r.ok) return toast(r.why);
    t.role = t.role === 'Co-admin' ? 'Member' : 'Co-admin';
    toast(`${t.name} is now a ${t.role.toLowerCase()}.`); return refresh();
  }

  /* misc */
  if (h('[data-ptexit]')) return closePortal();
  if ((x = h('[data-ptgo]'))) { PORTAL.view = x.dataset.ptgo; return drawPortal(); }
  if ((x = h('[data-ptsign]'))) {
    const nm = ($('#sigName').value || '').trim();
    if (nm.length < 3) return toast('Type your full name to sign.');
    const a = signAgreement(x.dataset.ptsign, nm);
    toast('Signed. Your studio has been notified and anything held back is on its way.');
    return drawPortal();
  }
  if ((x = h('[data-ptpay]'))) return openPayment(x.dataset.ptpay);
  if ((x = h('[data-dopay]'))) return takePayment(x.dataset.dopay);
  if ((x = h('[data-ptdl]')) || (x = h('[data-ptdlall]'))) return toast('Download started.');
  if ((x = h('[data-editcontact]'))) return openContactEditor(x.dataset.editcontact);
  if (h('[data-savecontact]')) {
    const c = byId(UI.drawer);
    c.name = $('#ceName').value.trim() || c.name;
    c.email = $('#ceEmail').value.trim() || c.email;
    c.phone = $('#cePhone').value.trim() || c.phone;
    c.activity.unshift({ at: now(), kind: 'edit', text: 'Details updated in the CRM' });
    const changed = syncPortalFromCrm(c.id) || [];
    closeModal();
    toast(changed.length ? `Saved. Their portal ${changed.join(', ')} updated too.` : 'Saved.');
    drawDrawer(); return refresh();
  }
  if (h('[data-ptsave]')) {
    updatePortalProfile(PORTAL.contactId, {
      name: $('#ptName').value.trim(), email: $('#ptEmail').value.trim(),
      phone: $('#ptPhone').value.trim(), username: $('#ptUser').value.trim()
    });
    toast('Saved. Your studio sees the change straight away.');
    return drawPortal();
  }
  if (h('[data-ptpw]')) {
    const a2 = $('#ptPw1').value, b2 = $('#ptPw2').value;
    if (a2.length < 8) return toast('Use at least 8 characters.');
    if (a2 !== b2) return toast('Those do not match.');
    updatePortalProfile(PORTAL.contactId, { password: a2 });
    return toast('Password changed.');
  }
  if ((x = h('[data-ptprint]'))) return toast('A signed PDF copy has been emailed to you.');
  if (h('#bell')) return openNotifications();
  if (h('[data-marknotif]')) { ACCOUNT.lastLogin = now(); closeModal(); toast('All caught up.'); return refresh(); }
  if (h('#shareBtn')) return openShare();
  if (h('[data-doshare]')) { closeModal(); toast('Sent to your teammate.'); return; }
  if (h('#wsBtn')) return openWorkspace();
  if (h('[data-audit]')) return openAudit();
  if (h('#collapse')) {
    document.body.classList.toggle('sb-collapsed');
    toast(document.body.classList.contains('sb-collapsed') ? 'Sidebar collapsed.' : 'Sidebar expanded.');
    return;
  }
  if ((x = h('[data-hit]'))) { const hit = SEARCH_HITS[+x.dataset.hit]; $('#searchDrop').hidden = true; $('#globalSearch').value = ''; return hit && hit.act(); }
  if ((x = h('[data-copy]'))) {
    if (navigator.clipboard) navigator.clipboard.writeText(x.dataset.copy).catch(() => {});
    return toast('Copied to the clipboard.');
  }
  if (!e.target.closest('.top-search')) { const d = $('#searchDrop'); if (d) d.hidden = true; }
  if (h('[data-sendplanreq]')) {
    logEvent('plan', `Plan change requested — ${$('#prNeed').value}`, null);
    closeModal(); toast('Request sent. Reserve Legacy will call you.'); return;
  }
  if (h('[data-sales]')) return openSales();
  if (h('[data-newlead]')) return openNewLead();
  if (h('[data-savelead]')) {
    const n = $('#nlName').value.trim(); if (!n) return toast('Name is required.');
    const b = new Date($('#nlBday').value || '1994-06-12');
    const c = {
      id: 'c' + (CONTACTS.length + 1), name: n,
      email: $('#nlEmail').value.trim() || 'new@example.com', phone: $('#nlPhone').value.trim() || '(214) 555-0000',
      stage: 'New enquiry', session: $('#nlSession').value, score: 55,
      source: $('#nlSource').value, ownerId: ME, city: 'Dallas', venueId: null,
      shootDate: Date.parse($('#nlDate').value) || now() + 90 * DAY,
      birthday: { m: b.getUTCMonth(), d: b.getUTCDate() },
      value: 3200, createdAt: now(), lastInbound: null, optedOut: false, tags: [], signals: [], activity: []
    };
    c.activity.push({ at: now(), kind: 'enquiry', text: `Enquiry received from ${c.source}` });
    CONTACTS.push(c); enrol(c.id, c.source); tick();
    closeModal(); toast('Enquiry saved — email and text sent immediately.');
    go('enquiries'); return openDrawer(c.id);
  }
  /* auth */
  if (h('[data-dologin]')) {
    const r = startLogin($('#lgEmail').value, $('#lgPass').value);
    if (!r.ok) { $('#lgErr').textContent = r.why; return; }
    if (r.stage === 'done') return enterApp();
    return renderLogin();
  }
  if ((x = h('[data-rem]'))) { REMEMBER = x.dataset.rem; $$('.rem').forEach(b => b.classList.remove('is-on')); x.classList.add('is-on'); return; }
  if (h('[data-docode]')) {
    const r = verifyCode($('#lgCode').value, REMEMBER);
    if (!r.ok) { $('#lgErr').textContent = r.why; return; }
    return enterApp();
  }
  if (h('[data-resend]')) { resendCode(); return renderLogin(); }
  if (h('[data-backlogin]')) { AUTH.stage = 'password'; AUTH.pending = null; return renderLogin(); }
  if (h('[data-signout]')) { signOut(); $('#appRoot').hidden = true; $('#loginLayer').hidden = false; return renderLogin(); }
  if (h('[data-forgetdev]')) { forgetDevices(); toast('Every remembered device revoked. Codes required again.'); return refresh(); }

  /* drawer tabs */
  if ((x = h('[data-drtab]'))) { UI.drawerTab = x.dataset.drtab; return drawDrawer(); }

  /* invoices */
  if ((x = h('[data-inv]'))) return openInvoice(x.dataset.inv);
  if ((x = h('[data-newinv]'))) return openInvoiceEditor(null, x.dataset.newinv);
  if ((x = h('[data-editinv]'))) return openInvoiceEditor(x.dataset.editinv);
  if ((x = h('[data-issueinv]'))) {
    const inv = INVOICES.find(i => i.id === x.dataset.issueinv); inv.draft = false; inv.issuedAt = now(); inv.dueAt = now() + 14 * DAY;
    logEvent('invoice', `${inv.id} issued to ${byId(inv.contactId).name}`, inv.contactId);
    closeModal(); toast(`${inv.id} issued.`); return refresh();
  }
  if ((x = h('[data-payinv]'))) {
    const inv = INVOICES.find(i => i.id === x.dataset.payinv);
    recordPayment(inv, invoiceTotals(inv).balance); closeModal(); toast('Marked paid.'); return refresh();
  }
  if ((x = h('[data-remindnow]'))) {
    const inv = INVOICES.find(i => i.id === x.dataset.remindnow);
    const step = DUNNING.find(s => !inv.reminders.some(r => r.day === s.day)) || DUNNING[DUNNING.length - 1];
    const msg = reminderCopy(inv, step);
    OUTBOX.unshift({ id: 'm' + (OUTBOX.length + 1), contactId: inv.contactId, channel: 'Email', dir: 'out',
      subject: msg.subject, body: msg.body, at: now(), from: ACCOUNT.sendingEmail,
      label: 'Payment reminder · sent by hand', track: 'billing', invoiceId: inv.id });
    inv.reminders.push({ day: step.day, at: now() });
    closeModal(); toast('Payment reminder sent — follow-up untouched.'); return refresh();
  }
  if ((x = h('[data-eiadd]'))) { EDIT_INV.lineItems.push({ desc: '', qty: 1, rate: 0 }); return drawInvoiceEditor(); }
  if ((x = h('[data-eirm]'))) { EDIT_INV.lineItems.splice(+x.dataset.eirm, 1); return drawInvoiceEditor(); }
  if ((x = h('[data-eifadd]'))) { EDIT_INV.additionalFees.push({ label: '', amount: 0 }); return drawInvoiceEditor(); }
  if ((x = h('[data-eifrm]'))) { EDIT_INV.additionalFees.splice(+x.dataset.eifrm, 1); return drawInvoiceEditor(); }
  if ((x = h('[data-pkt]'))) { EDIT_PKG[x.dataset.pkt] = !EDIT_PKG[x.dataset.pkt]; return drawPackageEditor(); }
  if ((x = h('[data-ei-t]'))) { EDIT_INV[x.dataset.eiT] = !EDIT_INV[x.dataset.eiT]; return drawInvoiceEditor(); }
  if ((x = h('[data-saveinv]'))) {
    const draft = x.dataset.saveinv === 'draft';
    if (EDIT_INV.id === 'new') {
      const inv = newInvoice(EDIT_INV.contactId, { ...EDIT_INV, draft });
      Object.assign(inv, { lineItems: EDIT_INV.lineItems, additionalFees: EDIT_INV.additionalFees,
        taxRate: EDIT_INV.taxRate, taxExempt: EDIT_INV.taxExempt, noProcessingFee: EDIT_INV.noProcessingFee,
        discount: EDIT_INV.discount, notes: EDIT_INV.notes, kind: EDIT_INV.kind, draft });
      closeModal(); toast(draft ? 'Draft saved.' : `${inv.id} created and issued.`);
    } else {
      const inv = INVOICES.find(i => i.id === EDIT_INV.id);
      Object.assign(inv, { lineItems: EDIT_INV.lineItems, additionalFees: EDIT_INV.additionalFees,
        taxRate: EDIT_INV.taxRate, taxExempt: EDIT_INV.taxExempt, noProcessingFee: EDIT_INV.noProcessingFee,
        discount: EDIT_INV.discount, notes: EDIT_INV.notes, kind: EDIT_INV.kind, contactId: EDIT_INV.contactId, draft });
      closeModal(); toast('Invoice saved.');
    }
    return refresh();
  }
  if ((x = h('[data-printinv]'))) return printInvoice(x.dataset.printinv);

  /* galleries */
  if ((x = h('[data-editgal]'))) return openGalleryEditor(x.dataset.editgal);
  if (h('[data-newgal]')) return openGalleryEditor(null);
  if (h('[data-savegal]')) {
    const id = $('#glId').value;
    const data = {
      name: $('#glName').value.trim() || 'Untitled gallery',
      contactId: $('#glClient').value,
      photos: +$('#glPhotos').value || 0,
      status: $('#glStatus').value,
      ordered: +$('#glOrdered').value || 0,
      dueAt: Date.parse($('#glDue').value) || now() + 14 * DAY
    };
    if (id === 'new') GALLERIES.push({ id: 'g' + (GALLERIES.length + 1), views: 0, favs: 0, shotAt: now(), ...data });
    else Object.assign(GALLERIES.find(g => g.id === id), data);
    closeModal(); toast('Gallery saved.'); return refresh();
  }


  if (h('[data-clockbar]')) return toast('Use the clock controls at the top of the page to move time forward.');
  if ((x = h('[data-toast]'))) return toast(x.dataset.toast);
  if (h('#burger')) return $('#sb').classList.toggle('open');
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'globalSearch') return drawSearch(t.value);
  if (t.dataset.pk) { EDIT_PKG[t.dataset.pk] = t.type === 'number' ? +t.value : t.value; return; }
  if (t.dataset.pkl != null) { EDIT_PKG.lineItems[+t.dataset.pkl][t.dataset.f] = t.type === 'number' ? +t.value : t.value; return; }
  if (t.dataset.pkf != null) { EDIT_PKG.additionalFees[+t.dataset.pkf][t.dataset.f] = t.type === 'number' ? +t.value : t.value; return; }
  if (t.dataset.tplfield) {
    const tpl = TEMPLATES.find(x => x.id === UI.tplId);
    tpl[t.dataset.tplfield] = t.value; tpl.updatedAt = now();
    const r = renderTemplate(tpl, CONTACTS[0]);
    const p = $('.preview-b'); if (p) p.innerHTML = `<b style="display:block;font-size:14px;margin-bottom:14px;color:var(--muted)">${esc(r.subject)}</b>${r.html}`;
  }
  if (t.dataset.blk != null) {
    const tpl = TEMPLATES.find(x => x.id === UI.tplId);
    tpl.blocks[+t.dataset.blk][t.dataset.bf] = t.value; tpl.updatedAt = now();
    const r = renderTemplate(tpl, CONTACTS[0]);
    const p = $('.preview-b'); if (p) p.innerHTML = `<b style="display:block;font-size:14px;margin-bottom:14px;color:var(--muted)">${esc(r.subject)}</b>${r.html}`;
  }
  if (t.hasAttribute && t.hasAttribute('data-tplhtml')) {
    const tpl = TEMPLATES.find(x => x.id === UI.tplId); tpl.html = t.value;
    const r = renderTemplate(tpl, CONTACTS[0]);
    const p = $('.preview-b'); if (p) p.innerHTML = r.html;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); closeModal(); }
  if (e.key === 'Enter' && e.target.id === 'aiInput') { const v = e.target.value; e.target.value = ''; aiAsk(v); }
});
