}
function openDailyReport() {
  const r = sinceLastLogin();
  modal(`Welcome back, ${meUser().name.split(' ')[0]}`, `
    <p style="margin:0 0 16px;font-size:13.5px;color:var(--body);line-height:1.6">
      Here is what happened since ${fmtDT(r.since)}.</p>
    <div class="stats" style="margin-bottom:14px">
      ${st('New enquiries', r.newEnq.length, 'auto-enrolled')}
      ${st('Replies', r.replies.length, 'follow-up paused')}
      ${st('Sent for you', r.sends.length, 'while away')}
    </div>
    ${r.ev.slice(0, 8).map(e => `<div class="rowi" style="padding:9px 0">
      <span class="sig-ic" style="background:${evColor(e.kind)}1a;color:${evColor(e.kind)}">${I(evIcon(e.kind), 14)}</span>
      <span class="tx"><b style="font-weight:500;font-size:13px">${esc(e.text)}</b><span>${fmtDT(e.at)}</span></span></div>`).join('')
    || '<p class="hint">Quiet stretch — nothing happened.</p>'}
    ${r.bdays.length ? `<div class="warnbox" style="margin-top:14px;background:#fdf2f8;border-color:#fbcfe8">${I('heart', 17)}
      <p><b>${r.bdays.map(c => c.name).join(', ')}</b> ${r.bdays.length === 1 ? 'has' : 'have'} a birthday today. The birthday message has already gone out.</p></div>` : ''}`,
    `<div class="sp"><button class="btn-dark" data-mclose>${I('check', 15)}Start the day</button></div>`);
}

/* ============================ TOAST ============================ */
let tT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => t.classList.remove('on'), 2800); }

/* ============================ EVENTS ============================ */
document.addEventListener('click', async e => {
  const h = s => e.target.closest(s);
  let x;

  if ((x = h('[data-go]'))) return go(x.dataset.go);
  if (h('[data-close]') || e.target.id === 'scrim') return closeDrawer();
  if (h('[data-mclose]')) return closeModal();

  /* clock */
  if ((x = h('[data-adv]'))) {
    const k = x.dataset.adv;
    if (k === 'next') {
      const t = nextDueAt();
      if (!t) return toast('Nothing scheduled.');
      advance(t - now() + 60e3);
      toast('Ran forward to the next automated message.');
    } else {
      advance({ '1h': HOUR, '1d': DAY, '1w': 7 * DAY }[k]);
      toast('Studio clock advanced. Automations ran.');
    }
    return refresh();
  }

  /* records */
  if ((x = h('[data-open]'))) { e.preventDefault(); return openDrawer(x.dataset.open); }
  if ((x = h('[data-pick]'))) {
    const id = x.dataset.pick;
    UI.sel.has(id) ? UI.sel.delete(id) : UI.sel.add(id);
    x.classList.toggle('on'); x.closest('tr').classList.toggle('sel'); return syncBulk();
  }
  if (h('[data-all]')) {
    const rows = $$('[data-row]'); const all = rows.every(r => UI.sel.has(r.dataset.row));
    rows.forEach(r => all ? UI.sel.delete(r.dataset.row) : UI.sel.add(r.dataset.row));
    return refresh();
  }
  if ((x = h('[data-row]')) && !h('[data-pick]')) return openDrawer(x.dataset.row);
  if ((x = h('[data-sort]'))) {
    const k = x.dataset.sort;
    UI.sort = { key: k, dir: UI.sort.key === k ? -UI.sort.dir : -1 }; return refresh();
  }
  if ((x = h('[data-page]'))) { UI.page = +x.dataset.page; return refresh(); }
  if (h('#bulkClear')) { UI.sel.clear(); return refresh(); }
  if (h('[data-bulkenrol]')) {
    let n = 0; UI.sel.forEach(id => { if (enrol(id, 'Added by hand')) n++; });
    UI.sel.clear(); toast(`${n} people added to follow-up.`); return refresh();
  }
  if (h('[data-bulkstop]')) {
    UI.sel.forEach(id => unenrol(id, 'Stopped by hand'));
    const n = UI.sel.size; UI.sel.clear(); toast(`Follow-up stopped for ${n}.`); return refresh();
  }

  /* follow-up */
  if ((x = h('[data-startfu]'))) { enrol(x.dataset.startfu, 'Started by hand'); toast('Follow-up started — first message sent.'); tick(); openDrawer(x.dataset.startfu); return refresh(); }
  if ((x = h('[data-stopfu]'))) { unenrol(x.dataset.stopfu, 'Stopped by hand'); toast('Follow-up stopped.'); openDrawer(x.dataset.stopfu); return refresh(); }
  if ((x = h('[data-hold]'))) { placeHold(x.dataset.hold, 7); toast('7-day hold placed. It releases itself.'); openDrawer(x.dataset.hold); return refresh(); }
  if ((x = h('[data-releasehold]'))) { HOLDS = HOLDS.filter(hh => hh.id !== x.dataset.releasehold); toast('Date released.'); return refresh(); }

  /* inbox */
  if ((x = h('[data-th]'))) { UI.thread = x.dataset.th; return refresh(); }
  if ((x = h('[data-simreply]'))) {
    receiveReply(x.dataset.simreply, 'Thanks for following up — we are still deciding, can you send the album options?');
    toast('Reply received. Follow-up paused 48 hours, then restarts at step 1 with new wording.');
    return refresh();
  }
  if ((x = h('[data-reply]'))) {
    const t = $('#composer'); if (!t.value.trim()) return toast('Write something first.');
    send(x.dataset.reply, 'Email', { subject: 'Re: your enquiry', body: t.value.trim() }, { label: 'Sent by you' });
    toast('Sent from ' + ACCOUNT.sendingEmail); return refresh();
  }

  /* AI */
  if (h('[data-ai]')) return openAI();
  if ((x = h('[data-aiq]'))) return aiAsk(x.dataset.aiq);
  if (h('[data-aisend]')) { const v = $('#aiInput').value; $('#aiInput').value = ''; return aiAsk(v); }
  if ((x = h('[data-aidraft]')) || (x = h('[data-draftfor]')))
    return aiDraft(x.dataset.aidraft || x.dataset.draftfor);
  if ((x = h('[data-senddraft]'))) {
    send(x.dataset.senddraft, 'Email', { subject: 'A note from ' + ACCOUNT.studio, body: $('#draftBox').value }, { label: 'Sent by you' });
    closeModal(); toast('Sent.'); return refresh();
  }

  /* marketing */
  if ((x = h('[data-tpl]'))) { UI.tplId = x.dataset.tpl; return refresh(); }
  if ((x = h('[data-addblk]'))) {
    const t = TEMPLATES.find(t => t.id === UI.tplId);
    const type = x.dataset.addblk;
    t.blocks.push(type === 'button' ? { t: 'button', v: 'Click here', href: 'https://' }
      : type === 'gallery' ? { t: 'gallery', v: '3' }
        : type === 'image' ? { t: 'image', v: '', caption: 'Image' }
          : type === 'divider' ? { t: 'divider' } : { t: type, v: '' });
    return refresh();
  }
  if ((x = h('[data-rmblk]'))) { TEMPLATES.find(t => t.id === UI.tplId).blocks.splice(+x.dataset.rmblk, 1); return refresh(); }
  if ((x = h('[data-mvblk]'))) {
    const b = TEMPLATES.find(t => t.id === UI.tplId).blocks, i = +x.dataset.mvblk, j = i + (+x.dataset.dir);
    if (j < 0 || j >= b.length) return;
    [b[i], b[j]] = [b[j], b[i]]; return refresh();
  }
  if (h('[data-newtpl]')) {
    const id = 'tpl' + (TEMPLATES.length + 1);
    TEMPLATES.push({ id, name: 'Untitled template', subject: 'Subject line', kind: 'built', updatedAt: now(), blocks: [{ t: 'heading', v: 'Hello {{first_name}}' }, { t: 'text', v: '' }] });
    UI.tplId = id; go('marketing'); return toast('Template created.');
  }
  if (h('[data-newcamp]')) return openNewCampaign();
  if (h('[data-savecamp]')) {
    const name = $('#cmName').value.trim() || 'Untitled campaign';
    CAMPAIGNS.push({
      id: 'cm' + (CAMPAIGNS.length + 1), name, templateId: $('#cmTpl').value,
      segment: segFromValue($('#cmSeg').value), schedule: $('#cmSched').value,
      channel: $('#cmCh').value, on: true, lastRun: null, sent: 0
    });
    closeModal(); toast('Campaign created and switched on.'); return refresh();
  }
  if ((x = h('[data-runcamp]'))) {
    const n = runCampaign(CAMPAIGNS.find(c => c.id === x.dataset.runcamp), true);
    toast(n ? `Sent to ${n} ${n === 1 ? 'person' : 'people'}.` : 'Nobody matches that group right now.');
    return refresh();
  }
  if ((x = h('[data-campon]'))) {
    const cm = CAMPAIGNS.find(c => c.id === x.dataset.campon); cm.on = !cm.on;
    toast(`${cm.name} ${cm.on ? 'switched on' : 'paused'}.`); return refresh();
  }
  if ((x = h('[data-usetpl]'))) { openNewCampaign(); setTimeout(() => { $('#cmTpl').value = x.dataset.usetpl; }, 40); return; }

  /* team */
  if (h('[data-adduser]')) return openAddUser();
  if (h('[data-saveuser]')) {
    const n = $('#nuName').value.trim(); if (!n) return toast('Name is required.');
    TEAM.push({ id: 'u' + (TEAM.length + 1), name: n, email: $('#nuEmail').value.trim() || 'new@willowandivy.com', role: $('#nuRole').value, title: $('#nuTitle').value.trim() || 'Team member', active: true });
    closeModal(); toast('Login created. A seat has been used.'); return refresh();
  }
  if ((x = h('[data-rmuser]'))) {
    const t = TEAM.find(u => u.id === x.dataset.rmuser), r = canRemove(meUser(), t);
    if (!r.ok) return toast(r.why);
    TEAM = TEAM.filter(u => u.id !== t.id);
    toast(`${t.name} removed. That seat is free again.`); return refresh();
  }
  if ((x = h('[data-role]'))) {
    const t = TEAM.find(u => u.id === x.dataset.role), r = canChangeRole(meUser(), t);
    if (!r.ok) return toast(r.why);
    t.role = t.role === 'Co-admin' ? 'Member' : 'Co-admin';
    toast(`${t.name} is now a ${t.role.toLowerCase()}.`); return refresh();
  }

  /* misc */
  if (h('[data-sales]')) return openSales();
  if (h('[data-newlead]')) return openNewLead();
  if (h('[data-savelead]')) {
    const n = $('#nlName').value.trim(); if (!n) return toast('Name is required.');
    const b = new Date($('#nlBday').value || '1994-06-12');
    const c = {
      id: 'c' + (CONTACTS.length + 1), name: n,
      email: $('#nlEmail').value.trim() || 'new@example.com', phone: $('#nlPhone').value.trim() || '(214) 555-0000',
      stage: 'New enquiry', session: $('#nlSession').value, score: 55,
      source: $('#nlSource').value, ownerId: ME, city: 'Dallas', venueId: null,
      shootDate: Date.parse($('#nlDate').value) || now() + 90 * DAY,
      birthday: { m: b.getUTCMonth(), d: b.getUTCDate() },
      value: 3200, createdAt: now(), lastInbound: null, optedOut: false, tags: [], signals: [], activity: []
    };
    c.activity.push({ at: now(), kind: 'enquiry', text: `Enquiry received from ${c.source}` });
    CONTACTS.push(c); enrol(c.id, c.source); tick();
    closeModal(); toast('Enquiry saved — email and text sent immediately.');
    go('enquiries'); return openDrawer(c.id);
  }
  if (h('[data-clockbar]')) return toast('Use the clock controls at the top of the page to move time forward.');
  if ((x = h('[data-toast]'))) return toast(x.dataset.toast);
  if (h('#burger')) return $('#sb').classList.toggle('open');
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.tplfield) {
    const tpl = TEMPLATES.find(x => x.id === UI.tplId);
    tpl[t.dataset.tplfield] = t.value; tpl.updatedAt = now();
    const r = renderTemplate(tpl, CONTACTS[0]);
    const p = $('.preview-b'); if (p) p.innerHTML = `<b style="display:block;font-size:14px;margin-bottom:14px;color:var(--muted)">${esc(r.subject)}</b>${r.html}`;
  }
  if (t.dataset.blk != null) {
    const tpl = TEMPLATES.find(x => x.id === UI.tplId);
    tpl.blocks[+t.dataset.blk][t.dataset.bf] = t.value; tpl.updatedAt = now();
    const r = renderTemplate(tpl, CONTACTS[0]);
    const p = $('.preview-b'); if (p) p.innerHTML = `<b style="display:block;font-size:14px;margin-bottom:14px;color:var(--muted)">${esc(r.subject)}</b>${r.html}`;
  }
  if (t.hasAttribute && t.hasAttribute('data-tplhtml')) {
    const tpl = TEMPLATES.find(x => x.id === UI.tplId); tpl.html = t.value;
    const r = renderTemplate(tpl, CONTACTS[0]);
    const p = $('.preview-b'); if (p) p.innerHTML = r.html;
  }
});
document.addEventListener('change', e => {
  if (e.target.hasAttribute('data-plan')) {
    ACCOUNT.plan = e.target.value;
    toast(`Switched to ${ACCOUNT.plan}. Limits updated everywhere.`);
    refresh();
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDrawer(); closeModal(); }
  if (e.key === 'Enter' && e.target.id === 'aiInput') { const v = e.target.value; e.target.value = ''; aiAsk(v); }
});

/* ============================ BOOT ============================ */
boot();
renderSidebar();
go('today');
if (UI.showReport) setTimeout(openDailyReport, 450);
</script>
<script>
  (function(){
    var mq = window.matchMedia('(max-width:1000px)');
    function sync(){ document.getElementById('burger').style.display = mq.matches ? 'grid' : 'none'; }
    mq.addEventListener('change', sync); sync();
  })();
</script>
